<script id="atlas-data" type="application/json">{"articles": [{"id": 1, "title": "Grok 机器人为什么烧钱：Harness 学习笔记", "category": "AI 与 Agent", "tags": ["Harness", "Agent", "Grok", "多机器人", "成本"], "summary": "读 Iron Giant 长文后自己重写的学习笔记：四层分工、Harness 六个零件、Jev 决策层的成本账、Swarm 规则、三个例子与上线前检查清单。", "pinned": true, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "grok-harness", "source_note": "来源：X 长文《Your Grok Bot Is Burning Money - Harness Fixes It》（Iron Giant @irongiantXBT），原文 https://x.com/irongiantXBT/status/2122662343306059780 。笔记正文来自 your_files/Grok-Harness-离线版/Grok-Bot-Harness-学习笔记.md；同目录的概要版 Grok-Bot-Harness.md 与 Grok-Bot-Harness-摘要.md 已并入本条，不单独收录。9 张配图已内嵌于正文，随知识库一同保存，离线可看。", "file": "01-grok-harness.md", "body": "\n# Grok 机器人为什么烧钱：Harness 学习笔记\n\n## 问题出在哪：一个机器人干所有事 <!-- toc: 问题出在哪 -->\n\n<!-- lead -->\n很多人的用法是：只开一个 Grok 机器人，让它写东西、选路线、做判断、批申请、还直接跑命令。这样有三个毛病：\n\n1. **慢**：每一步都要等大模型用自然语言想一遍。\n2. **贵**：很多步骤根本不是在写作，而是在做一个小决定，却也要按大模型的价格付费，还带着巨大的上下文。\n3. **乱**：没有边界，半夜三点也可能自己干出奇怪的事。\n\n作者举了一个例子：2026 年 7 月，Cursor 把一份 835 页的新编程语言规范交给一群 Agent，16 天后拿回了一个能用的编译器，中间没有人碰过代码。这说明问题不在模型本身，而在外面的组织方式。\n\n这就引出我们之前聊过的那句话：**Agent = 模型 + Harness**。模型一样，Harness 不同，出来的 Agent 就完全不同。\n\n## 四层分工：各干各的 <!-- toc: 四层分工 -->\n\n作者的方案是把工作拆成四层：\n\n- LAYER 01 · WRITES\n  **Grok 负责写**：写代码、写草稿、做规划，这是它最擅长的事。\n- LAYER 02 · DECIDES\n  **Jev 负责决定**：选哪个、打几分、行不行，只做判断，不写长文。\n- LAYER 03 · ENFORCES\n  **Harness 负责管规矩**：定流程、卡边界、留记录。\n- LAYER 04 · SCALES\n  **Swarm 负责扩展**：人手不够时加人，而不是让一个人加班。\n\n![图 1 · 四层 Agent 结构：请求从上进，交付从下出](kbimg:02-layers.jpg)\n\n这个分法的好处是：贵的模型只留在真正需要它动脑的地方，小决定不再按大模型的价格结算。\n\n## Harness 到底是什么 <!-- toc: Harness 是什么 -->\n\nHarness 不是模型，而是模型外面那一圈东西：让它循环跑起来的流程、它能碰的工具、它不能破的规则、它留下的文件。作者认为一个能用的 Harness 要有六个零件：\n\n1. **一个只管分派的主管**：负责接需求、拆任务、盯进度，自己不动手执行。\n2. **每个机器人一份职责说明**：写清楚它负责什么结果、能信哪些来源、用什么标准判断好坏、最后交什么文件、绝对不能碰什么。\n3. **一个共享工作区**：用文件而不是聊天记录来传活，这样换人、换机器人，上下文也不会丢。能长期留的文件放工作区，临时的放临时目录。\n4. **三道检查**：来源、证据、行动，第 8 节会细说。\n5. **每次任务结束留一份交接单**：做了什么、改了哪些文件、有什么证据证明、还剩什么、谁负责。\n6. **一本你自己掌控的行动账本**：所有落地的操作都记下来，方便回头查。\n\n![图 2 · PART 1 配图](kbimg:03-part1.jpg)\n\n主管的工作方式大概是这样：收到需求先分类，再选对口的专业机器人，把任务写成文件交给它，等它交回交接单，再把成果汇总成三行摘要给你。只有涉及钱、发布、删除、签名这类不可逆的事，才直接找你。\n\n## 最烧钱的地方：决策层 <!-- toc: 最烧钱的决策层 -->\n\n<!-- lead -->\n这是全文最关键的发现：Agent 循环里的大多数步骤，其实不是在写东西，而是在做决定。\n\n比如：该读哪几个文件？该用便宜模型还是贵模型？这条命令安不安全？做完了吗？这段工具输出要留还是扔？以前这些决定都交给同一个贵模型，用自然语言回答，带着全量上下文，价格自然高。\n\nJev 是 Typesafe AI 的一个专用决策模型，思路完全不同：你把当前状态和几个结构化问题发过去，它直接返回结构化答案，不写散文。问题基本就三种：\n\n- **选一个**：分给哪个组、走哪条路线、用哪个档位。\n- **打个分**：按质量、风险、紧急程度给 1 到 5 分。\n- **是或否**：返回 0 到 1 的概率，比如「能安全发送吗」，0.12 就表示大概率不行。\n\n价格和速度，原文给的数字是：输入每百万 token **0.042 美元**，输出免费，端到端延迟 **70 到 500 毫秒**。\n\n```bill\n算一笔账：一次路由决定\n输入 2,000 token、输出 150 token\nGrok 4.7|$0.0049|输入 $2 / 百万 · 输出 $6 / 百万\n58×\nJev|$0.000084|输入 $0.042 / 百万 · 输出免费\n每天 1 万次这样的决定：约 $49 对 $0.84\n```\n\n![图 3 · PART 2 配图（上）](kbimg:04-part2a.jpg)\n\n![图 4 · PART 2 配图（下）](kbimg:05-part2b.jpg)\n\n作者建议先把五类决定挪过去：**选文件、选模型、判断能不能跑、判断做没做完、判断工具输出留不留**。做法是给 Grok 机器人加一条新习惯：凡是遇到选、评分、是或否，先问 Jev，按结构化答案行动；只有 Jev 没把握、或者决定不可逆时，才升级回 Grok 4.7。\n\n这和我们之前说的 Harness 思路是一致的：大模型动嘴做判断，Harness 负责把判断变成一次便宜、结构化的调用，再把结果传回去。\n\n## Swarm 怎么组才不乱 <!-- toc: Swarm 组队规则 -->\n\nSwarm 不是机器人越多越好，拓扑其实很简单：一个主管，几个专业小组，共用一条总线和一个工作区。SpaceX AI 的人也是这么描述他们自己的系统的。作者给了五条组队规则：\n\n1. **按瓶颈招人，不按应用招人**：不要搞「邮箱机器人」「浏览器机器人」，要看哪里卡住了，再补一个专门解决那个瓶颈的机器人。\n2. **先从主管加一个专家开始**：只有活真的排队等了，才加下一个。\n3. **小组之间用文件加一个线程沟通**：不要拉长聊天，任务和结果都落在工作区里。\n4. **写代码交给隔离环境的云端 Agent**：Grok 机器人只负责把关结果，不直接在本地乱改。\n5. **最后由一个中立的合并机器人统一落地**：它不写功能，只检查交接单在不在、测试过没过、有没有不可逆操作混进来，通过了才合入，缺东西就打回去，并把每次落地记到行动账本里。\n\n![图 5 · PART 3 配图](kbimg:06-part3.jpg)\n\n一个账号最多可以有 50 个机器人加群聊，作者的意思是：你根本用不了那么多，先少后多。\n\n## 全栈对照：谁干什么、跑在哪、花多少钱 <!-- toc: 全栈对照表 -->\n\n| 层 | 干什么 | 跑在什么上 | 花你什么 |\n|---|---|---|---|\n| Grok | 写代码、写草稿、做规划 | Grok 4.7 | 输入 $2 / 百万，输出 $6 / 百万 |\n| Jev | 路由、打分、说是或否 | Jev 1.13.0 | 输入 $0.042 / 百万，输出免费 |\n| Harness | 职责说明、检查、交接、记账 | 工作区 + 技能 | 你一次性的搭建时间 |\n| Swarm | 并行的专家小组 + 合并 | Grok 机器人 + 云端代码 Agent | 机器人越多 token 越多，所以要慢慢加 |\n\n> 贵的模型还在环里，只是不再为每一个小决定付费了。\n\n![图 6 · PART 4 配图](kbimg:07-part4.jpg)\n\n## 三个例子：这套东西落到具体活上是什么样 <!-- toc: 三个落地例子 -->\n\n### 例子 1 · 邮箱分流 —— 最适合先做的 Swarm\n\n1. 收件机器人每小时读一次新邮件。\n2. 每封邮件问 Jev 三个问题：分给哪个组、紧急程度 1 到 5 分、要不要先找人再动手。\n3. 只有紧急程度不高、且「需要人」的概率很低时，才由回复机器人起草回复。\n4. 其余的都连同草稿一起放进待审批区。\n5. 主管每天 9 点和 17 点各给你发一次汇总。\n\n这个例子好在：判断全是结构化的，风险可控，而且省下的全是重复劳动。\n\n![图 7 · PART 5 配图](kbimg:08-part5.jpg)\n\n### 例子 2 · 内容生产线\n\n- 研究机器人只负责把可信来源收集到研究目录。\n- 写作机器人只能根据这些来源写，不能自己编。\n- 每篇草稿都交给 Jev，从清晰度、证据、钩子三个维度打分。\n- 低于 4 分的打回一次，并指明最弱的一项和一个改法。\n- 两次不过就连同分数一起交给你，永远不自动发布。\n\n关键点是：质量判断也结构化了，改稿有明确依据，而不是「感觉不好，重写一遍」。\n\n### 例子 3 · 代码小组\n\n- Grok 机器人当技术负责人，先把工单拆成能单独测试的小单元。\n- 每个单元派一个云端代码 Agent，范围、验收标准、不做什么是先写好的，两个 Agent 不碰同一批文件。\n- 每个 Agent 跑命令之前，先问 Jev：这条命令会不会删东西、覆盖数据？概率超过阈值就停下来问你。\n- 合并机器人负责合入，你只批不可逆的操作。\n\n这个例子把「快」和「稳」分开了：并行是快，检查是稳。\n\n## 上第二个机器人之前，先过一遍清单 <!-- toc: 上线前检查清单 -->\n\n- 主管先存在，专家后加。\n- 每个机器人都有五项职责说明。\n- 工作区里有研究、草稿、证据、审批、交接这几类目录。\n- 决定走 Jev，写作走 Grok。\n- 每个对外动作都有三道检查。\n- 只有一个合并机器人、一本行动账本。\n- 默认安静，只在出异常时通知你。\n\n### 三道检查，具体是哪三道\n\n- **来源检查**：输入只认你信任的来源，其他的都当作不可信文本，永远不当成指令。\n- **证据检查**：在下结论或发送之前，先引用它来自哪个文件或链接。\n- **行动检查**：在发送、删除、发布、付款这类不可逆操作之前，先停下来问你。检查失败就写进决策记录，然后停下。\n\n每周再做一次复盘：看看 Jev 做了哪些决定、有没有错的，哪些检查被触发了、为什么，Grok 和 Jev 各花了多少钱，下一周先修哪一个瓶颈。复盘不用长，控制在 20 行以内。\n\n![图 8 · PART 6 配图](kbimg:09-part6.jpg)\n\n## 我的理解：落地顺序 <!-- toc: 我的理解：落地顺序 -->\n\n按作者的顺序，也是我觉得最稳的顺序：\n\n主管 → 职责说明 → 工作区 → 三道检查 → Jev → 再加第二个机器人\n\n不要一上来就搭十个机器人。先让主管加一个专家跑通一个小闭环，比如邮箱分流，跑顺了再加内容或代码。\n\n这和我们之前定下来的 Agent 结构完全对得上：模型只负责动嘴和拆解，Harness 负责准备材料、动手执行、传结果、管循环和权限，MCP 是 Harness 对外借本事的一种插口。Jev 在这里就是 Harness 里一个便宜的决策插口，Grok 是贵的写作插口，两个插口分工不同，Harness 负责在中间选对插口、用对价格。\n\n> 这套东西省的是重复决策的钱，不是让你把所有决定都外包出去。不可逆的事，永远要留一个人工确认的口子。\n"}, {"id": 2, "title": "Harness 到底在干嘛：一句话讲清", "category": "AI 与 Agent", "tags": ["Harness", "Agent", "概念图"], "summary": "一句话：大模型只动嘴，Harness 负责动手、传话、兜底。以“修登录闪退”为例走一遍完整流程。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "harness-explainer", "source_note": "来源：your_files/harness-diagram.md（配套有同名 HTML / PDF / PNG 图）。", "file": "02-harness-explainer.md", "body": "\n# Harness 到底在干嘛？\n\n一句话：大模型只动嘴，Harness 负责动手 + 传话 + 兜底\n\n![Harness 流程图：大模型只动嘴，Harness 负责动手、传话、兜底](kbimg:harness-diagram.png)\n\n## 流程（以“修登录闪退”为例）\n\n```\n① 你：说一句话 “修登录闪退”\n        ↓\n② HARNESS · 准备材料\n   把你的话 + 相关文件 + 能用的工具清单，打包好喂给大模型\n   它不思考，只负责“拼材料、递话”\n        ↓\n③ 大模型 · 只动脑、只动嘴\n   决定下一步：“先读登录代码”\n   它自己不会读文件、改代码、跑测试\n        ↓\n④ HARNESS · 动手干活\n   读文件、改一行代码、跑测试\n   再把真实结果贴回去：文件内容 / 测试报错\n        ↓\n   ↺ 循环 ③ → ④，直到大模型说“修好了”\n        ↓\n⑤ 收尾：Harness 停下来，向你汇报改了什么\n```\n\n## Harness 顺手还管这些（防失控）\n\n- 工具清单：能调哪些工具\n- 上下文：一次喂多少文件\n- 权限：哪些文件能改 / 不能改\n- 上限：试几次就停，不死循环\n- 留记录：每步都记下来给你检查\n- 目标：盯着你的任务不跑偏\n\n## 分清四个词\n\n- 大模型 = 大脑，只会说话\n- Harness = 身体 + 管家，动手 + 传话\n- Agent = 大脑 + 身体 + 一个目标\n- Codex = 打包好的 Agent：GPT + 自家 Harness + 命令行外壳\n\n## 关键纠正\n\n拆解不是 Codex 在外面先拆，是大模型自己拆；\n循环也不只是“再问一次”，关键是中间 Harness 真的动手改了、跑了。\n"}, {"id": 3, "title": "小米 AX3600 刷 OpenWrt 做旁路由完整教程（定版）", "category": "网络与路由", "tags": ["AX3600", "OpenWrt", "OpenClash", "AdGuardHome", "旁路由"], "summary": "BE7200 Pro 当主路由、AX3600 刷 OpenWrt 做旁路由的完整定版教程：降级开 SSH、刷机、OpenClash 分流与 AdGuardHome 去广告，全程可照着走通。", "pinned": true, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "ax3600-openwrt", "source_note": "来源：your_files/AX3600旁路由完整教程.md（294 行定版）。早期草稿《小米AX3600刷OpenWrt旁路由教程.md》内容已被定版覆盖，不单独收录。", "file": "03-ax3600-openwrt.md", "body": "\n# 小米 AX3600 刷 OpenWrt 做旁路由（OpenClash + AdGuardHome）完整教程\n\n> 目标：BE7200 Pro 继续当主路由（拨号 + WiFi），闲置的 AX3600 刷 OpenWrt 后做**旁路由**，\n> 承担代理分流（OpenClash）和去广告 DNS（AdGuardHome）。\n> 想走软路由的设备把网关/DNS 指向它，不想走的设备完全不受影响。\n\n## 0. 先看懂拓扑（动手前花 2 分钟）\n\n```\n光猫 ── BE7200 Pro（主路由，192.168.31.1，管拨号和 WiFi）\n          │\n          │ 网线（LAN 口对 LAN 口，AX3600 的 WAN 口空着不用）\n          │\n        AX3600（旁路由，192.168.31.2，WiFi 关闭）\n```\n\n- 你的手机/电脑想走软路由时：手动把网关设为 192.168.31.2，DNS 设为 192.168.31.2。\n- 数据流向：设备 → AX3600（Clash 分流 / AdGuardHome 过滤）→ BE7200 Pro → 光猫 → 外网。\n- 全程用**网线**把电脑连 AX3600 操作，不要用 WiFi 刷机。\n\n**需要准备**：AX3600 及电源、一根网线、一台 Win11 电脑（自带 `ssh`/`scp` 命令）。\n\n---\n\n## 1. 恢复出厂，确认固件版本\n\n1. AX3600 通电，**不接任何网线**。长按机身 Reset 孔 5 秒以上，看到指示灯变橙色后松手，等待 2~3 分钟重启完成。\n2. 电脑用网线连 AX3600 的 **LAN 口**（4 个口随便一个，别插 WAN 口）。\n3. 浏览器打开 `http://192.168.31.1`，按初始化向导随便设个 WiFi 名和管理密码（管理密码记下来，后面降级登录要用）。\n4. 进后台看固件版本（一般在\"系统状态\"或\"路由设置→系统升级\"里）。\n   - 如果版本是 **1.0.17**：直接跳到第 3 步。\n   - 如果版本**高于** 1.0.17：必须先降级，看第 2 步。（开 SSH 用的漏洞在新版里已经被堵上了）\n\n---\n\n## 2.（仅高版本需要）降级到 1.0.17\n\n1. 在电脑上下载降级固件（小米官方 CDN 直链，已验证可访问，纯文本长按复制）：\n   `https://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/rom/r3600/miwifi_r3600_firmware_5da25_1.0.17.bin`\n   - 文件名：`miwifi_r3600_firmware_5da25_1.0.17.bin`\n   - 大小：**28,312,508 字节**（约 27.0 MiB）。下完对一下大小，差一位都别用。\n2. 浏览器登录 `http://192.168.31.1`，登录后看地址栏，把 `stok=` 后面那一长串字符复制下来（后面也要用）。\n3. 在浏览器地址栏粘贴（把 `<STOK>` 换成你刚复制的那串）：\n   `http://192.168.31.1/cgi-bin/luci/;stok=<STOK>/web/setting/upgrade`\n   这是\"手动升级\"页面。点\"选择文件\"，上传第 1 步下载的 bin，开始升级。\n4. 等待 3~5 分钟，指示灯变蓝常亮表示完成。浏览器重新打开 `http://192.168.31.1` 登录。\n   （如果提示密码不对，用你第 1 步里设的管理密码；实在不行 Reset 重来一次。）\n\n---\n\n## 3. 一键开启 SSH\n\n1. 登录 `http://192.168.31.1`，从地址栏复制新的 `stok=` 后面的字符串。\n2. 把下面这串地址里的 `<STOK>` 替换掉，在**浏览器地址栏**粘贴后回车（纯文本，长按复制）：\n   `http://192.168.31.1/cgi-bin/luci/;stok=<STOK>/api/xqsystem/upgrade_rom?url=%3Bnvram%20set%20ssh_en%3D1%3Bnvram%20commit%3Bsed%20-i%20%27s%2Fchannel%3D.*%2Fchannel%3D%22debug%22%2Fg%27%20%2Fetc%2Finit.d%2Fdropbear%3B%2Fetc%2Finit.d%2Fdropbear%20start%3Becho%20-e%20***%7Cpasswd%20root%3B`\n3. 页面返回 `{\"code\":0}` 即成功。这串命令一次做完四件事：打开 SSH 开关并保存、启动 SSH 服务、把 root 密码设为 ***。\n4. 在电脑上按 `Win+R` 输入 `cmd` 回车，输入：\n   `ssh root@192.168.31.1`\n   提示输入密码时输入 ***（输入时不显示，输完回车）。看到 `root@XiaoQiang:~#` 就表示进去了。\n5. **如果 root 登不上**：说明密码没设成功。备选方案是去网上搜\"小米路由器 SSH 密码计算器\"，输入机身标签上的 SN 算出密码再登。算出来也登不上就回到第 1 步重来（多半是固件版本不对）。\n\n---\n\n## 4. 备份重要分区（5 分钟，变砖保险）\n\n在刚才的 SSH 窗口里逐行执行：\n\n```\ncd /tmp\nnanddump -f mtd8-art.bin /dev/mtd8\nnanddump -f mtd9-bdata.bin /dev/mtd9\nnanddump -f mtd10-crash.bin /dev/mtd10\nls -lh mtd*.bin\n```\n\n- mtd8 是 ART（WiFi 射频校准数据，丢了 WiFi 就残了），mtd9 是 bdata（设备身份信息），mtd10 是 crash。\n- 然后在**电脑的 cmd** 里（不是 SSH 里）执行，把备份拉回电脑妥善保存：\n  `scp root@192.168.31.1:/tmp/mtd*.bin D:\\backup\\ax3600\\`\n  （先在 D 盘建好 `D:\\backup\\ax3600` 文件夹；密码还是 ***；第一次会问 `yes/no`，输 `yes`。）\n\n---\n\n## 5. 下载 OpenWrt 固件\n\n打开 `https://firmware-selector.openwrt.org/`，搜索框输入 `ax3600`，版本选 **25.12.6**（当前稳定版；24.10 系列已于 2026-09-30 停止安全更新，不建议再用），下载下面两个文件：\n\n| 文件 | 大小 | SHA256（下载后可校验） |\n|---|---|---|\n| `openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-initramfs-factory.ubi` | 14,942,208 字节（约 14.25 MiB） | `994f415609a058ee44ab4fa92712c0cdb4e754aabb0abb0a70a0d0d9652ec357` |\n| `openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-squashfs-sysupgrade.bin` | 13,568,307 字节（约 12.94 MiB） | `b4d26d71e913a12e9f35a362cc360d8de9e513563b8bbe1e7c8dc43796726729` |\n\n> 注意：24.10 开始 AX3600 的 target 从 `ipq807x/generic` 改成了 `qualcommax/ipq807x`，\n> 老教程里的旧版文件名对不上是正常的，认准 `qualcommax-ipq807x-xiaomi_ax3600` 就行。\n\n---\n\n## 6. 刷入 OpenWrt（分两步，约 10 分钟）\n\n### 6.1 把过渡镜像传进路由器并改短文件名\n\n在电脑 cmd 里：\n\n```\nscp D:\\openwrt\\openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-initramfs-factory.ubi root@192.168.31.1:/tmp/factory.ubi\n```\n\n（把 `D:\\openwrt\\` 换成你实际存放固件的文件夹。）\n\n### 6.2 查当前启动分区，刷入非当前分区\n\nSSH 登录路由器，执行：\n\n```\nfw_printenv flag_boot_rootfs\n```\n\n看返回结果，二选一执行（**不要两组都执行**）：\n\n- 如果返回 `flag_boot_rootfs=1`，执行：\n```\nubiformat /dev/mtd12 -y -f /tmp/factory.ubi -s 2048 -O 2048\nfw_setenv flag_boot_rootfs 0\nfw_setenv flag_last_success 0\nreboot\n```\n- 如果返回 `flag_boot_rootfs=0`，执行：\n```\nubiformat /dev/mtd13 -y -f /tmp/factory.ubi -s 2048 -O 2048\nfw_setenv flag_boot_rootfs 1\nfw_setenv flag_last_success 1\nreboot\n```\n\n原理：AX3600 有双系统分区，这一步只写**当前没在用的那个分区**，先让 OpenWrt 从内存里跑起来验证一遍。\n这一步如果失败，原厂系统还完整躺在另一个分区里，有机会切回去。\n注意：下一步 6.3 正式安装完成后，OpenWrt 会把两个分区合并成一个大分区使用，\n原厂就不再保留在机器里了——届时恢复原厂走第 11 步的官方修复工具，别指望双分区兜底。\n\n### 6.3 进内存中的 OpenWrt，正式安装\n\n1. 等待 2~3 分钟（指示灯变蓝）。**电脑网线仍然直连 AX3600**，浏览器打开 `http://192.168.1.1`\n   （注意：这时 IP 变成了 192.168.1.1，不是 192.168.31.1）。\n2. 第一次进会让你设 root 密码，设一个自己记得住的。\n3. 在电脑 cmd 里把正式固件传进去并改短名：\n   `scp D:\\openwrt\\openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-squashfs-sysupgrade.bin root@192.168.1.1:/tmp/sysupgrade.bin`\n4. SSH 登录（`ssh root@192.168.1.1`，用刚设的密码），执行：\n   `sysupgrade -n /tmp/sysupgrade.bin`\n5. 等待 3 分钟左右，OpenWrt 正式装好。至此刷机完成。\n\n---\n\n## 7. 设为旁路由（基础网络配置）\n\n1. 电脑**仍然网线直连 AX3600**，浏览器打开 `http://192.168.1.1` 登录。\n2. 网络 → 接口 → LAN → 修改 → 基本设置，改成：\n   - IPv4 地址：`192.168.31.2`\n   - IPv4 子网掩码：`255.255.255.0`\n   - IPv4 网关：`192.168.31.1`（你的 BE7200 Pro）\n   - 使用自定义的 DNS 服务器：`192.168.31.1`（先这样，第 9 步会改成 127.0.0.1）\n3. 同一页面下方\"DHCP 服务器\" → 基本设置 → **勾选\"忽略此接口\"**（DHCP 继续由 BE7200 Pro 负责）。\n4. 点\"保存\"，再点\"保存并应用\"。页面会转圈然后断开——**这是正常的**，因为 IP 已经变了。\n5. 现在接线：**AX3600 的 LAN 口** 用网线连到 **BE7200 Pro 的 LAN 口**（AX3600 的 WAN 口永远空着）。\n   电脑的网线也改插到 BE7200 Pro 上（或连 BE7200 Pro 的 WiFi）。\n6. 浏览器打开 `http://192.168.31.2`，能登录就说明旁路由网络通了。\n7. 关 WiFi：网络 → 无线，把 2.4G 和 5G 的两个无线网络都点\"禁用\"（WiFi 交给 BE7200 Pro，AX3600 只当网关）。\n8. 换国内软件源（官方源在国内很慢），SSH 里执行：\n```\ncat /etc/apk/repositories\nsed -i 's|downloads.openwrt.org|mirrors.ustc.edu.cn/openwrt|g' /etc/apk/repositories\ncat /etc/apk/repositories\napk update\n```\n   第二次 `cat` 确认地址已经变成 `mirrors.ustc.edu.cn/openwrt` 开头，`apk update` 不报错即可。\n\n---\n\n## 8. 安装 AdGuardHome（去广告 DNS）\n\n1. SSH 里执行：\n   `apk add adguardhome luci-app-adguardhome`\n   - 如果提示找不到这两个包，停下来告诉我，我给你手动安装官方二进制包的步骤（不需要重来）。\n2. 把 53 端口让给 AdGuardHome（OpenWrt 自带的 dnsmasq 默认占着 53）：\n```\nuci set dhcp.@dnsmasq[0].port='0'\nuci commit dhcp\n/etc/init.d/dnsmasq restart\n/etc/init.d/adguardhome restart\nss -lntp | grep ':53 '\n```\n   最后一条命令应该能看到 `adguardhome` 在监听 53 端口。\n3. 浏览器打开 `http://192.168.31.2:3000` 按向导走：\n   - 网页管理界面端口：3000（默认）\n   - DNS 服务器端口：53（默认）\n   - 设置管理用户名和密码（自己记好）\n   - 上游 DNS 服务器：**先填 `223.5.5.5`**（装完 OpenClash 后再改成 Clash 的 7874 端口，先填个能用的）\n4. 进 AdGuardHome 的\"设置 → DNS 设置\"：Bootstrap DNS 填 `223.5.5.5`，保存。\n\n---\n\n## 9. 安装 OpenClash（代理分流）\n\n### 9.1 下载安装包\n\nOpenClash 的 GitHub Releases 页（仓库 `vernesong/OpenClash`），下载当前最新版 **v0.48.002** 的 apk 包：\n`luci-app-openclash-0.48.002.apk`，大小 **10,702,048 字节**（约 10.21 MiB）。\n（25.12 用 apk 包管理器，`.apk` 和 `.ipk` 别下混。）\n\n### 9.2 安装依赖和主程序\n\n把 apk 传到路由器 `/tmp`（用 scp 或 WinSCP 拖进去），SSH 里执行：\n\n```\napk add dnsmasq-full\napk add bash curl ca-bundle kmod-tun kmod-nft-tproxy\napk add --allow-untrusted /tmp/luci-app-openclash-0.48.002.apk\n```\n\n说明：\n- `dnsmasq-full` 是 OpenClash 安装检查要的完整版 dnsmasq，会替换掉精简版（我们已经把它的 DNS 关了、DHCP 也没开，替换很安全）。\n- `--allow-untrusted` 是因为这个包不是官方源签名的，只对你确认过的文件用。\n- 装完刷新 LuCI，左侧菜单出现\"服务 → OpenClash\"即成功。\n\n### 9.3 下载 Clash 内核\n\n服务 → OpenClash → 全局设置 → 版本更新 → 内核下载：\n- 内核选 **Meta（mihomo）**，架构选 **linux-arm64**（AX3600 是 ARM64），点下载，等待完成。\n- 如果路由器上下载 GitHub 很慢/失败：用电脑从 OpenClash 的 Releases 页下好对应内核文件，\n  通过\"全局设置 → 版本更新 → 上传内核\"传上去也行。\n\n### 9.4 导入订阅并启动\n\n1. 全局设置 → 配置文件订阅 → 新增：粘贴你的机场订阅链接（或你自己的 vless 订阅），保存。\n2. 点\"更新订阅\"，等节点列表出来。\n3. 回到\"运行状态\"/\"配置文件管理\"，选中刚更新的配置文件。\n4. **DNS 设置（关键，决定会不会断网）**：\n   - 本地 DNS 劫持：启用\n   - Fake-IP：启用\n   - NameServer：填 `223.5.5.5`（多个用英文逗号隔开；**千万不要填 127.0.0.1**，否则和 AdGuardHome 互相指形成死循环）\n5. 模式设置：运行模式保持\"规则\"即可，先别开 TUN。\n6. 点\"启动\"。状态页显示运行中即成功。\n\n### 9.5 把 AdGuardHome 的上游接到 Clash\n\n回到 `http://192.168.31.2:3000` → 设置 → DNS 设置：\n- 上游 DNS 服务器改成：`127.0.0.1:7874`（这就是 OpenClash 的 Fake-IP DNS 端口）\n- 保存。\n\n最终 DNS 链路：**设备 → AdGuardHome(:53，去广告) → OpenClash(:7874，按规则分流) → 真实 DNS**。\n代理节点的域名由 Clash 用你填的 223.5.5.5 直接解析，不经过 AdGuardHome，没有循环。\n\n### 9.6 让路由器自身也走这条 DNS\n\n网络 → 接口 → LAN → 修改 → 基本设置 → 自定义 DNS 服务器改成 `127.0.0.1`，保存并应用。\n\n---\n\n## 10. 设备接入 & 验证\n\n1. 在想走软路由的设备上手动设置（以电脑为例）：\n   - IP：192.168.31.x（x 取 100~200 之间没被占用的）\n   - 子网掩码：255.255.255.0\n   - 网关：**192.168.31.2**\n   - DNS：**192.168.31.2**\n2. 验证三件套：\n   - 能正常打开网页 → 旁路由转发通了。\n   - 打开 AdGuardHome 首页（`http://192.168.31.2:3000`），\"查询日志\"里有这台设备的记录，且拦截计数在涨 → 去广告生效。\n   - 在 Clash 里切到\"全局\"模式后访问 `ip.sb`，显示的 IP 变成节点 IP → 代理生效；切回\"规则\"模式，国内网站直连速度正常。\n3. 不想走的设备：什么都不用改，网关/DNS 保持自动（走 BE7200 Pro），完全不受影响。\n\n---\n\n## 11. 回滚与救砖\n\n- **升级 OpenWrt**：去固件选择器下新版 `squashfs-sysupgrade.bin`，LuCI 里系统 → 备份/升级 → 刷写即可（可保留配置）。\n- **过渡阶段起不来（6.2 之后、6.3 之前）**：原厂还完整躺在另一个分区里，\n  断电重启多试几次，bootloader 会按 `flag_last_success` 机制切回原厂分区。\n- **正式装完后回原厂**：用小米官方 **MIWIFIRepairTool** 修复工具——电脑网线直连 AX3600 的 LAN 口，\n  运行工具、选择原厂固件包，工具会通过 TFTP 把官方固件刷回去，恢复出厂状态（小米固件、米家管理都回来）。\n  这是小米官方给的救砖通道，成功率很高，不需要动第 4 步的备份。\n  工具官方直链（979,690 字节的 zip）：`https://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/tools/MIWIFIRepairTool.x86.zip`\n  注意：小米路由器会劫持 `miwifi.com` 域名到本地后台，在家里网络打开小米官网下载页会跳到路由器管理页，\n  属正常现象；上面的 CDN 直链不受劫持影响，可直接下载（或用手机流量打开官网）。\n- **手动 TFTP 救砖**：修复工具不行时，OpenWrt 官方 wiki 有 AX3600 的 debrick 步骤，原理相同、手动操作。\n- 第 4 步备份的 `mtd8-art.bin` 等文件是最后保险，留着别删。\n\n## 12. 日常维护 & 常见问题\n\n- **订阅自动更新**：OpenClash → 全局设置 → 计划任务，打开\"配置文件自动更新\"（每天凌晨一次）。\n- **过滤器更新**：AdGuardHome → 过滤器 → 拦截列表，定期点\"检查更新\"。\n- **装完 Clash 上不了网**：先去 OpenClash 里点\"停止运行\"，看是否恢复；\n  九成是 DNS 环路——检查 NameServer 里有没有 127.0.0.1，有就删掉。\n- **AdGuardHome 的 :3000 打不开**：SSH 里看 `logread | grep -i adguard` 找报错。\n- **53 端口被占**：`ss -lntp | grep ':53 '` 看是谁在监听，应该只有 adguardhome。\n- **部分 UDP 应用（如游戏语音）异常**：试试 OpenClash 里切换到 TUN 模式，或把这台设备网关改回 192.168.31.1 绕开。\n"}, {"id": 4, "title": "小红书图文稿：毕设开题“问题、目标、方法”三段怎么写", "category": "创作与内容", "tags": ["小红书", "毕设开题", "图文稿", "模板"], "summary": "可直接发布的图文稿：标题、发布时间、挂车商品、图片规格与正文全稿，讲清开题报告问题、目标、方法三段如何对齐。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "xiaohongshu-kaiti", "source_note": "来源：your_files/xiaohongshu-kaiti-manuscript.md；内容相同的《毕设开题报告图文稿.md》不重复收录。话题库为 xlsx 表格文件，未纳入文本知识库。", "file": "04-xiaohongshu-kaiti.md", "body": "\n# 毕设开题报告：问题、目标、方法三段怎么写\n## 可直接发布的小红书图文稿\n\n- 标题（主推）：毕设开题总被打回？问题、目标、方法这样写才对得上\n- 备选标题：开题报告别先写背景，先把这三段对齐\n- 发布时间建议：晚上 20:00–22:00\n- 挂车商品：毕设开题三段填空模板（19.9 元，引流款）\n- 图片规格建议：3:4 竖版，1080×1440，内页底色统一，重点词加粗或标色，示例部分用浅色框区分\n- 转化口径：正文和评论区不发网盘链接，引导进主页店铺看商品目录\n\n---\n\n## 封面\n\n大字：\n毕设开题总被打回？\n问题、目标、方法这样写才对得上\n\n小字：\n附三段填空模板 + 对应表\n\n---\n\n## 第 1 页：先对号入座\n\n标题：老师打回的，往往是这三句话\n\n正文：\n- “问题太大，看不出你要解决什么”\n- “目标看不懂，做到了什么算完成？”\n- “方法跟目标没关系”\n\n结尾句：\n不是你写得少，是三段没对上。\n\n---\n\n## 第 2 页：三段其实是一件事\n\n标题：问题 → 目标 → 方法，一条线\n\n正文：\n- 问题：要解决什么\n- 目标：做到什么算完成\n- 方法：用什么手段，怎么证明做到了\n\n结尾句：\n三段不是各写一段，是同一件事的三种说法。\n\n---\n\n## 第 3 页：问题段怎么写\n\n标题：问题段，先写成一句话\n\n句式：\n目前……存在……问题，现有……方法未能解决……，因此本课题研究……。\n\n示例课题：校园社团活动报名与签到小程序\n示例问题：\n报名靠群接龙统计易错，现场签到排队、事后统计靠人工，导致组织者负担重、数据不准。\n\n提醒：\n示例只是结构示范，换成自己的课题重填。\n\n---\n\n## 第 4 页：目标段怎么写\n\n标题：目标段，拆成 3 个能验收的小目标\n\n不要写：\n提高效率、促进发展（没法验收）\n\n示例总目标：\n实现一个可用的校园社团报名与签到小程序。\n\n示例分目标：\n1. 实现报名、签到、统计三个功能\n2. 签到流程能在测试中完整跑通\n3. 通过小范围用户测试收集反馈，做一轮修改\n\n---\n\n## 第 5 页：方法段怎么写\n\n标题：方法段，每个方法都要对应一个目标\n\n对应关系：\n- 文献调研 → 界定问题\n- 需求访谈 → 确定功能\n- 原型开发 → 实现系统\n- 功能测试 + 用户测试 → 验证效果\n\n写法：\n用什么方法、做什么事、产出什么，三个要素缺一不可。\n不要只罗列方法名词。\n\n---\n\n## 第 6 页：对应表（最值得收藏的一页）\n\n标题：画出这张表，脱节一眼就能看出来\n\n| 问题 | 目标 | 方法 |\n| --- | --- | --- |\n| 报名统计易错、签到排队 | 实现报名、签到、统计功能 | 需求访谈 + 原型开发 |\n| 事后统计靠人工、数据不准 | 统计结果自动生成、可导出 | 原型开发 + 功能测试 |\n| 不知道好不好用 | 完成一轮用户测试并修改 | 用户测试 + 修改记录 |\n\n自查句：\n同一行讲不通，就改那一行，不要全篇重写。\n\n---\n\n## 第 7 页：收尾 + 自查清单\n\n标题：发给老师前，先过这 3 条\n\n自查清单：\n1. 问题能不能一句话说清？\n2. 目标能不能验收？\n3. 每个目标有没有对应方法？\n\n转化句：\n完整填空模板和对应表在主页店铺，商品名就是“毕设开题三段填空模板”，可以自己去看目录。\n\n提醒：\n这是结构模板，不是代写。不同学校章节顺序不同，先按自己学校的模板套章节顺序，三段内容不变。\n\n---\n\n## 正文案（发布时直接粘贴）\n\n开题被打回，很多时候不是写得少，是问题、目标、方法三段没对上。问题写得很大，目标写得很空，方法写了一堆名词，老师一看就知道后面做不下去。\n\n我用的检查办法很简单：先把问题写成一句话，再把目标拆成 3 个能验收的小目标，最后每个目标配一个方法，画成一张对应表，同一行讲不通就改。\n\n图里给了句式和一个示例课题的填法，文科、理工换课题也能套，先按自己学校的章节顺序套格式，三段内容不变。完整填空模板在主页店铺，需要的可以自己去看目录。\n\n## 话题标签\n\n#毕设开题 #开题报告 #开题报告怎么写 #毕业论文 #毕设 #大学生 #答辩\n\n---\n\n## 评论区置顶（发布后自己置顶一条）\n\n常见问题先答：\n1. 学校格式不一样怎么办？先按学校模板的章节顺序套，三段内容不变，模板里有替换位置。\n2. 没有实验数据怎么办？方法里写调研加原型加测试验证，不用编数据，测试结果如实写。\n3. 老师说目标太大怎么办？把总目标拆成 3 个可验收的小目标，每个目标只做一件事。\n4. 能不能直接抄示例？示例只是结构示范，换成自己的课题重填，抄过去答辩一问就露馅。\n\n## 发布前检查清单\n\n- [ ] 封面大字不超过两行，图片上没有模板全文\n- [ ] 示例部分已标明“结构示范”，没有承诺通过、包过\n- [ ] 店铺商品已上架，自动发货已自己下一单测通\n- [ ] 商品详情页已写清：包含内容、格式、适用人群、不适用情况、更新政策\n- [ ] 正文和评论区没有网盘链接\n"}, {"id": 5, "title": "开题图文稿第 6 页：三行卡片做图版", "category": "创作与内容", "tags": ["小红书", "做图", "卡片版"], "summary": "第 6 页的做图替代方案：把原表格拆成 3 张卡片，避免手机上表格字糊；规格 3:4 竖版 1080×1440。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "kaiti-cards", "source_note": "来源：your_files/xiaohongshu-kaiti-page6-cards.md，配合《小红书图文稿：毕设开题三段怎么写》使用，只替换第 6 页。", "file": "05-kaiti-cards.md", "body": "\n# 毕设开题第 6 页：做图版（三行卡片，替代原表格）\n\n图片规格：3:4 竖版 1080×1440，每张卡片只放一行。\n\n## 第 6 页标题（卡片上方共用）\n\n画出这张表，脱节一眼就能看出来\n\n---\n\n## 卡片 1\n\n问题：报名统计易错、签到排队\n目标：实现报名、签到、统计功能\n方法：需求访谈 + 原型开发\n\n## 卡片 2\n\n问题：事后统计靠人工、数据不准\n目标：统计结果自动生成、可导出\n方法：原型开发 + 功能测试\n\n## 卡片 3\n\n问题：不知道好不好用\n目标：完成一轮用户测试并修改\n方法：用户测试 + 修改记录\n\n---\n\n## 自查句（放在 3 张卡片下方）\n\n同一行讲不通，就改那一行，不要全篇重写。\n\n## 做图提醒\n\n- 每张卡片一行对应关系，不要把三行挤进一张图。\n- 卡片内三行顺序固定：问题 → 目标 → 方法。\n- 示例仍是“校园社团报名与签到小程序”的结构示范，换课题重填，不要直接抄。\n"}, {"id": 6, "title": "暖暖豚融合版角色设定（路线 ② 可执行版）", "category": "创作与内容", "tags": ["暖暖豚", "角色设定", "水豚", "IP"], "summary": "水豚 IP「暖暖豚」的融合版设定定稿：保留可爱版大眼睛、粉腮红、奶茶色，鼻子改回长方形大鼻头、脸拉长；含已定死的身份项与待查商标类别。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "nuannuan-capybara", "source_note": "来源：your_files/暖暖豚融合版角色设定.md。状态注记：此为路线 ② 的可执行版，原稿标注待确认路线后执行。", "file": "06-nuannuan-capybara.md", "body": "\n# 暖暖豚融合版角色设定（待他定路线 2 后直接执行）\n\n状态：2026-11-06 17:25（北京时间）备好，未经他确认。这份只落实侧聊里他已选过的方向，不替他改定位、不新开路线。\n他最后一次反馈（2026-11-06 16:49）：第一版 8 张“形象有点丑，不够呆萌”，主攻学生群和年轻女性群。\n侧聊里给他留的二选一仍在等他回：① 可爱优先（水豚特征弱一点也接受）；② 两版融合（保留可爱版的大眼睛、粉腮红、奶茶色，把鼻子改回长方形大鼻头、脸再拉长一点点）。\n这份就是路线 ② 的可执行版：他只要回“按融合版做”，不用再复述一遍改法，直接拿去画设定图或发给 Codex。\n\n## 定死的身份（两版都已确认，不动）\n\n- 物种：水豚（卡皮巴拉），不要画成仓鼠、熊、猫\n- 暂定名：暖暖豚（正式上架前先去中国商标网查 9、16、28、35、41 类）\n- 定位一句话：暖暖的，但天塌下来也不急\n- 性格：温暖、淡定、情绪稳定、慢吞吞；核心卖点不是单纯可爱，是“累了还能稳住”的治愈感\n- 主客群：赶毕设、找工作的学生 + 年轻女性\n- 先做静态 8 张测试，动态以后再说，这次不做动态 GIF\n\n## 融合表：每处取哪一版，写死\n\n| 部位 | 融合决定 | 来源 |\n| --- | --- | --- |\n| 脸型 | 长方形打底、边角揉圆：比可爱版拉长约 1/5，比第一版短一点，不再是圆球脸 | 第一版脸太圆像仓鼠/熊；可爱版更圆，水豚特征丢了 |\n| 鼻子 | 改回水豚长方形大鼻头，但边角倒圆、颜色用暖棕不做粉色小鼻子 | 可爱版粉色小鼻子是“像仓鼠”最主要的原因 |\n| 嘴 | 小小的 `w` 形，微微上扬的小微笑（第一版嘴太小太淡，暖的感觉弱） | 第一版自查点 |\n| 眼睛 | 大圆亮晶晶、带睫毛和高光，但上眼睑压下来一点点：大眼睛 + 半分淡定，不做全睁的惊讶眼，也不做半闭的困眼 | 第一版半闭眼像没睡醒；可爱版大眼睛是对的 |\n| 眉毛 | 抬高、平一点，不斜着（斜眉毛看着凶） | 可爱版已改对，保留 |\n| 腮红 | 大大的粉色腮红，保留；不用 `//` 两道线 | 可爱版已改对，保留 |\n| 颜色 | 奶茶色身体 + 奶油肚子，描边用中粗深棕（介于第一版粗描边和可爱版细描边之间）；全套固定 2–3 个主色，不每张换色 | 第一版深橙棕太深太硬；可爱版奶茶色是对的 |\n| 头身比 | 大头小身，头占整体 55%–60%，脸在 240×240 里一眼看清；肚子比第一版小，不占身体一半 | 两版共识 |\n| 叶子 | 只留一片带咬痕的叶子，微微歪一点；开心竖起、累了耷拉（跟着情绪动）。不做可爱版的两片发芽——50×50 下两片会糊成一团 | 咬痕是记忆点；小图清晰优先 |\n| 姿态 | 双手捧在胸前、头微微歪一点的“求抱抱”感保留到中性站姿里 | 可爱版最讨女生喜欢的一点 |\n\n建议色号（只是起稿值，定稿以设定图为准，之后全套锁定不再改）：奶茶棕 #C89B6D、奶油肚 #F7EEDD、深棕描边 #6B4A2F、粉腮红 #F5A8B8、叶绿 #7FB069。\n\n## 不能碰的线（之前已定过）\n\n- 不模仿水豚噜噜（头顶橘子的黄色水豚）、轻松熊、Chiikawa、Loopy、LINE Friends；提示词里不写“像 XX 风格”“XX 同款”\n- 不加黄色光线、不用 `//` 腮红、不用网上抠图和他人字体；表情文字只用下面 8 句\n- 剪影测试：涂黑只看轮廓能认出是它（长脸 + 小耳 + 咬痕叶子 + 大鼻头）\n\n## 8 张静态表情（融合版动作，含之前两处待改）\n\n透明底 PNG，240×240，单张 ≤500KB；同一个角色、同一个脸型、同一套配色，只改动作和表情。\n\n1. 收到：举爪敬礼——手举到耳边（第一版手贴额头像思考，已改），表情认真\n2. OK：比个心、眨一只眼，不用点头，和第 1 张区分开\n3. 哈哈哈：仰头大笑，嘴张大、眼睛弯成弧线\n4. 委屈：抱膝坐着、泪汪汪，唯一一张负面情绪，要画出反差\n5. 抱抱：张开双臂，表情温暖\n6. 谢谢：双手捧一朵小花，只做这一个动作，不再加鞠躬（两动作挤在 240×240 里会糊）\n7. 加油：举起小旗跳跃——双脚离地跳起来（第一版站着举旗没跳起来，已改），懒洋洋的水豚突然跳起来要有反差感\n8. 晚安：盖着小被子躺平睡觉，突出水豚躺平的招牌动作\n\n## 发给 Codex 的提示词（融合版，直接复制）\n\n```text\n请按以下要求，重新设计我的原创水豚 IP 表情包“暖暖豚”，先做静态版，不要做动态。\n\n定位：暖暖的，但天塌下来也不急。温暖、淡定、情绪稳定，适合赶毕设、找工作的学生和年轻女性；核心是“累了还能稳住”的治愈感，不是单纯可爱。\n\n形象（融合版，缺一不可）：\n- 物种是水豚，不要画成仓鼠、熊、猫\n- 脸：长方形打底、边角揉圆，比圆脸拉长约五分之一；小耳朵\n- 鼻子：水豚长方形大鼻头，边角倒圆，暖棕色，不要粉色小鼻子\n- 嘴：小小的 w 形，微微上扬的小微笑\n- 眼睛：大圆亮晶晶，带睫毛和高光，上眼睑压下来一点点——大眼睛加半分淡定，不要全睁的惊讶眼，也不要半闭的困眼；眉毛抬高放平，不要斜着\n- 腮红：大大的粉色腮红，不要 // 两道线\n- 颜色：奶茶色身体、奶油肚子、中粗深棕描边，全套固定 2-3 个主色，不要每张换色\n- 比例：大头小身，头占整体 55%-60%\n- 记忆点：头顶一片带咬痕的小叶子，微微歪着；开心时竖起，累了就耷拉下来\n- 风格：粗描边加平涂色，干净简洁，去掉小图里看不清的细节，不要加黄色光线\n\n不要模仿水豚噜噜（头顶橘子的黄色水豚）、轻松熊、Chiikawa、Loopy、LINE Friends；不要用网上抠图、免费素材、他人字体；表情文字只用下面 8 句。\n\n8 张（透明底 PNG，240x240，单张 ≤500KB；同一角色、同一脸型、同一配色，只改动作和表情）：\n1. 收到：举爪敬礼，手举到耳边，表情认真\n2. OK：比个心、眨一只眼，不要点头\n3. 哈哈哈：仰头大笑，嘴张大、眼睛弯成弧线\n4. 委屈：抱膝坐着、泪汪汪\n5. 抱抱：张开双臂，表情温暖\n6. 谢谢：双手捧一朵小花，只做这一个动作，不要鞠躬\n7. 加油：举起小旗跳跃，双脚离地\n8. 晚安：盖着小被子躺平睡觉\n\n第一步：先出角色设定图（正面、侧面、背面 + 颜色色号），确认不撞款、剪影能认出来；第二步：再按上面 8 张出静态表情图；不要现在做动态。\n```\n\n## 验收（设定图出来后按这 3 条看）\n\n1. 一眼能认出是水豚，不是仓鼠或熊（鼻头 + 长脸是关键）\n2. 涂黑只看剪影也能认出是暖暖豚（咬痕叶子 + 长脸 + 大鼻头）\n3. 缩小到 50×50 聊天图标，脸和动作依然清楚；8 张情绪各不相同，没有两张动作重复\n\n## 备注\n\n- 本文件是文字设定，不是成图：本轮没出新图，设定图和 8 张仍需主 agent 或 Codex 按上面执行。\n- 他如果改选路线 ①（可爱优先），这份作废：直接按可爱版出 8 张，不用再改鼻子和脸型。\n- 和小红书店的关系：IP 以后可作店铺头像/封面/插图，但 19.9 元模板商品仍未上架、自动发货仍未自测——别把这份设定当成那篇笔记已可带转化发布。\n``` \n\n文件：`***\n"}, {"id": 7, "title": "AX3600 代理链泄漏排查与 fail-closed 加固（定版）", "category": "网络与路由", "tags": ["AX3600", "OpenClash", "泄漏排查", "fail-closed", "DNS", "WebRTC"], "summary": "旁路由跑起来之后的安全定版：DNS 定版、STUN 端口 REJECT 堵 WebRTC 泄漏、删 lan→wan 转发实现核心崩溃时全网断流，含检测口径不一致的待确认项。", "pinned": true, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "ax3600-leak", "source_note": "整理自 2026-10-23 至 10-29 的实测记录（泄漏排查与防火墙加固），改写为定版流程；不是对话原文。", "file": "07-ax3600-leak.md", "body": "\n# AX3600 代理链泄漏排查与 fail-closed 加固（定版）\n\n> 定版状态：2026-10-29 DNS 定版、2026-10-23 fail-closed 结构已实施。\n> 前置阅读：先完成《小米 AX3600 刷 OpenWrt 做旁路由完整教程》，本篇是在旁路由跑起来之后，把\"不泄漏\"和\"出故障时不出包\"这两件事做扎实。\n> 红线：在 RackNerd 前置链建成、策略组切回住宅链、复测全绿之前，不在这条连接上登录 Claude。\n\n## 当前链路状态（排查的起点）\n\n- AX3600 的 WAN 是 192.168.31.110/24，分流方式为 TCP Redirect + UDP TProxy。\n- DNS 走 Fake-IP，假地址段 198.18.0.0/16。\n- 当前出口是机场机房节点，不是 Verizon 住宅链——所以这条链目前只适合一般用途，不能碰地区敏感账号。\n\n## 步骤一：DNS 定版（2026-10-29 定版，不要再改）\n\n1. 只保留国外 DoH 作为解析上游，不混用国内解析。\n2. Fake-IP 保持开启。\n3. dnsmasq 的上游唯一指向 `127.0.0.1#7874`（本机 Clash 的 DNS 监听），不要再加第二个上游。\n\n验收：改完后用 browserleaks 重测。2026-10-29 实测结果干净（出口、DNS 均显示美国）。\n\n## 步骤二：堵 STUN / WebRTC 泄漏口（2026-10-27 定版）\n\n现象：Claude 的检测工具报告 DNS / WebRTC 可能泄漏，排查后定位到 STUN 流量绕过了代理。\n\n处理：在分流规则里把目标端口 3478 和 5349（STUN 常用端口）改为 **REJECT**。\n\n- 改完之后未再复发。\n- 代价（已知、接受）：这台 Chrome Profile 开不了网页版 Meet / Zoom 这类 P2P 通话。开会时走 BE7200 主网，或换一个浏览器。\n\n## 步骤三：fail-closed 结构加固（防\"故障\"，不防\"主动切直连\"）\n\n为什么要做：大陆 IP 碰一次 Anthropic 就可能封号。而 OpenClash 核心停止或崩溃时，劫持规则会被清理、路由器 NAT 还在，桌面版在托盘后台的连接就会以真实 IP 自己撞上 Anthropic。节点或订阅挂掉只是连接失败，那是安全态；核心死了才是危险态。\n\n做法（在 AX3600 防火墙里）：\n\n1. 删掉 lan → wan 的区域转发。\n2. 删掉 lan → wan6 的区域转发。\n3. 结果是 Zones 表里 lan ⇒ REJECT：核心一死，192.168.2.x 网段一个包都出不了 WAN。\n\n已知副作用（都可接受、且完全可逆）：\n\n- ICMP ping 不再可用。\n- 如果 2.x 网段访问主网段设备受影响，加两条放行规则：去 192.168.31.0/24、去 192.168.1.0/24。\n\n操作纪律：\n\n- 这套加固防的是核心故障，防不了人主动把模式切成直连。所以维护网络之前，先彻底退出 Claude 三端（桌面版、CLI、网页版）。\n- 待办：保存应用后做一次冒烟测试，再停掉核心做一次断网验收，确认 2.x 网段确实出不了包。\n\n## 踩坑记录\n\n- **检测口径不一致**：2026-10-29 同一天，browserleaks 重测已经干净，但 Claude 的检测工具仍报 DNS / WebRTC 可能泄漏。此条未最终确认——以后复测时以两个工具交叉验证为准，不要只信一边。\n- **STUN 端口 REJECT 是一把双刃剑**：堵住了泄漏，也堵掉了网页版视频会议的 P2P 通话。先想清楚哪台设备要开会，再决定规则加在哪个 Profile / 网段上。\n- **真正的风险不是节点挂掉，是核心死掉**：节点故障 = 连不上（安全）；核心崩溃 + NAT 还在 = 真实 IP 裸奔（危险）。加固要针对后者。\n"}, {"id": 8, "title": "Claude 账号防封与付款完整流程（定版）", "category": "账号与服务", "tags": ["Claude", "防封", "付款", "KYC", "住宅IP"], "summary": "从出口、账号、时区到付款与 KYC 的整套定级流程：保留旧号、住宅链式出口、iOS 礼品卡优先、月付 Pro 起步、KYC 弹窗先截图不交材料。", "pinned": true, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "claude-account", "source_note": "整理自 2026-10-20 定级结论与 2026-10-23 时区 / KYC 细则，改写为可执行流程；不是对话原文。", "file": "08-claude-account.md", "body": "\n# Claude 账号防封与付款完整流程（定版）\n\n> 定版：2026-10-20 定级，2026-10-23 补时区与 KYC 执行细则。\n> 一句话原则：先在最终出口上把环境养稳，再付费；全程低频、一致、不折腾。\n\n## 背景结论（先认清，再动手）\n\n- 大陆 / 香港 / 澳门都是 Claude 不支持的地区，使用本身就带封号风险，违规终止不退款；其他原因退款按比例。\n- 最好的资产是干净的住宅出口：Verizon Business 静态住宅 IP，经 RackNerd 前置链式转发。机场共享节点和机房 IP 直连风险最高；VPS 直装已出局——唯一可接受的变体是 VPS 出站全部走 Verizon socks5 并带 kill-switch。\n- 付费 Pro 极可能触发 Stripe + Anthropic 全量复审，大陆卡是最大的风险因子。\n\n## 步骤一：账号——保留旧号，不开新号\n\n- 此前已用一条美区 ISP IP 注册过一个账号（非 Verizon 静态 IP，那条线路与账号详情未知）。默认保留旧账号，不另开新号：多开账号本身就是封号触发器，存活的老注册是资产。\n- 那条 ISP 线路若仍干净，就别迁移；若已脏，单向迁移到 Verizon 出口，轻度养号几天再付费。绝不在两个 IP 之间来回跳。\n- 只有四种情况才弃号重开：老账号已被封 / 被标、注册在脏 IP 上、账号不完全在自己控制下、登录历史已污染。\n\n## 步骤二：环境——本地 Win11 + 链式出口\n\n- 本地 Win11，桌面端 / CLI 为主力，配 v2rayN TUN 模式。主力工具定为 Claude Code + Design。\n- 时区跟随最终出口一次钉死，永不反复。兼职路线②的钉法：\n  - 系统时区留北京，Claude 进程单独用 `TZ=America/New_York` 从脚本启动；桌面版关掉自启，只从脚本启动。\n  - Claude 专用 Chrome Profile 把 en-US 置顶。注意：Chrome 在 Windows 上不吃 TZ 变量，网页版时区仍报北京，所以网页版只作登录 / OAuth 与少量使用，主力放 CLI + 桌面版。\n  - 验收标准：脚本启动的 CLI 显示美东时间（EST）。\n  - 配套：Windows 区域设 United States、浏览器语言 en-US 优先、自动校时打开、关掉自动设置时区与定位，不用 JS 时区伪装。\n\n## 步骤三：付款——顺序和铁律\n\n付款方式优先级（从优到次）：\n\n1. **iOS + 礼品卡**：已有美区 Apple ID；只在官方店购买、留好小票、分批兑换。灰卡有风险，不碰。\n2. **Starryblu**：SG BIN 万事达借记卡，大陆护照 + 手机号可开；作备用卡，只走官方渠道。\n3. **Bybit**：已有账户可用；不要为了这件事新开 Bybit 卡。\n4. 大陆卡（风险因子最大，尽量不用）。\n5. US PayPal（网页端只收卡，排最后）。\n\n价格参考（iOS 价）：Pro 年付 $214.99；Max 5x $124.99/月、20x $249.99/月（网页价 $100 / $200）。\n\n铁律：\n\n- 先月付 Pro $20 验证稳定性和用量，频繁撞限额再升 Max 5x；未验证稳定前不上 $100–200 的档。\n- 拒卡不要反复重试。\n- 出问题先申诉，绝不 chargeback。\n- 退款只走 Apple，且须单独取消订阅；退款退回美区 USD 余额，约 48 小时，退不回人民币。不要重复薅退款。\n\n## 步骤四：KYC 弹窗出现时怎么办\n\n背景：Anthropic 自 2026-04 起经 Persona 做选择性验证，要实体证件原件 + 活体自拍，不接受复印件 / 扫描 / 数字 ID。典型触发点：升 Max、高频使用、被风控标记；VPN / 位置与声明地址不符是典型情形。Persona 接受中国护照（查人证一致，不查居住地），但验证通过后仍可因在不支持地区使用被封；且提交真实身份是单向门——被封后换邮箱重开的空间大减。\n\n执行细则：\n\n1. 维持 Pro、不跳 Max，低频起步，尽量不触发。\n2. 真弹出来时先截图，别当场交材料，回来商量后再决定。\n3. 注册名必须与证件拼音一致（这一步在注册时就要对齐）。\n4. 验证时用链式出口的浏览器、关定位；手机扫码要在同一出口的 WiFi 下、关蜂窝、拒绝定位授权。\n5. 始终保持一致：IP、时区、语言、账单国家、声明地址，五样对得上。\n\n## 踩坑记录\n\n- **多开账号 = 自找封号**：新号没有历史积累，还多一个触发器；老号活着就是资产。\n- **付款方式比金额更重要**：大陆卡是全量复审里最大的风险因子，宁可用礼品卡绕开。\n- **时区反复横跳是大忌**：钉死一次就不要再改；网页版时区报北京是 Chrome 的固有限制，不是配置错误，别为它反复折腾。\n- **KYC 是单向门**：交了真实身份就回不去了，所以策略是\"不触发\"而不是\"准备好材料随时交\"。\n"}, {"id": 9, "title": "住宅出口与链式代理选型定版", "category": "节点与代理", "tags": ["链式代理", "住宅IP", "RackNerd", "Verizon", "Cliproxy"], "summary": "主力链定版：RackNerd 前置 + Proxy-Seller Verizon 静态住宅末跳；1024proxy 只作试用，Cliproxy 洛杉矶粘性线测试中；附买前核实清单与选型排序。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "residential-proxy", "source_note": "整理自 2026-10-15/18 链式出口定版与 2026-11-23 Cliproxy 测试记录；不是对话原文。", "file": "09-residential-proxy.md", "body": "\n# 住宅出口与链式代理选型定版\n\n> 定版：2026-10-15/18 链式出口已定；Cliproxy 洛杉矶线 2026-11-23 测试中。\n> 用途：给地区敏感账号准备干净出口，以及给节点做前置链。先看结论，再看细节。\n\n## 定版结论：主力链式出口\n\n- 结构：RackNerd VPS 作 vless 入口中转（前置链）→ Proxy-Seller Verizon Business 静态 IP 作末跳出口。\n- 末跳属性：住宅属性、human 81.77% / IPPure 1%、原生 IP；GeoIP 大区美东，设备时区按 America/New_York 钉死。\n- 待办：跑业务实测 + 完成 RackNerd 前置链式配置，之后才把敏感账号迁过来。\n\n## 备用与试用线\n\n- **1024proxy**：只留 $0.99 动态住宅试用，给谷歌重试当非美出口用，不作主力。\n- **Cliproxy 洛杉矶**（测试中）：us.cliproxy.io:3010，SOCKS5，粘性会话约 120 分钟。自测出口 ***，Charter/Spectrum AS20001 住宅 IP，时区 America/Los_Angeles。注意：非固定 IP，约 120 分钟后可能换 IP，用前必须重测；尚未决定是否用它替换 Verizon 作主力末跳。\n\n## 选型规则（踩出来的）\n\n- **机场大多做不了链式前置**：买前必须核实是否支持中转 / UDP / ToS；TikTok 等场景必须 UDP 通，不通直接排除。\n- **Proxy-Seller 不支持选地区**：ISP 静态线只有美 / 英 / 德 / 法 / 日 5 国；要城市级定位只能找客服。\n- **住宅静态 > 动态住宅 > 机房 IP**：敏感账号只认第一档；动态住宅只配做重试和非敏感业务；机房 IP 只能当节点中转，绝不直接登敏感账号（与《Claude 账号防封与付款完整流程》的定级一致）。\n\n## 踩坑记录\n\n- **链式能不能搭，先问再买**：前置链需要中转支持，很多机场套餐买完才发现不支持——核实顺序要在付款之前。\n- **粘性会话不是固定 IP**：Cliproxy 的\"粘性\"只有约 120 分钟，拿它当固定出口用会在换 IP 时翻车；每次用前重测出口 IP 和归属。\n"}, {"id": 10, "title": "Cloady 免费档部署 Xray 链式节点（定版）", "category": "节点与代理", "tags": ["Cloady", "Xray", "免费节点", "Cliproxy", "fail-closed"], "summary": "免费档部署 VLESS+WS 节点、出站只走 Cliproxy 的完整复现步骤与验收法；踩坑重点：免费额度被首个应用占满、改配置勿清空密码栏、超时不在服务器端。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "cloady-xray", "source_note": "整理自 2026-11-24 部署上线的实测记录；不是对话原文。UUID 等凭据只存配置文件，不写入本条。", "file": "10-cloady-xray.md", "body": "\n# Cloady 免费档部署 Xray 链式节点（定版）\n\n> 状态：2026-11-24 部署完成，LIVE。\n> 定位：免费小流量节点，出站经 Cliproxy 住宅代理。免费档月出站流量 10 GB（官方口径），别当大流量主力。\n\n## 成果形态（现在跑着的版本）\n\n- 平台：cloady.com，登录靠邮箱验证码；Workspace 为 ***，FREE 档，区域 usw1（美西）。\n- 当前应用名：`dockerfile`，域名 `***`。\n- Xray 版本 26.11.9，监听 :3000。未绑卡、未付款。\n- 出站结构：本地 → Cloady → Cliproxy SOCKS5 → 目标。直连出站已去掉，代理挂了就断（fail-closed），不会裸奔。\n- UUID 与 WS 路径沿用旧配置不变。\n\n## 部署流程（照着走能复现）\n\n1. 在 Cloady 建应用，规格选免费档，区域 usw1。\n2. 上传带 Dockerfile 的 Xray 配置：监听 :3000，入站 VLESS + WS。\n3. 配置出站只保留一条：Cliproxy SOCKS5（粘性会话 ***，t-120）。删掉直连出站，保证 fail-closed。\n4. 部署前逐项核对配置：**特别是密码栏不能为空**（见踩坑）。\n5. 部署完成后验收两件事：\n   - 用第二个 Xray 实例经该出站取 example.com，应成功返回。\n   - WS 握手应返回 101。\n\n## 踩坑记录（这篇的重点）\n\n- **旧应用删了，域名就失效**：旧应用 `xray`（域名 ***）已于 2026-11-24 按决定删除，旧链接不要再用。\n- **上传类应用没有\"替换源码\"入口**：想换代码只能新建应用；\"Deploy now\" 只是用旧文件重建，点了没变化不要奇怪。\n- **免费额度被第一个应用占满**：第二个应用即使选最小规格也要 $4.25/月且必须绑卡。先删旧应用再建新的，才走得通免费路线。\n- **改配置把密码栏写空 → 部署报错**：换 sid 改配置时曾把密码栏清空导致报错，重建才通。教训：改完配置先核对密码栏非空，再点部署。\n- **\"总是超时\"不在服务器端**：用户报超时后做过服务器端诊断——无异常，手机的真实流量一直在走 Cliproxy 出站。结论：超时既不在 Cloady 也不在 Cliproxy 会话，要在手机端按具体目标复现，不要在服务器上瞎改。\n- **测速地址的 403 不代表代理坏了**：直连测试里 SOCKS5 / HTTP 测速地址经此出口分别回 HTTP / 403，那是测速地址自身的表现，不等于代理不可用。验收要用真实目标（如 example.com）和 WS 握手，不要只看测速站。\n"}, {"id": 11, "title": "CT8.PL 免费主机部署 Xray 节点（定版）", "category": "节点与代理", "tags": ["CT8", "免费主机", "Xray", "VLESS", "保活"], "summary": "波兰免费共享主机上用面板定时任务保活 Xray 的部署形态：VLESS+WS+TLS 对外 443；含 2027-02-08 到期与提前续期动作。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "ct8-xray", "source_note": "整理自 2026-11-10 建成实测记录；不是对话原文。", "file": "11-ct8-xray.md", "body": "\n# CT8.PL 免费主机部署 Xray 节点（定版）\n\n> 状态：2026-11-10 已建成并实测通。\n> 定位：波兰免费共享虚拟主机（FreeBSD、无 root、有 SSH）。机房 IP，只能当网站空间 / 节点，绝不能登 Claude 等敏感账号。\n\n## 账号与期限\n\n- 账号：***（注册邮箱 ***）。\n- 面板：https://panel.ct8.pl/\n- SSH / SFTP：s1.ct8.pl\n- 套餐：FREE，有效期至 2027-02-08，网站域名 ***。\n\n## 部署形态（已实测通）\n\n- 协议：VLESS + WS + TLS，对外端口 443。\n- 证书：Let's Encrypt，有效期至 2027-02-08（与主机有效期对齐）。\n- 保活：面板定时任务每 5 分钟跑一次 bootstrap.sh，进程掉了会自动拉起。\n\n## 续期（别忘了）\n\n- 免费主机到期失效。已定续期动作：2027-02-03 上午约 10 点登录面板点 Renew（有定时任务 ct8-***-renewal 提醒）。\n- 续期后检查两件事：网站能打开、节点能连通；证书若没自动续，一并处理。\n\n## 踩坑 / 注意\n\n- **无 root**：所有部署都要在普通用户权限内完成，选型时优先单文件、免安装的程序（Xray 就是这么选的）。\n- **保活靠面板定时任务**：共享主机不让常驻进程，只能用每 5 分钟的 bootstrap.sh 拉活，这是这类免费主机的通用解法。\n- **机房 IP 的用途边界**：只能建站和做节点。拿它登地区敏感账号等于自曝，不要图省事。\n"}, {"id": 12, "title": "Railway 部署 Xray 四节点（定版）", "category": "节点与代理", "tags": ["Railway", "Xray", "多地区节点"], "summary": "personal-xray 四个地区服务的部署要点：用 teddysun 镜像避开官方镜像无 shell，启动命令硬编码端口，重部署后必须同步核对端口。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "railway-xray", "source_note": "整理自 2026-11-07 部署记录；不是对话原文。节点凭据只存订阅文件，不写入本条。", "file": "12-railway-xray.md", "body": "\n# Railway 部署 Xray 四节点（定版）\n\n> 状态：2026-11-07 已部署，四服务 ACTIVE，WS 握手成功。\n> 定位：多地区中转节点。节点凭据只存订阅文件，不写进任何文档。\n\n## 成果形态\n\n- 项目：personal-xray，共四个服务，域名后缀均为 `.up.railway.app`：\n  - 美西：***\n  - 美东：***\n  - 欧西：***\n  - 新加坡：***\n- 费用：试用额度剩 $5.00（2026-11-07 时点），到期或额度用完需升级；月成本约 $2.50/月。\n\n## 部署要点（照着走能复现）\n\n1. 镜像不要用官方镜像（没有 shell，没法调试），改用 `teddysun/xray:latest`（内置 Xray 26.10.31）。\n2. 每个服务的启动命令按目标端口硬编码监听：四个服务分别是 8080 / 8079 / 9000 / 9000。\n3. 部署后逐个验收 WS 握手，通了才算数。\n\n## 踩坑记录\n\n- **端口会变**：重新部署后平台分配的端口可能变化，启动命令里硬编码的监听端口必须同步改，否则服务起来了也连不上。每次重部署后第一件事就是核对端口。\n- **官方镜像无 shell**：排障时进不去容器，只能换 teddysun 镜像。这是选镜像时就要避开的坑，不是部署后才发现的问题。\n"}, {"id": 13, "title": "RedPocket $30/年 eSIM 使用手册（实测版）", "category": "账号与服务", "tags": ["RedPocket", "eSIM", "漫游", "WiFi Calling", "验证码"], "summary": "GSMA 线路与中国漫游的实测手册：网页开 Enable Roaming、漫游余额、WhatsApp 能收码而 Telegram 未收到、WiFi Calling 在中国必须走美国 IP 拉起。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "redpocket-esim", "source_note": "整理自 2026-11-25 激活与实测记录；不是对话原文。", "file": "13-redpocket-esim.md", "body": "\n# RedPocket $30/年 eSIM 使用手册（实测版）\n\n> 状态：已激活，客服 Sean 重新应用套餐并修正日期后数据恢复正常。\n> 设备：iPhone XS Max（A2104）。登录 RedPocket 须关 VPN、换连接。\n\n## 套餐事实\n\n- 套餐：360 Day Unlimited Talk/Text + 200MB 5G，$30/年。\n- 数据：200MB/200MB（客服修正后恢复满额）。\n- WiFi Calling：已开启。\n- 余额续期：2026-12-26；下次付款：2027-11-25。\n\n## 线路铁律\n\n- 当前线路是 **GSMA（AT&T）**——唯一含国际漫游的网。别切到 GSMT / CDMA，切过去漫游就没了。\n- 漫游只有 GSMA 套餐有，CDMA / GSMT 没有。\n\n## 中国漫游（已实测可用）\n\n1. 官网 Roaming 页显示 CHINA included；Roaming Balances 为 100/100 Minutes。\n2. 必须在网页上点 **Enable Roaming** 开通，光插卡不会自动开。\n3. 官方说法是须在美国境内先选好目的地国家；但本人已在中国实测漫游可用——以实测为准，官方口径记录在此备查。\n4. 实测结论：没有 WiFi Calling 也打通了电话，蜂窝漫游本身能通话。\n\n## 收短信（注册验证码用）\n\n- WhatsApp 短信：已收到，收短信能力已证实。\n- Telegram 注册：未收到码。同一线路不同服务结果不同，注册前先想好备选验证方式。\n\n## WiFi Calling 在中国的限制（重点）\n\n- AT&T 官网明确：WiFi Calling 在中国不可用，中国 IP 直连会被拒签。\n- 拉起条件：必须走美国 IP——用支持 UDP 的美区节点做热点 / 旁路由，让手机流量从美国出口走。\n- 佐证：此前唯一一次状态栏出现 \"RedPocket Wi-Fi\" 时，手机正开着 VPN（美国 IP）。\n\n## 踩坑记录\n\n- **611 / 800 免费电话在境外常打不通**，不要拿它当\"线路是否正常\"的测试标准，会误判。\n- **套餐日期出过错**：初激活时日期不对，是客服 Sean 重新应用套餐才修正的——激活后第一件事核对数据余额和日期，不对立刻找客服。\n- **登录要关 VPN**：开着 VPN 登不上 RedPocket 账户，关掉并换一条连接再登。\n"}, {"id": 14, "title": "Lather & Lore 手工皂站：发布流程与待办", "category": "网站与项目", "tags": ["Lather & Lore", "Cloudflare", "Workers", "网站发布", "Search Console"], "summary": "yanchs.com 的发布通道已打通（Token 自动发布）；剩下 Search Console 验证待手动——部署 Token 无 DNS 权限，网域验证要本人加 TXT 或改用网址前缀验证。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "lather-lore", "source_note": "整理自 2026-11-12 上线记录；不是对话原文。", "file": "14-lather-lore.md", "body": "\n# Lather & Lore 手工皂站：发布流程与待办（定版）\n\n> 状态：2026-11-12 已上线。站点 yanchs.com（手工皂品牌 Lather & Lore）。\n> 发布通道已打通：改完内容由 Muse 经 Cloudflare 自动发布，不需要手动上传。\n\n## 站点事实\n\n- 域名 yanchs.com 已在 Cloudflare 托管，同时绑了 www.yanchs.com。\n- 部署方式：Cloudflare Workers 静态上传，预览域名 lather-and-lore.ruiyingyui.workers.dev。\n- 商品：6 款手工皂，均 $12。\n- Instagram 三处入口统一指向 https://www.instagram.com/ruiyingyui/\n- 页脚作者：Site Author Paul Lee，邮箱 yanchi@yanchs.com。\n- About 页人物 Lin Wei 是虚构的中国女皂匠形象（品牌故事用，不是真人）。\n\n## 发布流程（已走通）\n\n1. 改内容（文案、商品、图片）。\n2. 用部署 Token `***`（已接入 Cloudflare 连接器）自动发布到 Workers。\n3. 发布后打开 yanchs.com 与 www 两个地址各验一遍，确认新内容生效。\n\n## 待办：Google Search Console（需本人手动）\n\n1. 去 Google Search Console 建资源并验证所有权：\n   - 网域验证需要在 Cloudflare 加 DNS TXT 记录——部署 Token 没有 DNS 权限，这一步只能本人手动在 Cloudflare 加；或改用\"网址前缀\"验证方式绕开。\n2. 验证通过后提交 sitemap。\n3. 请求编入索引。\n\n## 踩坑记录\n\n- **Token 权限边界**：部署 Token 能发布站点，但没有 DNS 权限。凡是涉及改 DNS 的验证方式都会卡住，要么本人手动加记录，要么换不依赖 DNS 的验证方式。\n"}, {"id": 15, "title": "Codex CLI 在 Windows 上的安装流程（进行中）", "category": "AI 与 Agent", "tags": ["Codex", "Windows", "PowerShell", "CLI"], "summary": "npm 安装已完成（0.168.0），登录待跑 Sign in with ChatGPT；踩坑：PowerShell 执行策略拦 .ps1 垫片，用 codex.cmd 或改 RemoteSigned。", "pinned": false, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "codex-windows", "source_note": "整理自 2026-11-13 安装记录；不是对话原文。", "file": "15-codex-windows.md", "body": "\n# Codex CLI 在 Windows 上的安装流程（进行中）\n\n> 状态：2026-11-13 已装好 CLI（版本 0.168.0），登录尚未完成。\n> 机器：本机 Win11。开发角色定位：以架构师 + 代码审查为主，大部分编码交给 agent，所以 CLI 是日常主力入口。\n\n## 已走通的步骤\n\n1. 经 npm 安装 Codex CLI。\n2. 验证版本：`codex.cmd --version` 输出 0.168.0，安装成功。\n\n## 待完成\n\n1. 跑 `codex`，选 **Sign in with ChatGPT** 完成登录。\n2. WezTerm 已下载（2026-11-13），待把默认 shell 配成 PowerShell 7。\n\n## 踩坑记录\n\n- **PowerShell 执行策略会拦 `codex`**：直接跑 `codex --version` 曾被拦下，因为 npm 生成的 codex.ps1 在 Restricted 策略下禁止运行。两个解法：\n  - `Set-ExecutionPolicy RemoteSigned -Scope CurrentUser` 放开当前用户策略；或\n  - 一直用 `codex.cmd` 启动，绕开 .ps1。\n- 记住这个坑的通用形态：npm 装的 CLI 在 Windows 上都有 .ps1 垫片，凡是\"命令存在却跑不起来先报策略错误\"，先换 .cmd 试。\n"}, {"id": 16, "title": "X 长文 → 离线学习文档：完整流程（定版）", "category": "创作与内容", "tags": ["资料整理", "离线文档", "学习笔记", "版权边界"], "summary": "把 X 长文做成离线文档的定版流程：抓原文与配图、写自己的学习笔记（不做全文翻译）、图片本地化、Markdown 包与 HTML 预览两种交付；含这次反复试错的全部教训。", "pinned": true, "updated_at": "2026-11-26T04:51:42.795Z", "cover_key": "offline-docs", "source_note": "整理自 2026-11-26 制作 Grok Harness 离线文档的真实任务复盘；不是对话原文。", "file": "16-offline-docs.md", "body": "\n# X 长文 → 离线学习文档：完整流程（定版）\n\n## 定版流程\n\n1. **抓原文**：在浏览器里打开原帖，抓全文和全部配图，记下原文链接、作者、页面时间（页面时间前后不一致时按原样记录，不替作者选一个）。\n2. **定形式：写学习笔记，不做全文翻译**（原因见踩坑）。用自己的话重写：讲清结构、核心机制、关键数字和账、例子想说明什么、检查清单要点；想法和数字归原文，表达是自己的。\n3. **配图本地化**：配图全部下载到本地 `images/` 文件夹，正文按原文顺序引用本地文件，不放远程图片链接——解压后断网也能打开。\n4. **交付形态**：\n   - Markdown 离线包：`.md` + `images/` 一起打包，打开 md 即可读。\n   - 要预览效果时再做 HTML 版：衬线标题、侧边目录、阅读进度条；关键数字做对比卡片（如 $0.0049 对 $0.000084、58 倍）；手机上表格自动堆叠；支持深色模式。\n\n## 踩坑记录（这篇的重点）\n\n- **\"公开能看\" ≠ \"可以全文复制\"**：作者发在 X 上免费公开，版权仍归作者。把整篇长文逐句翻译、排版成文档，本质是把整部作品换种语言复制一份——不管署不署名、不管是否商用，这一步都不能做。能做的是：链接 + 概要，或用自己的话重写成学习文档；直接引用不能超过 50 个词。\n- **不要先承诺再改口**：这次最初答应了\"抓全文、翻译成中文\"，后来才改口只给概要，前后不一致——教训是动手前先把形式定死（第 2 步），再开工。\n- **\"离线\"就要真离线**：第一版把图片链接放进文档，那不叫离线版。图片必须下载到本地并用相对路径引用，交付前断网自检一遍。\n- **概要太薄也不行**：只有几段的概要不够用，定版的学习笔记要把结构、数字、例子、清单都写全，读完笔记应能复述原文的完整思路。\n"}], "categories": ["AI 与 Agent", "创作与内容", "网站与项目", "网络与路由", "节点与代理", "账号与服务"]}</script><div id="progress"></div><button id="toTop" title="回到顶部">↑</button><div class="layout"><aside><nav class="toc" id="view-toc"></nav></aside><main class="article" id="view-main"><p>加载中…</p></main></div>
<script>/* Atlas client runtime — Add / Edit / Delete (no backend).
 *
 * Built-in articles are baked into each page as JSON (#atlas-data).
 * All adds/edits/deletes are stored in localStorage under key
 * "atlas_overrides" and applied on top of the built-in articles:
 *   { v: 1, added: [article...], edited: {id: article}, deleted: [id...] }
 * Nothing leaves the browser until the user clicks "导出改动" on the
 * homepage, downloads the changed Markdown files, puts them into
 * articles/, rebuilds and pushes to GitHub.
 */
(function () {
  "use strict";
  var KEY = "atlas_overrides";

  /* ---------- data ---------- */
  var DATA = null;
  try {
    var el = document.getElementById("atlas-data");
    DATA = el ? JSON.parse(el.textContent) : { articles: [], categories: [] };
  } catch (e) { DATA = { articles: [], categories: [] }; }
  var BUILTIN = DATA.articles || [];
  var CATEGORIES = DATA.categories || [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function loadOverrides() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o && Array.isArray(o.added) && o.edited && Array.isArray(o.deleted)) return o;
    } catch (e) {}
    return { v: 1, added: [], edited: {}, deleted: [] };
  }
  function saveOverrides(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { alert("保存失败：浏览器 localStorage 不可用。"); }
  }
  function builtinById(id) {
    for (var i = 0; i < BUILTIN.length; i++) if (BUILTIN[i].id === id) return BUILTIN[i];
    return null;
  }
  function getArticle(id) {
    var o = loadOverrides();
    if (o.deleted.indexOf(id) !== -1) return null;
    if (o.edited[id]) return o.edited[id];
    for (var i = 0; i < o.added.length; i++) if (o.added[i].id === id) return o.added[i];
    return builtinById(id);
  }
  function getAllArticles() {
    var o = loadOverrides();
    var list = [];
    BUILTIN.forEach(function (a) {
      if (o.deleted.indexOf(a.id) !== -1) return;
      list.push(o.edited[a.id] || a);
    });
    o.added.forEach(function (a) {
      if (o.deleted.indexOf(a.id) !== -1) return;
      list.push(a);
    });
    list.sort(function (x, y) { return x.id - y.id; });
    return list;
  }
  function pendingCount() {
    var o = loadOverrides();
    return o.added.length + Object.keys(o.edited).length + o.deleted.length;
  }
  function nextAddedId() {
    var o = loadOverrides();
    var max = 1000;
    o.added.forEach(function (a) { if (a.id > max) max = a.id; });
    return max + 1;
  }
  function slugify(title) {
    var s = String(title || "article").replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-+|-+$/g, "");
    return s ? s.slice(0, 40) : "article";
  }
  function articleFilename(a) {
    if (a.file) return a.file;
    return a.id + "-" + slugify(a.title) + ".md";
  }
  function toMarkdown(a) {
    var tags = (a.tags || []).map(function (t) { return '"' + String(t).replace(/"/g, "") + '"'; }).join(", ");
    var fm = ["---", "id: " + a.id, 'title: "' + String(a.title || "").replace(/"/g, "") + '"',
      'category: "' + String(a.category || "").replace(/"/g, "") + '"',
      "tags: [" + tags + "]", "pinned: " + (a.pinned ? "true" : "false")];
    if (a.cover_key) fm.push('cover_key: "' + a.cover_key + '"');
    fm.push('summary: "' + String(a.summary || "").replace(/"/g, "") + '"');
    if (a.source_note) fm.push('source_note: "' + String(a.source_note).replace(/"/g, "") + '"');
    fm.push("updated_at: " + JSON.stringify(a.updated_at || new Date().toISOString()));
    fm.push("---", "");
    return fm.join("\n") + "\n" + (a.body || "");
  }

  /* ---------- small Markdown -> HTML (mirrors scripts/build.py) ---------- */
  function inlineMd(s) {
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    return s;
  }
  function mdToHtml(body) {
    var lines = String(body || "").split("\n"), out = [], toc = [], i = 0, secN = 0;
    function isTableSep(l) { return /^\s*\|[\s:|-]+\|\s*$/.test(l); }
    while (i < lines.length) {
      var line = lines[i];
      if (line.indexOf("```") === 0) {
        var buf = []; i++;
        while (i < lines.length && lines[i].indexOf("```") !== 0) { buf.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
      }
      if (line.trim().indexOf("|") === 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var header = line.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
        i += 2; var rows = [];
        while (i < lines.length && lines[i].trim().indexOf("|") === 0) {
          rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); })); i++;
        }
        var t = "<table><thead><tr>" + header.map(function (c) { return "<th>" + inlineMd(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        rows.forEach(function (r) { t += "<tr>" + r.map(function (c) { return "<td>" + inlineMd(c) + "</td>"; }).join("") + "</tr>"; });
        out.push(t + "</tbody></table>"); continue;
      }
      var hm = line.match(/^(#{1,3})\s+(.*)$/);
      if (hm) {
        var level = hm[1].length, raw = hm[2], tm = raw.match(/<!--\s*toc:\s*(.*?)\s*-->/);
        var tocLabel = tm ? tm[1] : null;
        raw = raw.replace(/<!--.*?-->/g, "").trim();
        if (level === 1) { out.push("<h1>" + inlineMd(raw) + "</h1>"); }
        else if (level === 2) {
          secN++; var hid = "sec-" + secN;
          var label = tocLabel || raw.replace(/^\d+[\.\、\s]*/, "");
          toc.push({ id: hid, label: label, level: 2 });
          var b = raw.match(/^(\d+)/);
          out.push('<div class="sec-head" id="' + hid + '"><span class="badge">' + esc(b ? b[1] : ("0" + toc.length).slice(-2)) + '</span><h2>' + inlineMd(raw) + "</h2></div>");
        } else {
          if (/^\d+\.\d+/.test(raw)) {
            secN++; var hid3 = "sec-" + secN;
            toc.push({ id: hid3, label: raw, level: 3 });
            out.push('<div class="sec-head" id="' + hid3 + '"><span class="badge">' + esc(raw.split(" ")[0]) + "</span><h3>" + inlineMd(raw) + "</h3></div>");
          } else { out.push("<h3>" + inlineMd(raw) + "</h3>"); }
        }
        i++; continue;
      }
      if (line.indexOf(">") === 0) {
        var bq = [];
        while (i < lines.length && lines[i].indexOf(">") === 0) { bq.push(lines[i].replace(/^>\s?/, "")); i++; }
        out.push("<blockquote><p>" + bq.map(inlineMd).join("<br>") + "</p></blockquote>"); continue;
      }
      if (line.trim() === "---" || line.trim() === "***" || line.trim() === "___") { out.push("<hr>"); i++; continue; }
      var im = line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/);
      if (im) { out.push('<div class="img-note">🖼 ' + esc(im[1]) + "（配图 " + esc(im[2]) + "，未包含在导出中）</div>"); i++; continue; }
      if (/^\s*[-*]\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
        out.push("<ul>" + items.map(function (x) { return "<li>" + inlineMd(x) + "</li>"; }).join("") + "</ul>"); continue;
      }
      if (/^\s*\d+[\.\)]\s+/.test(line)) {
        var oitems = [];
        while (i < lines.length && /^\s*\d+[\.\)]\s+/.test(lines[i])) { oitems.push(lines[i].replace(/^\s*\d+[\.\)]\s+/, "")); i++; }
        out.push("<ol>" + oitems.map(function (x) { return "<li>" + inlineMd(x) + "</li>"; }).join("") + "</ol>"); continue;
      }
      if (!line.trim()) { i++; continue; }
      var para = [line]; i++;
      while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|\s*[-*]\s|\s*\d+[\.\)]\s+>|>|\|)/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push("<p>" + para.map(inlineMd).join(" ") + "</p>");
    }
    return { html: out.join("\n"), toc: toc };
  }

  /* ---------- homepage search / filter (used by inline handlers) ---------- */
  window.filterCards = function (q) {
    q = (q || "").trim().toLowerCase();
    document.querySelectorAll("[data-search]").forEach(function (el) {
      el.style.display = (!q || el.dataset.search.toLowerCase().indexOf(q) !== -1) ? "" : "none";
    });
  };
  window.setChip = function (btn, cat) {
    document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
    btn.classList.add("active");
    document.querySelectorAll("[data-cat]").forEach(function (el) {
      el.style.display = (cat === "全部" || el.dataset.cat === cat) ? "" : "none";
    });
  };

  /* ---------- editor modal ---------- */
  var currentEditId = null;
  function ensureModal() {
    if (document.getElementById("atlas-modal")) return;
    var div = document.createElement("div");
    div.id = "atlas-modal";
    div.className = "modal";
    div.hidden = true;
    div.innerHTML =
      '<div class="modal-card"><h3 id="atlas-modal-title">编辑文章</h3>' +
      '<label class="field">标题<input id="ed-title" type="text"></label>' +
      '<label class="field">分类<select id="ed-category"></select>' +
      '<input id="ed-category-new" type="text" placeholder="新分类名称" hidden style="margin-top:6px"></label>' +
      '<label class="field">标签（逗号分隔）<input id="ed-tags" type="text"></label>' +
      '<label class="field">摘要<textarea id="ed-summary" rows="2"></textarea></label>' +
      '<label class="field"><span><input id="ed-pinned" type="checkbox"> 置顶推荐</span></label>' +
      '<label class="field">正文（Markdown）<textarea id="ed-body" rows="14"></textarea></label>' +
      '<div class="modal-actions"><button class="btn btn-primary" id="ed-save">保存</button>' +
      '<button class="btn" type="button" onclick="atlasCloseModal()">取消</button></div>' +
      '<p class="modal-note">保存后只存在本浏览器（localStorage），需在首页点“导出改动”，把文件放回 articles/ 并重新构建、推送到 GitHub，才会同步到其它主机。</p></div>';
    document.body.appendChild(div);
    document.getElementById("ed-category").addEventListener("change", function () {
      document.getElementById("ed-category-new").hidden = this.value !== "__new__";
    });
    document.getElementById("ed-save").addEventListener("click", saveEditor);
  }
  function fillCategories(selected) {
    var sel = document.getElementById("ed-category");
    var cats = CATEGORIES.slice();
    getAllArticles().forEach(function (a) { if (cats.indexOf(a.category) === -1) cats.push(a.category); });
    sel.innerHTML = cats.map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === selected ? " selected" : "") + ">" + esc(c) + "</option>";
    }).join("") + '<option value="__new__">＋ 新分类…</option>';
    document.getElementById("ed-category-new").hidden = true;
  }
  window.atlasCloseModal = function () {
    var m = document.getElementById("atlas-modal");
    if (m) m.hidden = true;
    var e = document.getElementById("atlas-export-modal");
    if (e) e.hidden = true;
  };
  window.atlasNewArticle = function () { openEditor(null); };
  window.atlasEditCurrent = function () {
    var id = window.ATLAS_CURRENT_ID;
    if (id == null) return;
    openEditor(getArticle(id));
  };
  function openEditor(article) {
    ensureModal();
    currentEditId = article ? article.id : null;
    document.getElementById("atlas-modal-title").textContent = article ? "编辑文章" : "新增文章";
    document.getElementById("ed-title").value = article ? article.title : "";
    fillCategories(article ? article.category : CATEGORIES[0]);
    document.getElementById("ed-tags").value = article ? (article.tags || []).join(", ") : "";
    document.getElementById("ed-summary").value = article ? article.summary : "";
    document.getElementById("ed-pinned").checked = !!(article && article.pinned);
    document.getElementById("ed-body").value = article ? article.body : "";
    document.getElementById("atlas-modal").hidden = false;
  }
  function saveEditor() {
    var title = document.getElementById("ed-title").value.trim();
    if (!title) { alert("请填写标题。"); return; }
    var catSel = document.getElementById("ed-category");
    var category = catSel.value === "__new__"
      ? document.getElementById("ed-category-new").value.trim()
      : catSel.value;
    if (!category) { alert("请选择或填写分类。"); return; }
    var tags = document.getElementById("ed-tags").value.split(/[,，、]/).map(function (t) { return t.trim(); }).filter(Boolean);
    var o = loadOverrides();
    if (currentEditId == null) {
      var a = { id: nextAddedId(), title: title, category: category, tags: tags,
        summary: document.getElementById("ed-summary").value.trim(), pinned: document.getElementById("ed-pinned").checked,
        updated_at: new Date().toISOString(), body: document.getElementById("ed-body").value };
      o.added.push(a);
      saveOverrides(o);
      atlasCloseModal();
      location.href = atlasPath("articles/view.html?id=" + a.id);
    } else {
      var orig = getArticle(currentEditId);
      var updated = { id: currentEditId, title: title, category: category, tags: tags,
        summary: document.getElementById("ed-summary").value.trim(), pinned: document.getElementById("ed-pinned").checked,
        updated_at: new Date().toISOString(), body: document.getElementById("ed-body").value,
        cover_key: orig.cover_key, source_note: orig.source_note, file: orig.file };
      if (orig.file) { o.edited[currentEditId] = updated; }
      else {
        for (var i = 0; i < o.added.length; i++) if (o.added[i].id === currentEditId) o.added[i] = updated;
      }
      saveOverrides(o);
      atlasCloseModal();
      location.reload();
    }
  }
  function atlasPath(rel) {
    return location.pathname.indexOf("/articles/") !== -1 ? "../" + rel : rel;
  }
  window.atlasDeleteCurrent = function () {
    var id = window.ATLAS_CURRENT_ID;
    if (id == null) return;
    var a = getArticle(id);
    if (!a) return;
    if (!confirm("确定删除「" + a.title + "」吗？\n删除后只在本地生效，需导出改动并推送到 GitHub 才会同步。")) return;
    var o = loadOverrides();
    delete o.edited[id];
    o.added = o.added.filter(function (x) { return x.id !== id; });
    if (builtinById(id) && o.deleted.indexOf(id) === -1) o.deleted.push(id);
    saveOverrides(o);
    location.href = atlasPath("index.html");
  };

  /* ---------- export changes ---------- */
  function downloadBlob(filename, text, type) {
    var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
  }
  window.atlasExportChanges = function () {
    var o = loadOverrides();
    var changed = [];
    o.added.forEach(function (a) { changed.push({ kind: "新增", article: a }); });
    Object.keys(o.edited).forEach(function (id) { changed.push({ kind: "修改", article: o.edited[id] }); });
    var deleted = o.deleted.map(function (id) { var b = builtinById(id); return { id: id, title: b ? b.title : ("id " + id), file: b ? b.file : null }; });
    if (!changed.length && !deleted.length) { alert("本地没有改动（localStorage 里没有新增/修改/删除）。"); return; }
    var div = document.getElementById("atlas-export-modal");
    if (!div) {
      div = document.createElement("div");
      div.id = "atlas-export-modal"; div.className = "modal"; div.hidden = true;
      document.body.appendChild(div);
    }
    var rows = changed.map(function (c, i) {
      return '<li>' + esc(c.kind) + "：" + esc(c.article.title) + ' — <a href="#" data-exp="' + i + '">下载 ' + esc(articleFilename(c.article)) + "</a></li>";
    }).join("");
    var delRows = deleted.map(function (d) {
      return "<li>删除：" + esc(d.title) + (d.file ? " — 在 articles/ 里删掉 " + esc(d.file) : "") + "</li>";
    }).join("");
    div.innerHTML = '<div class="modal-card"><h3>导出改动</h3>' +
      "<p>以下改动只存在本浏览器（localStorage），还没有同步到 GitHub：</p><ul>" + rows + delRows + "</ul>" +
      '<p><button class="btn btn-primary" id="exp-json">下载全部改动 (atlas-changes.json)</button> ' +
      '<button class="btn" type="button" onclick="atlasCloseModal()">关闭</button></p>' +
      "<ol class=\"modal-note\"><li>把上面下载的 Markdown 文件放进仓库的 articles/（新增放新文件，修改覆盖同名文件，删除的删掉对应文件）。</li>" +
      "<li>在仓库根目录跑 <code>python3 scripts/build.py</code> 重新生成 dist/。</li>" +
      "<li><code>git add -A && git commit -m \"更新文章\" && git push origin main</code>，其它主机 git pull 即可。</li></ol></div>";
    div.hidden = false;
    div.querySelectorAll("[data-exp]").forEach(function (a) {
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        var c = changed[parseInt(a.getAttribute("data-exp"), 10)];
        downloadBlob(articleFilename(c.article), toMarkdown(c.article), "text/markdown;charset=utf-8");
      });
    });
    document.getElementById("exp-json").addEventListener("click", function () {
      downloadBlob("atlas-changes.json", JSON.stringify({
        exported_at: new Date().toISOString(),
        added: o.added, edited: o.edited, deleted: o.deleted
      }, null, 2), "application/json;charset=utf-8");
    });
  };

  /* ---------- homepage overrides ---------- */
  function cardHtml(a) {
    var search = esc(a.title + " " + a.summary + " " + (a.tags || []).join(" "));
    var tags = (a.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
    var href = a.id >= 1001 ? "articles/view.html?id=" + a.id : "articles/" + a.id + ".html";
    return '<article class="card" data-cat="' + esc(a.category) + '" data-search="' + search + '" data-article-id="' + a.id + '">' +
      '<h3><a href="' + href + '">' + esc(a.title) + "</a>" + (a.pinned ? '<span class="pinned">置顶</span>' : "") + "</h3>" +
      "<p>" + esc(a.summary) + "</p><div><span class=\"date\">" + esc((a.updated_at || "").slice(0, 10)) + "</span> " + tags + "</div></article>";
  }
  function applyHomepageOverrides() {
    var o = loadOverrides();
    if (!document.querySelector(".card[data-article-id]")) return;
    var all = getAllArticles();
    // hide deleted / patch edited cards in place
    document.querySelectorAll(".card[data-article-id]").forEach(function (card) {
      var id = parseInt(card.getAttribute("data-article-id"), 10);
      var a = getArticle(id);
      if (!a) { card.remove(); return; }
      var h3a = card.querySelector("h3 a");
      if (h3a) h3a.textContent = a.title;
      var p = card.querySelector("p");
      if (p) p.textContent = a.summary;
      var tagsDiv = card.querySelector("h3").parentNode.querySelector("div");
      var pin = card.querySelector(".pinned");
      if (a.pinned && !pin) {
        var s = document.createElement("span"); s.className = "pinned"; s.textContent = "置顶";
        card.querySelector("h3").appendChild(s);
      } else if (!a.pinned && pin) { pin.remove(); }
      if (tagsDiv) {
        tagsDiv.innerHTML = '<span class="date">' + esc((a.updated_at || "").slice(0, 10)) + "</span> " +
          (a.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
      }
      card.setAttribute("data-cat", a.category);
      card.setAttribute("data-search", a.title + " " + a.summary + " " + (a.tags || []).join(" "));
    });
    // pinned status / category: pinned articles appear in BOTH the pinned
    // section and the grouped list, so toggle the pinned-section copy only
    all.forEach(function (a) {
      var pinnedCard = pinnedSec ? pinnedSec.querySelector('.card[data-article-id="' + a.id + '"]') : null;
      var groupedCard = null;
      document.querySelectorAll('.card[data-article-id="' + a.id + '"]').forEach(function (c) {
        if (!pinnedSec || !pinnedSec.contains(c)) groupedCard = c;
      });
      if (a.pinned && !pinnedCard) {
        var clone = groupedCard ? groupedCard.cloneNode(true) : null;
        if (!clone) { var t0 = document.createElement("div"); t0.innerHTML = cardHtml(a); clone = t0.firstChild; }
        if (pinnedSec) pinnedSec.appendChild(clone);
      } else if (!a.pinned && pinnedCard) { pinnedCard.remove(); }
      if (!groupedCard) {
        var wrap = document.createElement("div"); wrap.innerHTML = cardHtml(a);
        var newCard = wrap.firstChild;
        var target = sections[a.category];
        if (!target) {
          target = document.createElement("section");
          target.innerHTML = '<h2 class="sechead"></h2>';
          var footer = document.querySelector("footer");
          (footer ? footer.parentNode : document.body).insertBefore(target, footer);
          sections[a.category] = target;
          var chipRow = document.querySelector(".chips");
          if (chipRow) {
            var chip = document.createElement("button");
            chip.className = "chip"; chip.textContent = a.category;
            chip.setAttribute("onclick", "setChip(this,'" + a.category.replace(/'/g, "") + "')");
            chipRow.appendChild(chip);
          }
        }
        target.appendChild(newCard);
      }
    });
    // recount: overview, category cards, section headings
    var ov = document.querySelector(".overview");
    if (ov) ov.textContent = "共 " + all.length + " 篇 · " + new Set(all.map(function (a) { return a.category; })).size + " 个分类";
    document.querySelectorAll(".catcard").forEach(function (cc) {
      var cat = cc.getAttribute("data-cat");
      var list = all.filter(function (a) { return a.category === cat; });
      if (!list.length) { cc.remove(); return; }
      var p = cc.querySelector("p");
      if (p) p.textContent = list.length + " 篇 · 最新：" + list[0].title;
    });
    document.querySelectorAll("section h2.sechead").forEach(function (h) {
      var cat = h.textContent.replace(/（\d+ 篇）$/, "");
      var n = all.filter(function (a) { return a.category === cat; }).length;
      h.textContent = cat + "（" + n + " 篇）";
    });
    // pending-changes badge
    var badge = document.getElementById("atlas-pending");
    if (badge) {
      var n = pendingCount();
      badge.textContent = n ? ("本地有 " + n + " 处改动未导出") : "";
      badge.style.display = n ? "" : "none";
    }
  }

  /* ---------- detail overrides + generic view page ---------- */
  function rebuildToc(toc) {
    var items = toc.map(function (t) {
      return '<li' + (t.level === 3 ? ' style="padding-left:14px;"' : "") + '><a href="#' + t.id + '">' + esc(t.label) + "</a></li>";
    }).join("");
    document.querySelectorAll(".toc ol").forEach(function (ol) { ol.innerHTML = items; });
    document.querySelectorAll(".toc-mobile ol").forEach(function (ol) { ol.innerHTML = items; });
    var h = document.querySelector(".toc h4");
    if (h) h.textContent = "目录（" + toc.length + " 节）";
    var s = document.querySelector(".toc-mobile summary");
    if (s) s.textContent = "目录（" + toc.length + " 节）";
  }
  function applyDetailOverride() {
    var id = window.ATLAS_CURRENT_ID;
    if (id == null) return;
    var o = loadOverrides();
    if (!o.edited[id]) return;
    var a = o.edited[id];
    var main = document.querySelector("main.article");
    if (!main) return;
    var h1 = main.querySelector("h1");
    if (h1) h1.textContent = a.title;
    var lead = main.querySelector(".lead");
    if (lead) lead.textContent = a.summary;
    var tags = document.getElementById("article-tags");
    if (tags) tags.innerHTML = (a.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
    var meta = main.querySelector(".meta");
    if (meta) meta.textContent = "约 " + a.body.length + " 字 · 阅读约 " + Math.max(1, Math.round(a.body.length / 400)) + " 分钟 · 更新 " + (a.updated_at || "").slice(0, 10) + "（本地修改，未导出）";
    var bodyEl = document.getElementById("article-body");
    if (bodyEl) {
      var r = mdToHtml(a.body);
      bodyEl.innerHTML = r.html;
      rebuildToc(r.toc);
      document.title = a.title + " · Atlas";
    }
    initScrollspy();
  }
  function renderViewPage() {
    var main = document.getElementById("view-main");
    if (!main) return;
    var id = parseInt(new URLSearchParams(location.search).get("id") || "0", 10);
    var a = getArticle(id);
    if (!a) {
      main.innerHTML = '<nav class="back"><a href="../index.html">← 返回 Atlas</a></nav><h1>文章不存在</h1><p class="lead">这篇文章可能已被删除，或链接不正确。</p>';
      document.title = "文章不存在 · Atlas";
      return;
    }
    window.ATLAS_CURRENT_ID = id;
    var r = mdToHtml(a.body);
    var words = a.body.length;
    main.innerHTML =
      '<nav class="back"><a href="../index.html">← 返回 Atlas</a> ' +
      '<button class="btn" type="button" onclick="atlasEditCurrent()">编辑</button> ' +
      '<button class="btn btn-danger" type="button" onclick="atlasDeleteCurrent()">删除</button></nav>' +
      '<div class="kicker">' + esc(a.category) + "</div><h1>" + esc(a.title) + "</h1>" +
      '<p class="lead">' + esc(a.summary) + "</p>" +
      '<div id="article-tags">' + (a.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
      '<p class="meta">约 ' + words + " 字 · 阅读约 " + Math.max(1, Math.round(words / 400)) + " 分钟 · 更新 " + (a.updated_at || "").slice(0, 10) + "</p>" +
      '<div id="article-body">' + r.html + "</div>";
    document.title = a.title + " · Atlas";
    var tocNav = document.getElementById("view-toc");
    if (tocNav) {
      tocNav.innerHTML = "<h4>目录（" + r.toc.length + " 节）</h4><ol>" +
        r.toc.map(function (t) {
          return '<li' + (t.level === 3 ? ' style="padding-left:14px;"' : "") + '><a href="#' + t.id + '">' + esc(t.label) + "</a></li>";
        }).join("") + "</ol>";
    }
    initScrollspy();
  }

  /* ---------- scrollspy / progress (detail pages) ---------- */
  var spyInit = false;
  function initScrollspy() {
    var bar = document.getElementById("progress");
    if (!bar) return;
    var links = Array.prototype.slice.call(document.querySelectorAll(".toc a"));
    var secs = links.map(function (a) { return document.getElementById(a.getAttribute("href").slice(1)); }).filter(Boolean);
    function onScroll() {
      var st = window.scrollY || document.documentElement.scrollTop;
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (st / h * 100) : 0) + "%";
      var cur = secs[0];
      secs.forEach(function (s) { if (s.getBoundingClientRect().top <= 120) cur = s; });
      links.forEach(function (a) {
        var on = cur && a.getAttribute("href") === "#" + cur.id;
        a.classList.toggle("active", !!on);
        if (on) a.scrollIntoView({ block: "nearest" });
      });
    }
    if (!spyInit) {
      window.addEventListener("scroll", onScroll, { passive: true });
      var top = document.getElementById("toTop");
      if (top) top.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
      spyInit = true;
    }
    onScroll();
  }

  /* ---------- boot ---------- */
  if (document.getElementById("view-main")) renderViewPage();
  else { applyHomepageOverrides(); applyDetailOverride(); }
  if (document.getElementById("progress")) initScrollspy();
  var topBtn = document.getElementById("toTop");
  if (topBtn && !spyInit) topBtn.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });

  /* Test hook (no-op in browsers): lets `node --check`-style tests require
     the pure functions without a DOM. */
  if (typeof module !== "undefined" && module.exports) {
    module.exports = { mdToHtml: mdToHtml, toMarkdown: toMarkdown,
      loadOverrides: loadOverrides, saveOverrides: saveOverrides,
      getAllArticles: getAllArticles, getArticle: getArticle };
  }
})();
</script>
