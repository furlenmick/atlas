<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Gemini 4 Neon：用一个 AI Agent 团队干活，而不是一个聊天窗口 · Atlas</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{
  color-scheme:light dark;
  --bg:#fbfaf7; --surface:#ffffff; --surface-2:#f3f0e9; --text:#1c1a17; --ink-2:#4c4740;
  --dim:#857e72; --border:#e4ded2; --accent:#d94f30; --accent-ink:#b23a20; --accent-soft:#fbe9e3;
  --good:#2e7d4f; --pine:#2f4f43; --radius:14px; --shadow:0 10px 30px rgba(28,26,23,.08);
  --serif:"Noto Serif SC","Songti SC","STSong","STSongti-SC-Regular","SimSun","NSimSun","FangSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16140f; --surface:#1f1c16; --surface-2:#262219; --text:#f0ebe1; --ink-2:#c9c2b4;
    --dim:#948c7c; --border:#373226; --accent:#f0704f; --accent-ink:#ff9a7d; --accent-soft:#3a241c;
    --good:#6fce97; --pine:#7fb59e; --shadow:0 10px 30px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:clip}
img,svg,video,canvas{max-width:100%}
#app{min-width:0}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2rem}
#progress{position:fixed;left:0;top:0;z-index:200;height:3px;background:var(--accent);width:0;pointer-events:none;display:block}
.art-progress{position:absolute;top:0;left:0;right:0;height:3px;z-index:6;pointer-events:none}
.art-progress-fill{height:100%;width:0;background:var(--accent)}
/* ---------------- Home (mirrors the original knowledge base) ---------------- */
.home-head{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);background:var(--bg)}
.home-head-in{width:100%;max-width:1024px;margin:0 auto;padding:12px 16px}
.search-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1 1 200px;min-width:0}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--dim);pointer-events:none}
.search-wrap input{width:100%;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:10px 16px 10px 40px;font-size:16px;outline:none;color:var(--text);font-family:var(--sans)}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--dim)}
.home-main{width:100%;max-width:1024px;margin:0 auto;padding:0 16px 48px}
.home-top{width:100%;max-width:1024px;margin:0 auto;padding:0 16px}
.home-hero{padding:30px 0 20px}
.home-hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);line-height:1.15;letter-spacing:.01em;margin:0}
.home-hero .tagline{margin:10px 0 0;font-size:15px;line-height:1.7;color:var(--ink-2)}
.home-hero .rule{margin-top:16px;width:56px;height:3px;background:var(--accent)}
.overview-line{margin:20px 0 0;font-size:14px;color:var(--dim)}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:480px){.cat-grid{grid-template-columns:minmax(0,1fr)}}
@media (min-width:1024px){.cat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat-card{border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);padding:16px;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--text);width:100%;min-width:0;display:flex;flex-direction:column;justify-content:flex-start}
.cat-card .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cat-card .name{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.cat-card .cnt{flex:none;font-size:12px;color:var(--dim)}
.cat-card .latest{display:block;margin-top:8px;font-size:12px;line-height:1.625;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinned-sec{margin-top:32px}
.sec-h{font-family:var(--serif);font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0;line-height:1.45}
.sec-h .dash{display:inline-block;height:3px;width:24px;background:var(--accent);flex:none}
.pin-grid{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:768px){.pin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pin-card{border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);padding:20px;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--text);display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;min-width:0}
.pin-card .cat{font-size:12px;font-weight:500;color:var(--pine)}
.pin-card .ttl{display:block;margin-top:6px;font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.45;overflow-wrap:break-word}
.pin-card .sum{display:block;margin-top:8px;font-size:14px;line-height:1.625;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pin-card .date{display:block;margin-top:12px;font-size:12px;color:var(--dim)}
.list-anchor{scroll-margin-top:96px}
.list-head{margin-top:32px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.list-head h2{font-family:var(--serif);font-size:18px;font-weight:700;margin:0;line-height:1.45}
.list-head .cnt{font-size:12px;color:var(--dim)}
.clear-btn{margin-left:auto;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:6px 14px;font-size:14px;cursor:pointer;font-family:var(--sans);color:var(--text)}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 14px;font-size:14px;cursor:pointer;font-family:var(--sans)}
.chip.on{border-color:var(--pine);background:var(--pine);color:#fff}
.alist{margin:16px 0 0;padding:0;list-style:none}
.alist li+li{margin-top:12px}
.acard{display:flex;flex-direction:column;justify-content:flex-start;width:100%;min-width:0;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);padding:16px;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--text)}
.acard .top{display:flex;align-items:center;gap:8px;font-size:12px}
.acard .cat{font-weight:500;color:var(--pine)}
.acard .pin{border-radius:4px;background:var(--accent-soft);padding:2px 6px;font-weight:500;color:var(--accent)}
.acard .date{margin-left:auto;color:var(--dim)}
.acard h3{margin:6px 0 0;font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.45;overflow-wrap:break-word}
.acard .sum{margin:6px 0 0;font-size:14px;line-height:1.625;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acard .tags{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.acard .tags span{border-radius:999px;border:1px solid var(--border);padding:2px 8px;font-size:12px;color:var(--dim);line-height:1.5}
.state-msg{padding:64px 0;text-align:center}
.pager{margin-top:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.pg-btn{border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 14px;font-size:14px;cursor:pointer;font-family:var(--sans);min-width:40px}
.pg-btn.on{border-color:var(--pine);background:var(--pine);color:#fff}
.pg-btn:disabled{opacity:.45;cursor:default}
.pg-info{font-size:13px;color:var(--dim)}
.state-msg .big{font-family:var(--serif);font-size:18px;margin:0}
.state-msg .small{margin:8px 0 0;font-size:14px;color:var(--dim)}
/* ---------------- Site footer ---------------- */
.site-foot{border-top:1px solid var(--border);background:var(--bg)}
.site-foot-in{width:100%;max-width:1024px;margin:0 auto;padding:28px 16px 36px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.site-foot-copy{margin:0;font-family:var(--serif);font-size:15px;font-weight:700;line-height:1.5;color:var(--text)}
.site-foot-links{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-size:14px;line-height:1.5}
.site-foot-links a{color:var(--pine);font-weight:500;text-decoration:none}
.site-foot-links a:hover,.site-foot-links a:focus-visible{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.site-foot-sep{color:var(--dim)}
/* ---------------- Article ---------------- */
.art-head{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);background:var(--bg)}
.art-head-in{width:100%;max-width:1152px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.back-btn{border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:6px 14px;font-size:14px;cursor:pointer;font-family:var(--sans);color:var(--text);flex:none}
.crumb{display:none;min-width:0}
@media (min-width:640px){.crumb{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--dim)}}
.art-main{width:100%;max-width:1120px;margin:0 auto;padding:0 20px 48px}
.art-hero{padding:44px 0 8px}
.kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--dim)}
.kicker .dot{width:4px;height:4px;border-radius:50%;background:var(--dim);flex:none}
.art-title{font-family:var(--serif);font-weight:900;font-size:clamp(30px,5.4vw,46px);line-height:1.3;letter-spacing:.01em;margin:16px 0 6px}
.art-summary{font-size:clamp(16px,2.6vw,19px);line-height:1.7;color:var(--ink-2);margin:0 0 20px}
.tag-pill{display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:100%;border:1px solid var(--border);background:var(--surface);padding:8px 18px;border-radius:999px;font-family:var(--mono);font-size:14px;box-shadow:var(--shadow)}
.tag-pill .tg{font-weight:600;color:var(--accent-ink)}
.tag-pill .sep{color:var(--dim)}
.art-meta{margin:22px 0 26px;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px;color:var(--dim)}
.cover-fig{margin:0 0 8px}
.cover-fig img{display:block;width:100%;height:auto;border-radius:var(--radius);box-shadow:var(--shadow)}
.cover-fig figcaption{margin-top:10px;text-align:center;font-size:13px;line-height:1.6;color:var(--dim)}
@media (min-width:861px){.art-grid.has-toc{display:grid;grid-template-columns:230px minmax(0,1fr);gap:44px;align-items:start}}
.toc-side{display:none}
@media (min-width:861px){.toc-side{display:block;position:sticky;top:80px;align-self:start}}
.toc-side nav{padding-top:28px}
.toc-title{font-size:12.5px;font-weight:700;letter-spacing:.16em;color:var(--dim);margin:0 0 12px}
.toc-list{max-height:calc(100vh - 10.5rem);overflow-y:auto;padding:0 6px 0 0;margin:0;list-style:none;scrollbar-width:thin;scrollbar-color:var(--border) transparent;overscroll-behavior:contain}
.toc-list::-webkit-scrollbar{width:5px}
.toc-list::-webkit-scrollbar-track{background:transparent}
.toc-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
.toc-list li{margin:2px 0}
.toc-list button{display:block;width:100%;text-align:left;border:none;background:none;border-radius:9px;padding:7px 12px;font-size:14.5px;line-height:1.5;color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.toc-list button:hover{background:var(--surface-2)}
.toc-list button .n{font-family:var(--mono);font-size:12px;color:var(--dim);margin-right:8px}
.toc-list button.on{background:var(--accent-soft);font-weight:700;color:var(--accent-ink)}
.toc-list button.on .n{color:var(--accent-ink)}
.toc-list button.sub{padding-left:26px}
.toc-chips{margin-bottom:8px;padding-top:20px}
@media (min-width:861px){.toc-chips{display:none}}
.toc-chips ol{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.toc-chips button{border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);padding:6px 14px;font-size:14px;line-height:1.45;cursor:pointer;font-family:var(--sans)}
.toc-chips button .n{font-family:var(--mono);font-size:12px;color:var(--dim);margin-right:6px}
.toc-chips button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700;color:var(--accent-ink)}
.toc-chips li.sub{margin-left:10px}
.src-foot{margin-top:40px;border-top:1px solid var(--border);padding-top:16px}
.src-foot p{font-size:12px;line-height:1.625;color:var(--dim);margin:0}
.prevnext{margin-top:32px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:640px){.prevnext{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pn-btn{border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);padding:14px 16px;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--text);display:block;width:100%;min-width:0}
.pn-btn .dir{font-size:12px;color:var(--dim)}
.pn-btn .t{display:block;margin-top:4px;font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (min-width:640px){.pn-next{text-align:right}}
.pn-empty{display:none}
@media (min-width:640px){.pn-empty{display:block}}
#toTop{position:fixed;bottom:24px;right:16px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.12);cursor:pointer;display:none;color:var(--text);align-items:center;justify-content:center;padding:0}
#toTop.show{display:flex}
/* ---------------- Markdown body (ported from the original) ---------------- */
.md-body{font-family:var(--sans);font-size:17px;line-height:1.85;color:var(--text);overflow-wrap:break-word;counter-reset:kbsec;min-width:0}
.md-body ::selection{background:var(--accent-soft)}
.md-body h1,.md-body h2,.md-body h3,.md-body h4{font-family:var(--serif);font-weight:700;line-height:1.45;scroll-margin-top:84px}
.md-body h1{font-size:24px;margin:1.2em 0 .7em}
.md-body h2{counter-increment:kbsec;display:flex;align-items:baseline;gap:14px;font-size:clamp(22px,3.6vw,27px);margin:0;padding:26px 0 4px}
.md-body h2::before{content:counter(kbsec,decimal-leading-zero);flex:none;transform:translateY(-2px);font-family:var(--mono);font-weight:600;font-size:15px;line-height:1.5;color:var(--accent);border:1.5px solid var(--accent);border-radius:9px;padding:1px 9px}
.md-body>h2:not(:first-child){border-top:1px solid var(--border)}
.md-body h3{font-size:19px;margin:30px 0 8px}
.md-body h4{font-size:17px;margin:1.3em 0 .5em}
.md-body p{margin:12px 0}
.md-body ul,.md-body ol{margin:14px 0;padding-left:1.5em}
.md-body ul{list-style:disc}
.md-body ol{list-style:decimal}
.md-body li{margin:7px 0}
.md-body li::marker{color:var(--accent);font-weight:600}
.md-body li>ul,.md-body li>ol{margin:.25em 0}
.md-body p.kb-lead{font-size:18px;color:var(--ink-2)}
.md-body blockquote{margin:24px 0;padding:16px 20px;border-radius:var(--radius);background:var(--accent-soft);font-family:var(--serif);font-size:17.5px;line-height:1.8;color:var(--text)}
.md-body blockquote p{margin:0}
.md-body blockquote p+p{margin-top:.6em}
.md-body code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 6px;border-radius:6px}
.md-body pre{margin:1em 0;padding:1em 1.1em;border-radius:var(--radius);overflow-x:auto;max-width:100%;background:#242019;color:#f2ead9;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.md-body pre code{background:transparent;padding:0;font-size:13px;line-height:1.65;color:inherit}
@media (prefers-color-scheme: dark){.md-body pre{background:#100e0b;box-shadow:inset 0 0 0 1px var(--border)}}
.md-body figure{margin:26px 0}
.md-body figure img,.md-body p img{display:block;width:100%;max-width:100%;height:auto;margin:0 auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
.md-body figcaption{margin-top:10px;text-align:center;font-size:13px;line-height:1.6;color:var(--dim)}
.md-body .kb-img-missing{display:block;margin:1.2em 0;padding:1em 1.1em;border:1px dashed var(--border);border-radius:var(--radius);text-align:center;font-size:14px;color:var(--dim)}
.md-body a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.md-body hr{border:none;border-top:1px solid var(--border);margin:1.8em auto;width:60%}
.md-body table{width:100%;border-collapse:collapse;margin:22px 0;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:15px}
.md-body th,.md-body td{padding:13px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border);line-height:1.65;overflow-wrap:break-word}
.md-body thead th{background:var(--surface-2);font-size:13px;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
.md-body tbody tr:last-child td{border-bottom:none}
@media (max-width:640px){
  .md-body table,.md-body thead,.md-body tbody,.md-body tr,.md-body td{display:block}
  .md-body thead{display:none}
  .md-body tr{padding:12px 0;border-bottom:1px solid var(--border)}
  .md-body tbody tr:last-child{border-bottom:none}
  .md-body td{border-bottom:none;padding:3px 16px}
  .md-body td:first-child{font-weight:700;font-size:16px;padding-top:2px}
  .md-body td[data-k]::before{content:attr(data-k) "：";color:var(--dim);font-size:13px}
}
.md-body strong{font-weight:700}
.md-body ol.kb-points{list-style:none;margin:14px 0;padding:0;counter-reset:kbpt}
.md-body ol.kb-points>li{position:relative;margin:10px 0;padding:14px 16px 14px 52px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.md-body ol.kb-points>li::before{counter-increment:kbpt;content:counter(kbpt);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--mono);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.md-body ol.kb-points>li::marker{content:none}
.md-body .kb-points .kb-lead{font-weight:700}
.md-body .kb-points .kb-rest{display:block;margin-top:4px}
.md-body ol.kb-flow{list-style:none;margin:14px 0;padding:0;counter-reset:kbfl}
.md-body ol.kb-flow>li{position:relative;margin:10px 0;padding-left:38px}
.md-body ol.kb-flow>li::before{counter-increment:kbfl;content:counter(kbfl);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.md-body ol.kb-flow>li::marker{content:none}
.md-body ul.kb-cards{list-style:none;margin:20px 0;padding:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.md-body ul.kb-cards[data-count="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.md-body ul.kb-cards,.md-body ul.kb-cards[data-count="3"]{grid-template-columns:minmax(0,1fr)}}
.md-body ul.kb-cards>li{margin:0;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.md-body ul.kb-cards>li::marker{content:none}
.md-body .kb-cards .kb-tag{display:block;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em;margin-bottom:4px}
.md-body .kb-cards .kb-lead{display:block;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.5;margin-bottom:5px}
.md-body .kb-cards .kb-rest{display:block;font-size:15px;line-height:1.7;color:var(--ink-2)}
.md-body ul.kb-checks{list-style:none;margin:16px 0;padding:0}

<script id="atlas-data" type="application/json">{"articles": [{"id": 18, "title": "Gemini 4 Neon 十条实战心得：拿它做点能卖的东西", "category": "AI 与 Agent", "tags": ["Gemini", "Neon", "Antigravity", "AI Studio", "副业"], "summary": "读 Greg Isenberg 帖子后自己重写的学习笔记：连续用 Neon 5 天的 10 条心得——/swarm 连夜干活、物理仿真先验证想法、发票做成财务模型、本地商家网站变计算器，配上 Orchestrator 加 Hydrogen 的省钱分工。", "pinned": false, "updated": "2026-11-27", "source": "来源：X 帖子《10 insights using Gemini 4 Neon》（Greg Isenberg @gregisenberg），原文 https://x.com/gregisenberg/status/2123943441017028866 ，发布于 2026-11-21。本文是读帖子文字后用自己的话重写的学习笔记，不是原文翻译；帖子附带的 16 分钟视频没有完整看完，本文只按帖子文字总结。帖子标注为付费合作（paid partnership）。", "toc": [{"title": "先说前提：5 天试用、付费合作披露", "label": "先说前提", "level": 2, "n": 1}, {"title": "十条实战心得", "label": "十条实战心得", "level": 2, "n": 2}, {"title": "1. 用 /swarm 组一支小队，让它连夜干活", "label": "1. 用 /swarm 组一支小队，让它连夜干活", "level": 3, "n": 3}, {"title": "2. 物理仿真很强，先模拟再花钱", "label": "2. 物理仿真很强，先模拟再花钱", "level": 3, "n": 4}, {"title": "3. 把一堆乱发票交给它，让它搭财务模型", "label": "3. 把一堆乱发票交给它，让它搭财务模型", "level": 3, "n": 5}, {"title": "4. 粘贴本地商家的网站，让它造点有用的东西", "label": "4. 粘贴本地商家的网站，让它造点有用的东西", "level": 3, "n": 6}, {"title": "5. 给自己的产品做个小游戏或 3D 定制器，前面放邮箱收集", "label": "5. 给自己的产品做个小游戏或 3D 定制器，前面放邮箱收集", "level": 3, "n": 7}, {"title": "6. 把上季度的客户通话记录全倒进去，问它“我们承诺过什么、却没做到”", "label": "6. 把上季度的客户通话记录全倒进去，问它“我们承诺过什么、却没做到”", "level": 3, "n": 8}, {"title": "7. 无聊的活，它是作者试过最好的模型", "label": "7. 无聊的活，它是作者试过最好的模型", "level": 3, "n": 9}, {"title": "8. 日常干活用 Orchestrator：Neon 动脑，Hydrogen 动手", "label": "8. 日常干活用 Orchestrator：Neon 动脑，Hydrogen 动手", "level": 3, "n": 10}, {"title": "9. 思考强度开到最高，在 Antigravity 里写代码", "label": "9. 思考强度开到最高，在 Antigravity 里写代码", "level": 3, "n": 11}, {"title": "10. 让它别用破折号，它就是个好写手；它写得短，想多要就让它展开", "label": "10. 让它别用破折号，它就是个好写手；它写得短，想多要就让它展开", "level": 3, "n": 12}, {"title": "成本与用法要点", "label": "成本与用法要点", "level": 2, "n": 13}, {"title": "从哪开始：今晚先试一条", "label": "从哪开始", "level": 2, "n": 14}], "html": "<h2 id=\"sec-1\">先说前提：5 天试用、付费合作披露<\/h2>\n<p>这篇笔记的来源是一条 X 帖子，不是长文。作者 Greg Isenberg 说，他连续用了 Gemini 4 Neon 5 天，Google 给了他提前体验资格，并且赞助了那期节目。帖子本身也标注了 paid partnership（付费合作）。<\/p>\n<p>所以读这十条要带一个前提：<strong>作者是在被赞助的情况下试用的<\/strong>，热情要打个折再听。但十条里大部分是具体做法——让它连夜干活、拿发票做财务模型、把通话记录倒进去找承诺——这些做法本身能不能用，不依赖于赞助关系，可以一条一条自己试。<\/p>\n<p>帖子的数据（2026-11-27 快照）：85 条回复、60 次转帖、811 个赞、1,044 个收藏、约 12 万浏览。附带一个 16 分钟的视频，本文只按帖子文字总结，视频没有完整看完。<\/p>\n<h2 id=\"sec-2\">十条实战心得<\/h2>\n<h3 id=\"sec-3\">1. 用 /swarm 组一支小队，让它连夜干活<\/h3>\n<p>做法：用 <code>/swarm<\/code> 搭一支小队——一个研究员、一个设计师、几个工程师——指给它一个细分领域的目录站或者一个小应用，让它在垂直方向上跑，晚上挂着，第二天早上看结果。<\/p>\n<p>为什么值得记：单 Agent 干活是线性的，一次只做一件事；一支小队可以并行，研究、设计、实现同时推进。关键在“小”和“垂直”——范围越窄，队伍越不容易跑偏；范围一大，几个人各干各的，最后拼不起来。连夜跑还有一个前提：任务要拆得够清楚，验收标准要事先定好，不然早上起来只会看到一堆半成品。<\/p>\n<p>这条和上一篇 Neon 笔记是同一个思路：总协调拆任务、子 Agent 分头干、校验者收尾。不同的是，这里更强调“过夜”这个用法——把 Agent 当成夜班员工，而不是随叫随到的聊天助手。<\/p>\n<h3 id=\"sec-4\">2. 物理仿真很强，先模拟再花钱<\/h3>\n<p>做法：Neon 的物理仿真做得很好。想做硬件产品，先让它模拟一下；想验证一个点子，先做个小游戏出来看看手感。<\/p>\n<p>为什么值得记：做实物之前最贵的是试错成本——开模、打样、备货，每一步都是真金白银。先在仿真里把想法跑一遍，看看结构合不合理、玩法有没有意思，不行就换方向，成本只是一点 token。游戏也一样：先做个能玩的原型，验证核心玩法，再决定要不要继续投入。<\/p>\n<h3 id=\"sec-5\">3. 把一堆乱发票交给它，让它搭财务模型<\/h3>\n<p>做法：把公司乱七八糟的发票直接交给它，让它搭一个财务模型；搭完别停，继续追问，就像手边坐了一个 CFO。<\/p>\n<p>为什么值得记：财务模型的难点不在算数，在把散落的单据整理成结构——哪笔是收入、哪笔是成本、哪些是重复的、现金流什么时候紧张。Agent 擅长这种整理活。更关键的是后半句：<strong>模型搭完要继续追问<\/strong>。一次输出只是起点，追问“如果下季度收入掉两成会怎样”“哪项成本最先失控”，模型才真正变成决策工具。<\/p>\n<h3 id=\"sec-6\">4. 粘贴本地商家的网站，让它造点有用的东西<\/h3>\n<p>做法：贴一个本地商家的网站进去，它会把整个站读完，然后给这家店做点有用的东西，比如一个计算器，或者一个新版首页。作者特别标了这条，说这是一个值得留意的现金流点子。<\/p>\n<p>为什么值得记：本地小商家大多没有技术团队，网站几年不更新，但需求是真实的：顾客想算价格、想预约、想快速找到信息。一个计算器或者一个翻新过的首页，对店主来说是看得见的价值，对会用 Agent 的人来说是一次能收钱的服务。Agent 在这里干的活是“读懂一家店，再给它做工具”，门槛不在技术，在能不能找到有付费意愿的店主。<\/p>\n<h3 id=\"sec-7\">5. 给自己的产品做个小游戏或 3D 定制器，前面放邮箱收集<\/h3>\n<p>做法：给自己的产品做一个小游戏或者 3D 定制器，前面放一个留邮箱的入口。比发 PDF 有意思得多，别人也更愿意分享。<\/p>\n<p>为什么值得记：PDF 是单向的，下载完就没了；一个能玩的东西是会自己传播的——人玩完会发给朋友看。邮箱收集是关键：流量来了要能留下来，不然热闹一场什么都没留下。游戏和定制器在这里不是目的，是获客手段：让人先玩起来，玩的过程中留下联系方式，再慢慢转化。<\/p>\n<h3 id=\"sec-8\">6. 把上季度的客户通话记录全倒进去，问它“我们承诺过什么、却没做到”<\/h3>\n<p>做法：把上个季度全部客户通话的文字记录放进 AI Studio，问它一个问题：我们承诺过什么，却从来没兑现？它一次能处理大约一百万 token，全程保持敏锐。<\/p>\n<p>为什么值得记：承诺散落在几十上百次通话里，没有人能全记住，更没有人会去逐条核对。Agent 的优势是能把一百万 token 的记录一次看完，还能逐条对上“说了什么”和“后来做了什么”。这件事的价值不在技术，在组织上：<strong>没兑现的承诺就是流失的客户<\/strong>，先把它们找出来，再谈增长。<\/p>\n<p>这里还有一个数字值得记：大约一百万 token 一次处理完。上下文窗口大到这种程度，工作方式就变了——不用再一段一段切、不用先摘要再提问，可以直接把原始材料全倒进去问。<\/p>\n<h3 id=\"sec-9\">7. 无聊的活，它是作者试过最好的模型<\/h3>\n<p>做法：枯燥的业务运营活——线索分流、CRM 数据清理、发票对账——是作者试过的模型里做得最好的。<\/p>\n<p>为什么值得记：这些活的特点是量大、重复、规则明确，但又脏又乱：数据格式不统一、字段缺失、例外情况多。模型在这里拼的不是创造力，是耐心和细致：按规则一条一条处理，不漏、不错、不自己发挥。作者的评价是“出乎意料地擅长业务运营”，说明 Neon 的长处不只在写代码和做创意，脏活累活同样能接。<\/p>\n<h3 id=\"sec-10\">8. 日常干活用 Orchestrator：Neon 动脑，Hydrogen 动手<\/h3>\n<p>做法：日常工作里，在 Antigravity 中选 Orchestrator（总协调者）：让 Neon 负责思考，把打字和执行交给 Hydrogen，后者便宜得多。<\/p>\n<p>为什么值得记：这是上一篇笔记里“贵模型干便宜活”的反面解法——<strong>思考和执行分开计价<\/strong>。架构判断、任务拆解这种需要动脑的活交给 Neon；写样板代码、跑重复操作这种动手活交给更便宜的 Hydrogen。分工越清楚，账单越好看。Orchestrator 这个角色就是干这个的：它不自己写代码，只负责想明白了再派活。<\/p>\n<h3 id=\"sec-11\">9. 思考强度开到最高，在 Antigravity 里写代码<\/h3>\n<p>做法：把思考强度（thinking）调到 high，在 Antigravity 里写代码。虽然 Antigravity 这个应用本身还有不少要追赶的地方，但同一个模型在那里的代码测试分数能高出 3 倍。<\/p>\n<p>为什么值得记：两点。第一，思考强度是个杠杆：调高了，模型想得更久、想得更深，代码质量跟着上去，代价是更慢、更贵，值得在关键任务上开。第二，<strong>同一个模型在不同环境里的表现能差出 3 倍<\/strong>——环境、工具、上下文组织方式，都会进分数里。选对环境，有时候比换模型更划算。<\/p>\n<h3 id=\"sec-12\">10. 让它别用破折号，它就是个好写手；它写得短，想多要就让它展开<\/h3>\n<p>做法：告诉它别用 em dash（长破折号），它写东西就很好；它写得偏短，想要更多就让它展开。<\/p>\n<p>为什么值得记：这是个很小的技巧，但背后是个通用规律：<strong>模型的默认文风是可以调的<\/strong>。破折号这种细节，模型用得多不是因为写得好，是因为训练数据里多；一句话就能改掉。写得短也一样：不是它不会写长，是默认输出偏短，明确要求展开，它就会展开。写东西之前先定风格，少返工。<\/p>\n<h2 id=\"sec-13\">成本与用法要点<\/h2>\n<p>帖子的 TLDR 只有一句话：<strong>性价比极高，比大家习惯的价格便宜得多<\/strong>，所以可以更自由地做实验、开更多 Agent。<\/p>\n<p>结合十条心得，成本和用法可以收成四点：<\/p>\n<ol><li><strong>思考和执行分开花钱<\/strong>：Neon 动脑、Hydrogen 动手（第 8 条）。这是最直接的省钱办法。<\/li><li><strong>思考强度是杠杆<\/strong>：调到 high，代码质量上去，但更慢更贵，留给关键任务（第 9 条）。<\/li><li><strong>一次能吃大约一百万 token<\/strong>：整季度的通话记录可以直接倒进去，不用先切分、不用先摘要（第 6 条）。上下文大，工作方式就跟着变。<\/li><li><strong>队伍越并行，烧得越快<\/strong>：这条是上一篇笔记的结论，这里同样适用——/swarm 连夜跑听起来很爽，但每个队员都在烧自己的上下文和 token，规模上去之前先算好账。<\/li><\/ol>\n<p>还有一个容易被忽略的点：第 9 条说的“同一个模型在不同环境里能差出 3 倍”，和上一篇笔记里 SimpleBench “同一个模型在不同评测框架下能差出 12.8% 到 39.0%” 是同一个提醒：<strong>看分数先看环境和框架，再看模型本身<\/strong>。<\/p>\n<h2 id=\"sec-14\">从哪开始：今晚先试一条<\/h2>\n<p>十条不用全试，先挑一条今晚就能动手：<\/p>\n<ol><li><strong>最快见效<\/strong>：第 6 条——找一份现成的材料（通话记录、会议纪要、客户反馈），一次倒进去，问一个你一直想问但没空核对的问题。材料现成，答案立即可验证。<\/li><li><strong>最可能赚钱<\/strong>：第 4 条——找一家本地小店，把它的网站贴进去，做个计算器或者新首页，拿去问店主愿不愿意付费。能不能收到钱，是检验这条的唯一标准。<\/li><li><strong>最适合练手<\/strong>：第 1 条——用 /swarm 做一个小东西，范围越小越好，挂一晚上，第二天看结果。跑通一次，就知道队伍该怎么搭、哪里会跑偏。<\/li><\/ol>\n<p>三条的共同点是：<strong>材料现成、结果可验证<\/strong>。先跑通一条，再决定要不要继续往下试。<\/p>\n<blockquote><p>别只把它当聊天窗口。先让它干一晚上活，或者先拿它算一笔账，值不值，一次就试出来了。<\/p><\/blockquote>\n<hr />\n<p>来源：X 帖子《10 insights using Gemini 4 Neon》（Greg Isenberg @gregisenberg），https://x.com/gregisenberg/status/2123943441017028866 ，发布于 2026-11-21。帖子标注为付费合作（paid partnership）；作者称连续试用 Neon 5 天，Google 提供了提前体验资格并赞助了相关节目。帖子附带的 16 分钟视频没有完整看完，本文只按帖子文字总结。帖子还提到完整节目在 YouTube（@startupideaspod），以及节目里讲的“5 种最能发挥价值的用法”和“5 种赚钱方法”，不在本文讨论范围。无配图：原文只有视频，没有静态图片，因此本文没有封面图。<\/p>", "body": "\n# Gemini 4 Neon 十条实战心得：拿它做点能卖的东西\n\n## 先说前提：5 天试用、付费合作披露 <!-- toc: 先说前提 -->\n\n这篇笔记的来源是一条 X 帖子，不是长文。作者 Greg Isenberg 说，他连续用了 Gemini 4 Neon 5 天，Google 给了他提前体验资格，并且赞助了那期节目。帖子本身也标注了 paid partnership（付费合作）。\n\n所以读这十条要带一个前提：**作者是在被赞助的情况下试用的**，热情要打个折再听。但十条里大部分是具体做法——让它连夜干活、拿发票做财务模型、把通话记录倒进去找承诺——这些做法本身能不能用，不依赖于赞助关系，可以一条一条自己试。\n\n帖子的数据（2026-11-27 快照）：85 条回复、60 次转帖、811 个赞、1,044 个收藏、约 12 万浏览。附带一个 16 分钟的视频，本文只按帖子文字总结，视频没有完整看完。\n\n## 十条实战心得 <!-- toc: 十条实战心得 -->\n\n### 1. 用 /swarm 组一支小队，让它连夜干活\n\n做法：用 `/swarm` 搭一支小队——一个研究员、一个设计师、几个工程师——指给它一个细分领域的目录站或者一个小应用，让它在垂直方向上跑，晚上挂着，第二天早上看结果。\n\n为什么值得记：单 Agent 干活是线性的，一次只做一件事；一支小队可以并行，研究、设计、实现同时推进。关键在“小”和“垂直”——范围越窄，队伍越不容易跑偏；范围一大，几个人各干各的，最后拼不起来。连夜跑还有一个前提：任务要拆得够清楚，验收标准要事先定好，不然早上起来只会看到一堆半成品。\n\n这条和上一篇 Neon 笔记是同一个思路：总协调拆任务、子 Agent 分头干、校验者收尾。不同的是，这里更强调“过夜”这个用法——把 Agent 当成夜班员工，而不是随叫随到的聊天助手。\n\n### 2. 物理仿真很强，先模拟再花钱\n\n做法：Neon 的物理仿真做得很好。想做硬件产品，先让它模拟一下；想验证一个点子，先做个小游戏出来看看手感。\n\n为什么值得记：做实物之前最贵的是试错成本——开模、打样、备货，每一步都是真金白银。先在仿真里把想法跑一遍，看看结构合不合理、玩法有没有意思，不行就换方向，成本只是一点 token。游戏也一样：先做个能玩的原型，验证核心玩法，再决定要不要继续投入。\n\n### 3. 把一堆乱发票交给它，让它搭财务模型\n\n做法：把公司乱七八糟的发票直接交给它，让它搭一个财务模型；搭完别停，继续追问，就像手边坐了一个 CFO。\n\n为什么值得记：财务模型的难点不在算数，在把散落的单据整理成结构——哪笔是收入、哪笔是成本、哪些是重复的、现金流什么时候紧张。Agent 擅长这种整理活。更关键的是后半句：**模型搭完要继续追问**。一次输出只是起点，追问“如果下季度收入掉两成会怎样”“哪项成本最先失控”，模型才真正变成决策工具。\n\n### 4. 粘贴本地商家的网站，让它造点有用的东西\n\n做法：贴一个本地商家的网站进去，它会把整个站读完，然后给这家店做点有用的东西，比如一个计算器，或者一个新版首页。作者特别标了这条，说这是一个值得留意的现金流点子。\n\n为什么值得记：本地小商家大多没有技术团队，网站几年不更新，但需求是真实的：顾客想算价格、想预约、想快速找到信息。一个计算器或者一个翻新过的首页，对店主来说是看得见的价值，对会用 Agent 的人来说是一次能收钱的服务。Agent 在这里干的活是“读懂一家店，再给它做工具”，门槛不在技术，在能不能找到有付费意愿的店主。\n\n### 5. 给自己的产品做个小游戏或 3D 定制器，前面放邮箱收集\n\n做法：给自己的产品做一个小游戏或者 3D 定制器，前面放一个留邮箱的入口。比发 PDF 有意思得多，别人也更愿意分享。\n\n为什么值得记：PDF 是单向的，下载完就没了；一个能玩的东西是会自己传播的——人玩完会发给朋友看。邮箱收集是关键：流量来了要能留下来，不然热闹一场什么都没留下。游戏和定制器在这里不是目的，是获客手段：让人先玩起来，玩的过程中留下联系方式，再慢慢转化。\n\n### 6. 把上季度的客户通话记录全倒进去，问它“我们承诺过什么、却没做到”\n\n做法：把上个季度全部客户通话的文字记录放进 AI Studio，问它一个问题：我们承诺过什么，却从来没兑现？它一次能处理大约一百万 token，全程保持敏锐。\n\n为什么值得记：承诺散落在几十上百次通话里，没有人能全记住，更没有人会去逐条核对。Agent 的优势是能把一百万 token 的记录一次看完，还能逐条对上“说了什么”和“后来做了什么”。这件事的价值不在技术，在组织上：**没兑现的承诺就是流失的客户**，先把它们找出来，再谈增长。\n\n这里还有一个数字值得记：大约一百万 token 一次处理完。上下文窗口大到这种程度，工作方式就变了——不用再一段一段切、不用先摘要再提问，可以直接把原始材料全倒进去问。\n\n### 7. 无聊的活，它是作者试过最好的模型\n\n做法：枯燥的业务运营活——线索分流、CRM 数据清理、发票对账——是作者试过的模型里做得最好的。\n\n为什么值得记：这些活的特点是量大、重复、规则明确，但又脏又乱：数据格式不统一、字段缺失、例外情况多。模型在这里拼的不是创造力，是耐心和细致：按规则一条一条处理，不漏、不错、不自己发挥。作者的评价是“出乎意料地擅长业务运营”，说明 Neon 的长处不只在写代码和做创意，脏活累活同样能接。\n\n### 8. 日常干活用 Orchestrator：Neon 动脑，Hydrogen 动手\n\n做法：日常工作里，在 Antigravity 中选 Orchestrator（总协调者）：让 Neon 负责思考，把打字和执行交给 Hydrogen，后者便宜得多。\n\n为什么值得记：这是上一篇笔记里“贵模型干便宜活”的反面解法——**思考和执行分开计价**。架构判断、任务拆解这种需要动脑的活交给 Neon；写样板代码、跑重复操作这种动手活交给更便宜的 Hydrogen。分工越清楚，账单越好看。Orchestrator 这个角色就是干这个的：它不自己写代码，只负责想明白了再派活。\n\n### 9. 思考强度开到最高，在 Antigravity 里写代码\n\n做法：把思考强度（thinking）调到 high，在 Antigravity 里写代码。虽然 Antigravity 这个应用本身还有不少要追赶的地方，但同一个模型在那里的代码测试分数能高出 3 倍。\n\n为什么值得记：两点。第一，思考强度是个杠杆：调高了，模型想得更久、想得更深，代码质量跟着上去，代价是更慢、更贵，值得在关键任务上开。第二，**同一个模型在不同环境里的表现能差出 3 倍**——环境、工具、上下文组织方式，都会进分数里。选对环境，有时候比换模型更划算。\n\n### 10. 让它别用破折号，它就是个好写手；它写得短，想多要就让它展开\n\n做法：告诉它别用 em dash（长破折号），它写东西就很好；它写得偏短，想要更多就让它展开。\n\n为什么值得记：这是个很小的技巧，但背后是个通用规律：**模型的默认文风是可以调的**。破折号这种细节，模型用得多不是因为写得好，是因为训练数据里多；一句话就能改掉。写得短也一样：不是它不会写长，是默认输出偏短，明确要求展开，它就会展开。写东西之前先定风格，少返工。\n\n## 成本与用法要点 <!-- toc: 成本与用法要点 -->\n\n帖子的 TLDR 只有一句话：**性价比极高，比大家习惯的价格便宜得多**，所以可以更自由地做实验、开更多 Agent。\n\n结合十条心得，成本和用法可以收成四点：\n\n1. **思考和执行分开花钱**：Neon 动脑、Hydrogen 动手（第 8 条）。这是最直接的省钱办法。\n2. **思考强度是杠杆**：调到 high，代码质量上去，但更慢更贵，留给关键任务（第 9 条）。\n3. **一次能吃大约一百万 token**：整季度的通话记录可以直接倒进去，不用先切分、不用先摘要（第 6 条）。上下文大，工作方式就跟着变。\n4. **队伍越并行，烧得越快**：这条是上一篇笔记的结论，这里同样适用——/swarm 连夜跑听起来很爽，但每个队员都在烧自己的上下文和 token，规模上去之前先算好账。\n\n还有一个容易被忽略的点：第 9 条说的“同一个模型在不同环境里能差出 3 倍”，和上一篇笔记里 SimpleBench “同一个模型在不同评测框架下能差出 12.8% 到 39.0%” 是同一个提醒：**看分数先看环境和框架，再看模型本身**。\n\n## 从哪开始：今晚先试一条 <!-- toc: 从哪开始 -->\n\n十条不用全试，先挑一条今晚就能动手：\n\n1. **最快见效**：第 6 条——找一份现成的材料（通话记录、会议纪要、客户反馈），一次倒进去，问一个你一直想问但没空核对的问题。材料现成，答案立即可验证。\n2. **最可能赚钱**：第 4 条——找一家本地小店，把它的网站贴进去，做个计算器或者新首页，拿去问店主愿不愿意付费。能不能收到钱，是检验这条的唯一标准。\n3. **最适合练手**：第 1 条——用 /swarm 做一个小东西，范围越小越好，挂一晚上，第二天看结果。跑通一次，就知道队伍该怎么搭、哪里会跑偏。\n\n三条的共同点是：**材料现成、结果可验证**。先跑通一条，再决定要不要继续往下试。\n\n> 别只把它当聊天窗口。先让它干一晚上活，或者先拿它算一笔账，值不值，一次就试出来了。\n\n---\n\n来源：X 帖子《10 insights using Gemini 4 Neon》（Greg Isenberg @gregisenberg），https://x.com/gregisenberg/status/2123943441017028866 ，发布于 2026-11-21。帖子标注为付费合作（paid partnership）；作者称连续试用 Neon 5 天，Google 提供了提前体验资格并赞助了相关节目。帖子附带的 16 分钟视频没有完整看完，本文只按帖子文字总结。帖子还提到完整节目在 YouTube（@startupideaspod），以及节目里讲的“5 种最能发挥价值的用法”和“5 种赚钱方法”，不在本文讨论范围。无配图：原文只有视频，没有静态图片，因此本文没有封面图。\n", "file": "18-gemini-neon-10-insights.md", "cover_key": ""}, {"id": 17, "title": "Gemini 4 Neon：用一个 AI Agent 团队干活，而不是一个聊天窗口", "category": "AI 与 Agent", "tags": ["Gemini", "Neon", "Agent", "Antigravity", "多机器人"], "summary": "读 Movez 长文后自己重写的学习笔记：Neon 不是一个模型，而是一套模型家族；一个总协调加一群专职子 Agent 分工干活，校验者最后把关，成本陷阱和评测陷阱都在第七节。", "pinned": false, "updated": "2026-11-27", "source": "来源：X 长文《Gemini 4 Neon: Build an AI Agent team with the best Google model in 8 Steps (Full-course)》（Movez @0xMovez），原文 https://x.com/0xMovez/status/2125577359269019791 ，发布于 2026-11-26。本文是读后用自己的话重写的学习笔记，不是原文翻译；原文里的提示词和命令只按意思转述，没有原文照搬。11 张配图来自原文，随知识库一同保存，离线可看。", "toc": [{"title": "问题出在哪：只当聊天窗口用", "label": "问题出在哪", "level": 2, "n": 1}, {"title": "Neon 是一套模型家族", "label": "Neon 是一套模型家族", "level": 2, "n": 2}, {"title": "团队架构：一个总协调，加一群专职队员", "label": "团队架构", "level": 2, "n": 3}, {"title": "八个步骤：从拿到 Neon 到跑起第一支队伍", "label": "八个步骤", "level": 2, "n": 4}, {"title": "步骤 1 · 先拿到 Neon", "label": "步骤 1 · 先拿到 Neon", "level": 3, "n": 5}, {"title": "步骤 2 · 装好 Antigravity", "label": "步骤 2 · 装好 Antigravity", "level": 3, "n": 6}, {"title": "步骤 3 · 建 @coordinator 总协调", "label": "步骤 3 · 建 @coordinator 总协调", "level": 3, "n": 7}, {"title": "步骤 4 · 建子 Agent 群", "label": "步骤 4 · 建子 Agent 群", "level": 3, "n": 8}, {"title": "步骤 5 · 写 AGENTS.md", "label": "步骤 5 · 写 AGENTS.md", "level": 3, "n": 9}, {"title": "步骤 6 · 加 @verifier 校验者", "label": "步骤 6 · 加 @verifier 校验者", "level": 3, "n": 10}, {"title": "步骤 7 · 跑第一次 /swarm", "label": "步骤 7 · 跑第一次 /swarm", "level": 3, "n": 11}, {"title": "步骤 8 · 扩到 T3 Code 这类多线程环境", "label": "步骤 8 · 扩到 T3 Code 这类多线程环境", "level": 3, "n": 12}, {"title": "团队规则 AGENTS.md：写给全队看的同一份规矩", "label": "团队规则 AGENTS.md", "level": 2, "n": 13}, {"title": "校验者为什么最关键：防幻觉，也防假完成", "label": "校验者为什么最关键", "level": 2, "n": 14}, {"title": "成本陷阱与评测陷阱：单价会骗人", "label": "成本陷阱与评测陷阱", "level": 2, "n": 15}, {"title": "先看单价", "label": "先看单价", "level": 3, "n": 16}, {"title": "订阅和按量，差了一个数量级", "label": "订阅和按量，差了一个数量级", "level": 3, "n": 17}, {"title": "队伍越并行，烧得越快", "label": "队伍越并行，烧得越快", "level": 3, "n": 18}, {"title": "评测分数也会骗人", "label": "评测分数也会骗人", "level": 3, "n": 19}, {"title": "最小可用形态与落地顺序：一个晚上搭起来", "label": "最小可用形态与落地顺序", "level": 2, "n": 20}], "html": "<h2 id=\"sec-1\">问题出在哪：只当聊天窗口用<\/h2>\n<p>作者开篇的判断是：Gemini 4 Neon 是当月最被低估的模型，不是因为它不够强，而是 99% 的人只用到了它大概三分之一的本事。<\/p>\n<p>大多数人的用法是：打开一个聊天窗口，把需求整段贴进去，等它一次答完。这样用有三个毛病：<\/p>\n<ol><li><strong>上下文越攒越重<\/strong>：一个窗口里既要理解需求、又要写代码、又要检查自己，上下文一路膨胀，越到后面越容易走偏。<\/li><li><strong>贵模型干便宜活<\/strong>：写一行注释和做一次架构判断，按同一个价格结算。<\/li><li><strong>没人复核<\/strong>：它说做完了，你只能信它，假完成混在真完成里，分不出来。<\/li><\/ol>\n<p>作者认为 Google 设计 Neon 的本意不是再造一个更强的单聊窗口，而是让它当一支队伍的队长：<strong>一个模型家族一起干活<\/strong>。这和我们之前记的 Grok Harness 笔记是同一个思路：模型只负责动嘴和拆解，外面的组织方式决定了最后能走多远。<\/p>\n<h2 id=\"sec-2\">Neon 是一套模型家族<\/h2>\n<p>Neon 不是一个模型的名字，而是一家子，分工不同，价格也不同：<\/p>\n<ul><li><strong>Neon Pro<\/strong>：旗舰，当总协调和大脑，负责规划、复杂推理、写作和代码架构。<\/li><li><strong>Flash<\/strong>：快、便宜的执行者，适合量大、重复的活。<\/li><li><strong>Deep Think / Deep Research<\/strong>：深度研究和长推理，适合需要慢慢想的任务。<\/li><li><strong>Nano Banana 2<\/strong>：负责生成和编辑图片。<\/li><li>原文的团队示意图里还列了 Deep Research、Nano Banana 2、Omni L2 Flash、3.0 Flash TTS，说明这个家族还可以按需要再扩。<\/li><\/ul>\n<p>核心原则只有一条：<strong>一个 Agent 只干一件事<\/strong>。职责单一，上下文就小；上下文小，并行才跑得起来，成本也才算得清。反过来，一个 Agent 什么都干，上下文一上来，什么都干不好。<\/p>\n<p>这和 Grok 那边的四层分工是能对上的：贵的只留在真正需要动脑的地方，便宜的去跑量大的执行，只不过这里的执行者是同一家族里不同档位的模型。<\/p>\n<h2 id=\"sec-3\">团队架构：一个总协调，加一群专职队员<\/h2>\n<div class=\"img-note\">🖼 配图：图 1 · Neon 团队架构：总协调在上，子 Agent 群在下（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<p>上面是总协调，下面是一群子 Agent，原文给的队员名单大概是这样：<\/p>\n<ul><li><strong>@coordinator（总协调）<\/strong>：接需求、拆任务、按专长分派、收结果、验收。它只做分解、分配和验收，<strong>自己不写代码<\/strong>。<\/li><li><strong>@api<\/strong>：后端和接口。<\/li><li><strong>@ui<\/strong>：界面。<\/li><li><strong>@verifier<\/strong>：校验者，最后把关，下一节细说。<\/li><li><strong>@tests<\/strong>：测试。<\/li><li><strong>@docs<\/strong>：文档。<\/li><li><strong>@tin<\/strong>：轻量、快速的小任务。<\/li><\/ul>\n<p>这个架构解决的是单 Agent 的两个老毛病：上下文过载，和假完成。总协调不直接动手，就不会被执行细节拖进上下文；校验者最后单独检查一遍，做完了还是没做完，有一个人专门负责较真。<\/p>\n<h2 id=\"sec-4\">八个步骤：从拿到 Neon 到跑起第一支队伍<\/h2>\n<h3 id=\"sec-5\">步骤 1 · 先拿到 Neon<\/h3>\n<p>原文给了四条路：订阅 Google AI Pro（每月 19.99 美元）、用 Antigravity、走 Gemini API 的命令行工具、以及用 API 密钥直连的路子。Workspace 账号的用户要走 API 密钥那条路。先有入口，再谈组队。<\/p>\n<div class=\"img-note\">🖼 配图：图 2 · 原文步骤截图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h3 id=\"sec-6\">步骤 2 · 装好 Antigravity<\/h3>\n<p>Antigravity 是 Google 的 Agent 开发环境。装好后建一个工作区，把默认模型设成 Gemini 4 Neon Pro，再把项目结构和需要接的服务准备好。这是队伍的驻地，之后所有队员都在这里干活。<\/p>\n<div class=\"img-note\">🖼 配图：图 3 · 原文步骤截图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h3 id=\"sec-7\">步骤 3 · 建 @coordinator 总协调<\/h3>\n<p>给总协调写一份职责说明，大意是：把任务拆小、按专长分给队员、收回结果、验收通过再交给用户；自己绝不写代码。这一条是写死的，不是建议——总协调一旦开始自己动手，上下文和责任就全乱了。<\/p>\n<div class=\"img-note\">🖼 配图：图 4 · 原文步骤截图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h3 id=\"sec-8\">步骤 4 · 建子 Agent 群<\/h3>\n<p>给每个队员各写一份职责说明，各配各的模型和工具：后端、界面、测试、文档、轻任务，各归其位。配模型时按活的轻重来：协调和关键判断用 Pro，快速执行用 Flash。不要所有活都跑在最贵的旗舰上，那是烧钱最快的姿势。<\/p>\n<div class=\"img-note\">🖼 配图：图 5 · 原文步骤截图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h3 id=\"sec-9\">步骤 5 · 写 AGENTS.md<\/h3>\n<p>这一步在第 5 节单独细说。简单讲：AGENTS.md 是全队的共享规则文件，所有队员都按它办事。<\/p>\n<div class=\"img-note\">🖼 配图：图 6 · 原文步骤截图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h3 id=\"sec-10\">步骤 6 · 加 @verifier 校验者<\/h3>\n<p>每个任务最后都要过校验者这一关。这一关是作者眼里整套做法里最关键的一环，第 6 节细说。<\/p>\n<div class=\"img-note\">🖼 配图：图 7 · 原文步骤截图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h3 id=\"sec-11\">步骤 7 · 跑第一次 /swarm<\/h3>\n<p>用一条真实的任务命令启动队伍，比如给 HTTP 客户端加上指数退避重试。流程是：总协调拆解 → 队员并行执行 → 收回结果 → 校验者检查 → 交付。第一次不用大，就要一个完整闭环。<\/p>\n<div class=\"img-note\">🖼 配图：图 8 · 原文步骤截图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h3 id=\"sec-12\">步骤 8 · 扩到 T3 Code 这类多线程环境<\/h3>\n<p>同一套做法搬进 T3 Code 这样的多线程环境，用多线程并行队伍接更大的任务。原文举的例子是 Theo（t3dotgg）用 T3 Code 做并行实践的做法。先在小环境跑通，再扩规模，顺序别反了。<\/p>\n<div class=\"img-note\">🖼 配图：图 9 · 原文步骤截图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<div class=\"img-note\">🖼 配图：图 10 · 原文步骤截图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h2 id=\"sec-13\">团队规则 AGENTS.md：写给全队看的同一份规矩<\/h2>\n<p>AGENTS.md 是整个队伍共享的规则文件，原文强调了几条：<\/p>\n<ol><li><strong>总协调只做分解、分配和验收，绝不写代码<\/strong>。<\/li><li><strong>每个子 Agent 一份工作、一个模型、一套工具<\/strong>，职责写死，不串岗。<\/li><li><strong>不碰职责之外的文件<\/strong>：每个队员只动自己那摊，出界就是事故。<\/li><li><strong>占位符和没做完的东西，绝不能当成做完了交上来<\/strong>：没做完就写没做完，留空就写留空。<\/li><\/ol>\n<p>这份文件的作用和 Grok 笔记里的 Harness 规则是一回事：把规矩写在模型外面，让 Harness 和流程去管，而不是指望模型自己自觉。规矩越清楚，队伍越大越不乱。<\/p>\n<h2 id=\"sec-14\">校验者为什么最关键：防幻觉，也防假完成<\/h2>\n<p>作者把 @verifier 叫做整套做法里最关键的一步，理由很直接：没有校验者，Agent 说做完了就是做完了，你没有第二双眼睛。<\/p>\n<p>校验者的做法是：把队员声称的结果，逐条对照代码和测试结果核查，引用行号和测试证据；核查不过的打回去；<strong>没法核实的，就明确写「无法核实」，绝不能含糊放过<\/strong>。<\/p>\n<p>这一步同时防两种毛病：<\/p>\n<ul><li><strong>幻觉<\/strong>：模型编了一个看起来合理的答案，但代码里根本没有。<\/li><li><strong>假完成<\/strong>：任务只做了一半，占位符还在，汇报却写「已完成」。<\/li><\/ul>\n<p>和 Grok 笔记里最后由中立合并机器人统一落地的思路一样：写功能的人不负责验收，验收的人不写功能。两边分开，假完成才混不过去。<\/p>\n<h2 id=\"sec-15\">成本陷阱与评测陷阱：单价会骗人<\/h2>\n<p>这是全文最值得细看的一节，数字都在这里。<\/p>\n<h3 id=\"sec-16\">先看单价<\/h3>\n<ul><li><strong>Neon Pro<\/strong>：输入每百万 token 3 美元，输出 15 美元。<\/li><li><strong>Hydrogen<\/strong>：输入 1.50 美元，输出 7.50 美元。<\/li><li><strong>Carbon<\/strong>：限时价输入 2 美元、输出 10 美元，到 2026 年 11 月 30 日为止；从 2026 年 12 月 1 日起涨到输入 4 美元、输出 20 美元。<\/li><\/ul>\n<p>只看单价会得出「Pro 最贵、Carbon 最便宜」的结论，但作者提醒：单价是最会骗人的数字。<\/p>\n<h3 id=\"sec-17\">订阅和按量，差了一个数量级<\/h3>\n<p>原文给了一个反直觉的对比：同样一个 50M token 的单 Agent 任务，走 API 按量付费大约要 <strong>900 美元<\/strong>，而在每月 19.99 美元的 Google AI Pro 订阅里，同样用量大约只要 <strong>20 美元<\/strong>。用量越大，订阅和按量的差距越大。先算自己一个月的用量，再选付费方式，别只看单价。<\/p>\n<pre><code class=\"language-bill\">算一笔账：50M token 的单 Agent 任务\n同样用量，两种付费方式\nAPI 按量|$900|Neon Pro 单价 $3 / $15 每百万\n45×\n订阅|$20|Google AI Pro 每月 $19.99 档位\n用量越大，订阅和按量的差距越大\n<\/code><\/pre>\n<h3 id=\"sec-18\">队伍越并行，烧得越快<\/h3>\n<p>组队不是免费的：子 Agent 每人一份自己的上下文、自己的一份 token 消耗，队伍整体的用量大约是单个 Agent 的 <strong>4 到 5 倍<\/strong>。并行换来的是速度和分工，不是省钱。扩队伍之前，先想清楚省下的时间值不值这几倍的用量。<\/p>\n<h3 id=\"sec-19\">评测分数也会骗人<\/h3>\n<p>SimpleBench 的提醒是：同一个模型，在不同评测框架下能跑出 <strong>12.8% 到 39.0%<\/strong> 的分数，差的是框架，不是模型。看评测先看框架，再看分数。<\/p>\n<p>还有一个容易忽略的成本项：输出长度。Neon 平均每次输出约 <strong>2,385 个 token<\/strong>，而 Opus 5.5 约 <strong>575 个<\/strong>。输出越长，输出 token 的账单越长。原文还引用了一次完整运行的对比：<strong>7.99 美元对 2.74 美元<\/strong>——单价、用量、输出长度、并行消耗，四项一起算才是真实成本，只看其中一项都会算错。<\/p>\n<h2 id=\"sec-20\">最小可用形态与落地顺序：一个晚上搭起来<\/h2>\n<p>作者的结论是：Neon 本身不是魔法，优势来自队伍、规则和校验这三件套加在一起。最小可用形态不用大：<\/p>\n<ol><li>一个总协调 @coordinator。<\/li><li>几个专职子 Agent（后端、界面、测试、文档，先按需配）。<\/li><li>一个严格的 @verifier，最后把关。<\/li><li>一份写清楚的 AGENTS.md。<\/li><\/ol>\n<p>然后拿一个真实任务跑通一次完整闭环，跑顺了再扩规模。按作者的说法，搭起这套东西大约只要一个晚上的时间。<\/p>\n<p>落地顺序和我们之前记的 Grok 笔记是一致的：先让总协调加一两个专家跑通一个小闭环，规矩和校验先立起来，再加人、再扩规模。顺序反了——先搭十个队员、再补规则——最后一定是返工。<\/p>\n<blockquote><p>模型是队员，队伍、规则和校验才是战斗力。先把一个真实任务完整跑通，再谈规模。<\/p><\/blockquote>\n<hr />\n<p>来源：X 长文《Gemini 4 Neon: Build an AI Agent team with the best Google model in 8 Steps (Full-course)》（Movez @0xMovez），https://x.com/0xMovez/status/2125577359269019791 ，发布于 2026-11-26。另见原文引用的 Theo 的 T3 Code 帖子、Anthropic 的 Claude Code 最佳实践、SimpleBench 评测站。<\/p>", "body": "\n# Gemini 4 Neon：用一个 AI Agent 团队干活，而不是一个聊天窗口\n\n## 问题出在哪：只当聊天窗口用 <!-- toc: 问题出在哪 -->\n\n<!-- lead -->\n作者开篇的判断是：Gemini 4 Neon 是当月最被低估的模型，不是因为它不够强，而是 99% 的人只用到了它大概三分之一的本事。\n\n大多数人的用法是：打开一个聊天窗口，把需求整段贴进去，等它一次答完。这样用有三个毛病：\n\n1. **上下文越攒越重**：一个窗口里既要理解需求、又要写代码、又要检查自己，上下文一路膨胀，越到后面越容易走偏。\n2. **贵模型干便宜活**：写一行注释和做一次架构判断，按同一个价格结算。\n3. **没人复核**：它说做完了，你只能信它，假完成混在真完成里，分不出来。\n\n作者认为 Google 设计 Neon 的本意不是再造一个更强的单聊窗口，而是让它当一支队伍的队长：**一个模型家族一起干活**。这和我们之前记的 Grok Harness 笔记是同一个思路：模型只负责动嘴和拆解，外面的组织方式决定了最后能走多远。\n\n## Neon 是一套模型家族 <!-- toc: Neon 是一套模型家族 -->\n\nNeon 不是一个模型的名字，而是一家子，分工不同，价格也不同：\n\n- **Neon Pro**：旗舰，当总协调和大脑，负责规划、复杂推理、写作和代码架构。\n- **Flash**：快、便宜的执行者，适合量大、重复的活。\n- **Deep Think / Deep Research**：深度研究和长推理，适合需要慢慢想的任务。\n- **Nano Banana 2**：负责生成和编辑图片。\n- 原文的团队示意图里还列了 Deep Research、Nano Banana 2、Omni L2 Flash、3.0 Flash TTS，说明这个家族还可以按需要再扩。\n\n核心原则只有一条：**一个 Agent 只干一件事**。职责单一，上下文就小；上下文小，并行才跑得起来，成本也才算得清。反过来，一个 Agent 什么都干，上下文一上来，什么都干不好。\n\n这和 Grok 那边的四层分工是能对上的：贵的只留在真正需要动脑的地方，便宜的去跑量大的执行，只不过这里的执行者是同一家族里不同档位的模型。\n\n## 团队架构：一个总协调，加一群专职队员 <!-- toc: 团队架构 -->\n\n![图 1 · Neon 团队架构：总协调在上，子 Agent 群在下](kbimg:gemini-neon-architecture.jpg)\n\n上面是总协调，下面是一群子 Agent，原文给的队员名单大概是这样：\n\n- **@coordinator（总协调）**：接需求、拆任务、按专长分派、收结果、验收。它只做分解、分配和验收，**自己不写代码**。\n- **@api**：后端和接口。\n- **@ui**：界面。\n- **@verifier**：校验者，最后把关，下一节细说。\n- **@tests**：测试。\n- **@docs**：文档。\n- **@tin**：轻量、快速的小任务。\n\n这个架构解决的是单 Agent 的两个老毛病：上下文过载，和假完成。总协调不直接动手，就不会被执行细节拖进上下文；校验者最后单独检查一遍，做完了还是没做完，有一个人专门负责较真。\n\n## 八个步骤：从拿到 Neon 到跑起第一支队伍 <!-- toc: 八个步骤 -->\n\n### 步骤 1 · 先拿到 Neon\n\n原文给了四条路：订阅 Google AI Pro（每月 19.99 美元）、用 Antigravity、走 Gemini API 的命令行工具、以及用 API 密钥直连的路子。Workspace 账号的用户要走 API 密钥那条路。先有入口，再谈组队。\n\n![图 2 · 原文步骤截图](kbimg:gemini-neon-s01.jpg)\n\n### 步骤 2 · 装好 Antigravity\n\nAntigravity 是 Google 的 Agent 开发环境。装好后建一个工作区，把默认模型设成 Gemini 4 Neon Pro，再把项目结构和需要接的服务准备好。这是队伍的驻地，之后所有队员都在这里干活。\n\n![图 3 · 原文步骤截图](kbimg:gemini-neon-s02.png)\n\n### 步骤 3 · 建 @coordinator 总协调\n\n给总协调写一份职责说明，大意是：把任务拆小、按专长分给队员、收回结果、验收通过再交给用户；自己绝不写代码。这一条是写死的，不是建议——总协调一旦开始自己动手，上下文和责任就全乱了。\n\n![图 4 · 原文步骤截图](kbimg:gemini-neon-s03.jpg)\n\n### 步骤 4 · 建子 Agent 群\n\n给每个队员各写一份职责说明，各配各的模型和工具：后端、界面、测试、文档、轻任务，各归其位。配模型时按活的轻重来：协调和关键判断用 Pro，快速执行用 Flash。不要所有活都跑在最贵的旗舰上，那是烧钱最快的姿势。\n\n![图 5 · 原文步骤截图](kbimg:gemini-neon-s04.jpg)\n\n### 步骤 5 · 写 AGENTS.md\n\n这一步在第 5 节单独细说。简单讲：AGENTS.md 是全队的共享规则文件，所有队员都按它办事。\n\n![图 6 · 原文步骤截图](kbimg:gemini-neon-s05.jpg)\n\n### 步骤 6 · 加 @verifier 校验者\n\n每个任务最后都要过校验者这一关。这一关是作者眼里整套做法里最关键的一环，第 6 节细说。\n\n![图 7 · 原文步骤截图](kbimg:gemini-neon-s06.jpg)\n\n### 步骤 7 · 跑第一次 /swarm\n\n用一条真实的任务命令启动队伍，比如给 HTTP 客户端加上指数退避重试。流程是：总协调拆解 → 队员并行执行 → 收回结果 → 校验者检查 → 交付。第一次不用大，就要一个完整闭环。\n\n![图 8 · 原文步骤截图](kbimg:gemini-neon-s07.jpg)\n\n### 步骤 8 · 扩到 T3 Code 这类多线程环境\n\n同一套做法搬进 T3 Code 这样的多线程环境，用多线程并行队伍接更大的任务。原文举的例子是 Theo（t3dotgg）用 T3 Code 做并行实践的做法。先在小环境跑通，再扩规模，顺序别反了。\n\n![图 9 · 原文步骤截图](kbimg:gemini-neon-s08.jpg)\n\n![图 10 · 原文步骤截图](kbimg:gemini-neon-s09.png)\n\n## 团队规则 AGENTS.md：写给全队看的同一份规矩 <!-- toc: 团队规则 AGENTS.md -->\n\nAGENTS.md 是整个队伍共享的规则文件，原文强调了几条：\n\n1. **总协调只做分解、分配和验收，绝不写代码**。\n2. **每个子 Agent 一份工作、一个模型、一套工具**，职责写死，不串岗。\n3. **不碰职责之外的文件**：每个队员只动自己那摊，出界就是事故。\n4. **占位符和没做完的东西，绝不能当成做完了交上来**：没做完就写没做完，留空就写留空。\n\n这份文件的作用和 Grok 笔记里的 Harness 规则是一回事：把规矩写在模型外面，让 Harness 和流程去管，而不是指望模型自己自觉。规矩越清楚，队伍越大越不乱。\n\n## 校验者为什么最关键：防幻觉，也防假完成 <!-- toc: 校验者为什么最关键 -->\n\n<!-- lead -->\n作者把 @verifier 叫做整套做法里最关键的一步，理由很直接：没有校验者，Agent 说做完了就是做完了，你没有第二双眼睛。\n\n校验者的做法是：把队员声称的结果，逐条对照代码和测试结果核查，引用行号和测试证据；核查不过的打回去；**没法核实的，就明确写「无法核实」，绝不能含糊放过**。\n\n这一步同时防两种毛病：\n\n- **幻觉**：模型编了一个看起来合理的答案，但代码里根本没有。\n- **假完成**：任务只做了一半，占位符还在，汇报却写「已完成」。\n\n和 Grok 笔记里最后由中立合并机器人统一落地的思路一样：写功能的人不负责验收，验收的人不写功能。两边分开，假完成才混不过去。\n\n## 成本陷阱与评测陷阱：单价会骗人 <!-- toc: 成本陷阱与评测陷阱 -->\n\n这是全文最值得细看的一节，数字都在这里。\n\n### 先看单价\n\n- **Neon Pro**：输入每百万 token 3 美元，输出 15 美元。\n- **Hydrogen**：输入 1.50 美元，输出 7.50 美元。\n- **Carbon**：限时价输入 2 美元、输出 10 美元，到 2026 年 11 月 30 日为止；从 2026 年 12 月 1 日起涨到输入 4 美元、输出 20 美元。\n\n只看单价会得出「Pro 最贵、Carbon 最便宜」的结论，但作者提醒：单价是最会骗人的数字。\n\n### 订阅和按量，差了一个数量级\n\n原文给了一个反直觉的对比：同样一个 50M token 的单 Agent 任务，走 API 按量付费大约要 **900 美元**，而在每月 19.99 美元的 Google AI Pro 订阅里，同样用量大约只要 **20 美元**。用量越大，订阅和按量的差距越大。先算自己一个月的用量，再选付费方式，别只看单价。\n\n```bill\n算一笔账：50M token 的单 Agent 任务\n同样用量，两种付费方式\nAPI 按量|$900|Neon Pro 单价 $3 / $15 每百万\n45×\n订阅|$20|Google AI Pro 每月 $19.99 档位\n用量越大，订阅和按量的差距越大\n```\n\n### 队伍越并行，烧得越快\n\n组队不是免费的：子 Agent 每人一份自己的上下文、自己的一份 token 消耗，队伍整体的用量大约是单个 Agent 的 **4 到 5 倍**。并行换来的是速度和分工，不是省钱。扩队伍之前，先想清楚省下的时间值不值这几倍的用量。\n\n### 评测分数也会骗人\n\nSimpleBench 的提醒是：同一个模型，在不同评测框架下能跑出 **12.8% 到 39.0%** 的分数，差的是框架，不是模型。看评测先看框架，再看分数。\n\n还有一个容易忽略的成本项：输出长度。Neon 平均每次输出约 **2,385 个 token**，而 Opus 5.5 约 **575 个**。输出越长，输出 token 的账单越长。原文还引用了一次完整运行的对比：**7.99 美元对 2.74 美元**——单价、用量、输出长度、并行消耗，四项一起算才是真实成本，只看其中一项都会算错。\n\n## 最小可用形态与落地顺序：一个晚上搭起来 <!-- toc: 最小可用形态与落地顺序 -->\n\n作者的结论是：Neon 本身不是魔法，优势来自队伍、规则和校验这三件套加在一起。最小可用形态不用大：\n\n1. 一个总协调 @coordinator。\n2. 几个专职子 Agent（后端、界面、测试、文档，先按需配）。\n3. 一个严格的 @verifier，最后把关。\n4. 一份写清楚的 AGENTS.md。\n\n然后拿一个真实任务跑通一次完整闭环，跑顺了再扩规模。按作者的说法，搭起这套东西大约只要一个晚上的时间。\n\n落地顺序和我们之前记的 Grok 笔记是一致的：先让总协调加一两个专家跑通一个小闭环，规矩和校验先立起来，再加人、再扩规模。顺序反了——先搭十个队员、再补规则——最后一定是返工。\n\n> 模型是队员，队伍、规则和校验才是战斗力。先把一个真实任务完整跑通，再谈规模。\n\n---\n\n来源：X 长文《Gemini 4 Neon: Build an AI Agent team with the best Google model in 8 Steps (Full-course)》（Movez @0xMovez），https://x.com/0xMovez/status/2125577359269019791 ，发布于 2026-11-26。另见原文引用的 Theo 的 T3 Code 帖子、Anthropic 的 Claude Code 最佳实践、SimpleBench 评测站。\n", "file": "17-gemini-4-neon-agent-team.md", "cover_key": "gemini-neon-cover"}, {"id": 16, "title": "X 长文 → 离线学习文档：完整流程（定版）", "category": "创作与内容", "tags": ["资料整理", "离线文档", "学习笔记", "版权边界"], "summary": "把 X 长文做成离线文档的定版流程：抓原文与配图、写自己的学习笔记（不做全文翻译）、图片本地化、Markdown 包与 HTML 预览两种交付；含这次反复试错的全部教训。", "pinned": true, "updated": "2026-11-26", "source": "整理自 2026-11-26 制作 Grok Harness 离线文档的真实任务复盘；不是对话原文。", "toc": [{"title": "定版流程", "label": "定版流程", "level": 2, "n": 1}, {"title": "踩坑记录（这篇的重点）", "label": "踩坑记录（这篇的重点）", "level": 2, "n": 2}], "html": "<h2 id=\"sec-1\">定版流程<\/h2>\n<ol><li><strong>抓原文<\/strong>：在浏览器里打开原帖，抓全文和全部配图，记下原文链接、作者、页面时间（页面时间前后不一致时按原样记录，不替作者选一个）。<\/li><li><strong>定形式：写学习笔记，不做全文翻译<\/strong>（原因见踩坑）。用自己的话重写：讲清结构、核心机制、关键数字和账、例子想说明什么、检查清单要点；想法和数字归原文，表达是自己的。<\/li><li><strong>配图本地化<\/strong>：配图全部下载到本地 <code>images/<\/code> 文件夹，正文按原文顺序引用本地文件，不放远程图片链接——解压后断网也能打开。<\/li><li><strong>交付形态<\/strong>：<br />\n   - Markdown 离线包：<code>.md<\/code> + <code>images/<\/code> 一起打包，打开 md 即可读。<br />\n   - 要预览效果时再做 HTML 版：衬线标题、侧边目录、阅读进度条；关键数字做对比卡片（如 $0.0049 对 $0.000084、58 倍）；手机上表格自动堆叠；支持深色模式。<\/li><\/ol>\n<h2 id=\"sec-2\">踩坑记录（这篇的重点）<\/h2>\n<ul><li><strong>&quot;公开能看&quot; ≠ &quot;可以全文复制&quot;<\/strong>：作者发在 X 上免费公开，版权仍归作者。把整篇长文逐句翻译、排版成文档，本质是把整部作品换种语言复制一份——不管署不署名、不管是否商用，这一步都不能做。能做的是：链接 + 概要，或用自己的话重写成学习文档；直接引用不能超过 50 个词。<\/li><li><strong>不要先承诺再改口<\/strong>：这次最初答应了&quot;抓全文、翻译成中文&quot;，后来才改口只给概要，前后不一致——教训是动手前先把形式定死（第 2 步），再开工。<\/li><li><strong>&quot;离线&quot;就要真离线<\/strong>：第一版把图片链接放进文档，那不叫离线版。图片必须下载到本地并用相对路径引用，交付前断网自检一遍。<\/li><li><strong>概要太薄也不行<\/strong>：只有几段的概要不够用，定版的学习笔记要把结构、数字、例子、清单都写全，读完笔记应能复述原文的完整思路。<\/li><\/ul>", "body": "\n# X 长文 → 离线学习文档：完整流程（定版）\n\n## 定版流程\n\n1. **抓原文**：在浏览器里打开原帖，抓全文和全部配图，记下原文链接、作者、页面时间（页面时间前后不一致时按原样记录，不替作者选一个）。\n2. **定形式：写学习笔记，不做全文翻译**（原因见踩坑）。用自己的话重写：讲清结构、核心机制、关键数字和账、例子想说明什么、检查清单要点；想法和数字归原文，表达是自己的。\n3. **配图本地化**：配图全部下载到本地 `images/` 文件夹，正文按原文顺序引用本地文件，不放远程图片链接——解压后断网也能打开。\n4. **交付形态**：\n   - Markdown 离线包：`.md` + `images/` 一起打包，打开 md 即可读。\n   - 要预览效果时再做 HTML 版：衬线标题、侧边目录、阅读进度条；关键数字做对比卡片（如 $0.0049 对 $0.000084、58 倍）；手机上表格自动堆叠；支持深色模式。\n\n## 踩坑记录（这篇的重点）\n\n- **\"公开能看\" ≠ \"可以全文复制\"**：作者发在 X 上免费公开，版权仍归作者。把整篇长文逐句翻译、排版成文档，本质是把整部作品换种语言复制一份——不管署不署名、不管是否商用，这一步都不能做。能做的是：链接 + 概要，或用自己的话重写成学习文档；直接引用不能超过 50 个词。\n- **不要先承诺再改口**：这次最初答应了\"抓全文、翻译成中文\"，后来才改口只给概要，前后不一致——教训是动手前先把形式定死（第 2 步），再开工。\n- **\"离线\"就要真离线**：第一版把图片链接放进文档，那不叫离线版。图片必须下载到本地并用相对路径引用，交付前断网自检一遍。\n- **概要太薄也不行**：只有几段的概要不够用，定版的学习笔记要把结构、数字、例子、清单都写全，读完笔记应能复述原文的完整思路。\n", "file": "16-offline-docs.md", "cover_key": "offline-docs"}, {"id": 15, "title": "Codex CLI 在 Windows 上的安装流程（进行中）", "category": "AI 与 Agent", "tags": ["Codex", "Windows", "PowerShell", "CLI"], "summary": "npm 安装已完成（0.168.0），登录待跑 Sign in with ChatGPT；踩坑：PowerShell 执行策略拦 .ps1 垫片，用 codex.cmd 或改 RemoteSigned。", "pinned": false, "updated": "2026-11-26", "source": "整理自 2026-11-13 安装记录；不是对话原文。", "toc": [{"title": "已走通的步骤", "label": "已走通的步骤", "level": 2, "n": 1}, {"title": "待完成", "label": "待完成", "level": 2, "n": 2}, {"title": "踩坑记录", "label": "踩坑记录", "level": 2, "n": 3}], "html": "<blockquote><p>状态：2026-11-13 已装好 CLI（版本 0.168.0），登录尚未完成。<br />\n机器：本机 Win11。开发角色定位：以架构师 + 代码审查为主，大部分编码交给 agent，所以 CLI 是日常主力入口。<\/p><\/blockquote>\n<h2 id=\"sec-1\">已走通的步骤<\/h2>\n<ol><li>经 npm 安装 Codex CLI。<\/li><li>验证版本：<code>codex.cmd --version<\/code> 输出 0.168.0，安装成功。<\/li><\/ol>\n<h2 id=\"sec-2\">待完成<\/h2>\n<ol><li>跑 <code>codex<\/code>，选 <strong>Sign in with ChatGPT<\/strong> 完成登录。<\/li><li>WezTerm 已下载（2026-11-13），待把默认 shell 配成 PowerShell 7。<\/li><\/ol>\n<h2 id=\"sec-3\">踩坑记录<\/h2>\n<ul><li><strong>PowerShell 执行策略会拦 <code>codex<\/code><\/strong>：直接跑 <code>codex --version<\/code> 曾被拦下，因为 npm 生成的 codex.ps1 在 Restricted 策略下禁止运行。两个解法：<\/li><li><code>Set-ExecutionPolicy RemoteSigned -Scope CurrentUser<\/code> 放开当前用户策略；或<\/li><li>一直用 <code>codex.cmd<\/code> 启动，绕开 .ps1。<\/li><li>记住这个坑的通用形态：npm 装的 CLI 在 Windows 上都有 .ps1 垫片，凡是&quot;命令存在却跑不起来先报策略错误&quot;，先换 .cmd 试。<\/li><\/ul>", "body": "\n# Codex CLI 在 Windows 上的安装流程（进行中）\n\n> 状态：2026-11-13 已装好 CLI（版本 0.168.0），登录尚未完成。\n> 机器：本机 Win11。开发角色定位：以架构师 + 代码审查为主，大部分编码交给 agent，所以 CLI 是日常主力入口。\n\n## 已走通的步骤\n\n1. 经 npm 安装 Codex CLI。\n2. 验证版本：`codex.cmd --version` 输出 0.168.0，安装成功。\n\n## 待完成\n\n1. 跑 `codex`，选 **Sign in with ChatGPT** 完成登录。\n2. WezTerm 已下载（2026-11-13），待把默认 shell 配成 PowerShell 7。\n\n## 踩坑记录\n\n- **PowerShell 执行策略会拦 `codex`**：直接跑 `codex --version` 曾被拦下，因为 npm 生成的 codex.ps1 在 Restricted 策略下禁止运行。两个解法：\n  - `Set-ExecutionPolicy RemoteSigned -Scope CurrentUser` 放开当前用户策略；或\n  - 一直用 `codex.cmd` 启动，绕开 .ps1。\n- 记住这个坑的通用形态：npm 装的 CLI 在 Windows 上都有 .ps1 垫片，凡是\"命令存在却跑不起来先报策略错误\"，先换 .cmd 试。\n", "file": "15-codex-windows.md", "cover_key": "codex-windows"}, {"id": 14, "title": "Lather & Lore 手工皂站：发布流程与待办", "category": "网站与项目", "tags": ["Lather & Lore", "Cloudflare", "Workers", "网站发布", "Search Console"], "summary": "yanchs.com 的发布通道已打通（Token 自动发布）；剩下 Search Console 验证待手动——部署 Token 无 DNS 权限，网域验证要本人加 TXT 或改用网址前缀验证。", "pinned": false, "updated": "2026-11-26", "source": "整理自 2026-11-12 上线记录；不是对话原文。", "toc": [{"title": "站点事实", "label": "站点事实", "level": 2, "n": 1}, {"title": "发布流程（已走通）", "label": "发布流程（已走通）", "level": 2, "n": 2}, {"title": "待办：Google Search Console（需本人手动）", "label": "待办：Google Search Console（需本人手动）", "level": 2, "n": 3}, {"title": "踩坑记录", "label": "踩坑记录", "level": 2, "n": 4}], "html": "<blockquote><p>状态：2026-11-12 已上线。站点 yanchs.com（手工皂品牌 Lather &amp; Lore）。<br />\n发布通道已打通：改完内容由 Muse 经 Cloudflare 自动发布，不需要手动上传。<\/p><\/blockquote>\n<h2 id=\"sec-1\">站点事实<\/h2>\n<ul><li>域名 yanchs.com 已在 Cloudflare 托管，同时绑了 www.yanchs.com。<\/li><li>部署方式：Cloudflare Workers 静态上传，预览域名 lather-and-lore.ruiyingyui.workers.dev。<\/li><li>商品：6 款手工皂，均 $12。<\/li><li>Instagram 三处入口统一指向 https://www.instagram.com/ruiyingyui/<\/li><li>页脚作者：Site Author Paul Lee，邮箱 yanchi@yanchs.com。<\/li><li>About 页人物 Lin Wei 是虚构的中国女皂匠形象（品牌故事用，不是真人）。<\/li><\/ul>\n<h2 id=\"sec-2\">发布流程（已走通）<\/h2>\n<ol><li>改内容（文案、商品、图片）。<\/li><li>用部署 Token [Token 名称已隐藏]（已接入 Cloudflare 连接器）自动发布到 Workers。<\/li><li>发布后打开 yanchs.com 与 www 两个地址各验一遍，确认新内容生效。<\/li><\/ol>\n<h2 id=\"sec-3\">待办：Google Search Console（需本人手动）<\/h2>\n<ol><li>去 Google Search Console 建资源并验证所有权：<br />\n   - 网域验证需要在 Cloudflare 加 DNS TXT 记录——部署 Token 没有 DNS 权限，这一步只能本人手动在 Cloudflare 加；或改用&quot;网址前缀&quot;验证方式绕开。<\/li><li>验证通过后提交 sitemap。<\/li><li>请求编入索引。<\/li><\/ol>\n<h2 id=\"sec-4\">踩坑记录<\/h2>\n<ul><li><strong>Token 权限边界<\/strong>：部署 Token 能发布站点，但没有 DNS 权限。凡是涉及改 DNS 的验证方式都会卡住，要么本人手动加记录，要么换不依赖 DNS 的验证方式。<\/li><\/ul>", "body": "\n# Lather & Lore 手工皂站：发布流程与待办（定版）\n\n> 状态：2026-11-12 已上线。站点 yanchs.com（手工皂品牌 Lather & Lore）。\n> 发布通道已打通：改完内容由 Muse 经 Cloudflare 自动发布，不需要手动上传。\n\n## 站点事实\n\n- 域名 yanchs.com 已在 Cloudflare 托管，同时绑了 www.yanchs.com。\n- 部署方式：Cloudflare Workers 静态上传，预览域名 lather-and-lore.ruiyingyui.workers.dev。\n- 商品：6 款手工皂，均 $12。\n- Instagram 三处入口统一指向 https://www.instagram.com/ruiyingyui/\n- 页脚作者：Site Author Paul Lee，邮箱 yanchi@yanchs.com。\n- About 页人物 Lin Wei 是虚构的中国女皂匠形象（品牌故事用，不是真人）。\n\n## 发布流程（已走通）\n\n1. 改内容（文案、商品、图片）。\n2. 用部署 Token [Token 名称已隐藏]（已接入 Cloudflare 连接器）自动发布到 Workers。\n3. 发布后打开 yanchs.com 与 www 两个地址各验一遍，确认新内容生效。\n\n## 待办：Google Search Console（需本人手动）\n\n1. 去 Google Search Console 建资源并验证所有权：\n   - 网域验证需要在 Cloudflare 加 DNS TXT 记录——部署 Token 没有 DNS 权限，这一步只能本人手动在 Cloudflare 加；或改用\"网址前缀\"验证方式绕开。\n2. 验证通过后提交 sitemap。\n3. 请求编入索引。\n\n## 踩坑记录\n\n- **Token 权限边界**：部署 Token 能发布站点，但没有 DNS 权限。凡是涉及改 DNS 的验证方式都会卡住，要么本人手动加记录，要么换不依赖 DNS 的验证方式。\n", "file": "14-lather-lore.md", "cover_key": "lather-lore"}, {"id": 13, "title": "RedPocket $30/年 eSIM 使用手册（实测版）", "category": "账号与服务", "tags": ["RedPocket", "eSIM", "漫游", "WiFi Calling", "验证码"], "summary": "GSMA 线路与中国漫游的实测手册：网页开 Enable Roaming、漫游余额、WhatsApp 能收码而 Telegram 未收到、WiFi Calling 在中国必须走美国 IP 拉起。", "pinned": false, "updated": "2026-11-26", "source": "整理自 2026-11-25 激活与实测记录；不是对话原文。", "toc": [{"title": "套餐事实", "label": "套餐事实", "level": 2, "n": 1}, {"title": "线路铁律", "label": "线路铁律", "level": 2, "n": 2}, {"title": "中国漫游（已实测可用）", "label": "中国漫游（已实测可用）", "level": 2, "n": 3}, {"title": "收短信（注册验证码用）", "label": "收短信（注册验证码用）", "level": 2, "n": 4}, {"title": "WiFi Calling 在中国的限制（重点）", "label": "WiFi Calling 在中国的限制（重点）", "level": 2, "n": 5}, {"title": "踩坑记录", "label": "踩坑记录", "level": 2, "n": 6}], "html": "<blockquote><p>状态：已激活，客服 Sean 重新应用套餐并修正日期后数据恢复正常。<br />\n设备：iPhone XS Max（A2104）。登录 RedPocket 须关 VPN、换连接。<\/p><\/blockquote>\n<h2 id=\"sec-1\">套餐事实<\/h2>\n<ul><li>套餐：360 Day Unlimited Talk/Text + 200MB 5G，$30/年。<\/li><li>数据：200MB/200MB（客服修正后恢复满额）。<\/li><li>WiFi Calling：已开启。<\/li><li>余额续期：2026-12-26；下次付款：2027-11-25。<\/li><\/ul>\n<h2 id=\"sec-2\">线路铁律<\/h2>\n<ul><li>当前线路是 <strong>GSMA（AT&amp;T）<\/strong>——唯一含国际漫游的网。别切到 GSMT / CDMA，切过去漫游就没了。<\/li><li>漫游只有 GSMA 套餐有，CDMA / GSMT 没有。<\/li><\/ul>\n<h2 id=\"sec-3\">中国漫游（已实测可用）<\/h2>\n<ol><li>官网 Roaming 页显示 CHINA included；Roaming Balances 为 100/100 Minutes。<\/li><li>必须在网页上点 <strong>Enable Roaming<\/strong> 开通，光插卡不会自动开。<\/li><li>官方说法是须在美国境内先选好目的地国家；但本人已在中国实测漫游可用——以实测为准，官方口径记录在此备查。<\/li><li>实测结论：没有 WiFi Calling 也打通了电话，蜂窝漫游本身能通话。<\/li><\/ol>\n<h2 id=\"sec-4\">收短信（注册验证码用）<\/h2>\n<ul><li>WhatsApp 短信：已收到，收短信能力已证实。<\/li><li>Telegram 注册：未收到码。同一线路不同服务结果不同，注册前先想好备选验证方式。<\/li><\/ul>\n<h2 id=\"sec-5\">WiFi Calling 在中国的限制（重点）<\/h2>\n<ul><li>AT&amp;T 官网明确：WiFi Calling 在中国不可用，中国 IP 直连会被拒签。<\/li><li>拉起条件：必须走美国 IP——用支持 UDP 的美区节点做热点 / 旁路由，让手机流量从美国出口走。<\/li><li>佐证：此前唯一一次状态栏出现 &quot;RedPocket Wi-Fi&quot; 时，手机正开着 VPN（美国 IP）。<\/li><\/ul>\n<h2 id=\"sec-6\">踩坑记录<\/h2>\n<ul><li><strong>611 / 800 免费电话在境外常打不通<\/strong>，不要拿它当&quot;线路是否正常&quot;的测试标准，会误判。<\/li><li><strong>套餐日期出过错<\/strong>：初激活时日期不对，是客服 Sean 重新应用套餐才修正的——激活后第一件事核对数据余额和日期，不对立刻找客服。<\/li><li><strong>登录要关 VPN<\/strong>：开着 VPN 登不上 RedPocket 账户，关掉并换一条连接再登。<\/li><\/ul>", "body": "\n# RedPocket $30/年 eSIM 使用手册（实测版）\n\n> 状态：已激活，客服 Sean 重新应用套餐并修正日期后数据恢复正常。\n> 设备：iPhone XS Max（A2104）。登录 RedPocket 须关 VPN、换连接。\n\n## 套餐事实\n\n- 套餐：360 Day Unlimited Talk/Text + 200MB 5G，$30/年。\n- 数据：200MB/200MB（客服修正后恢复满额）。\n- WiFi Calling：已开启。\n- 余额续期：2026-12-26；下次付款：2027-11-25。\n\n## 线路铁律\n\n- 当前线路是 **GSMA（AT&T）**——唯一含国际漫游的网。别切到 GSMT / CDMA，切过去漫游就没了。\n- 漫游只有 GSMA 套餐有，CDMA / GSMT 没有。\n\n## 中国漫游（已实测可用）\n\n1. 官网 Roaming 页显示 CHINA included；Roaming Balances 为 100/100 Minutes。\n2. 必须在网页上点 **Enable Roaming** 开通，光插卡不会自动开。\n3. 官方说法是须在美国境内先选好目的地国家；但本人已在中国实测漫游可用——以实测为准，官方口径记录在此备查。\n4. 实测结论：没有 WiFi Calling 也打通了电话，蜂窝漫游本身能通话。\n\n## 收短信（注册验证码用）\n\n- WhatsApp 短信：已收到，收短信能力已证实。\n- Telegram 注册：未收到码。同一线路不同服务结果不同，注册前先想好备选验证方式。\n\n## WiFi Calling 在中国的限制（重点）\n\n- AT&T 官网明确：WiFi Calling 在中国不可用，中国 IP 直连会被拒签。\n- 拉起条件：必须走美国 IP——用支持 UDP 的美区节点做热点 / 旁路由，让手机流量从美国出口走。\n- 佐证：此前唯一一次状态栏出现 \"RedPocket Wi-Fi\" 时，手机正开着 VPN（美国 IP）。\n\n## 踩坑记录\n\n- **611 / 800 免费电话在境外常打不通**，不要拿它当\"线路是否正常\"的测试标准，会误判。\n- **套餐日期出过错**：初激活时日期不对，是客服 Sean 重新应用套餐才修正的——激活后第一件事核对数据余额和日期，不对立刻找客服。\n- **登录要关 VPN**：开着 VPN 登不上 RedPocket 账户，关掉并换一条连接再登。\n", "file": "13-redpocket-esim.md", "cover_key": "redpocket-esim"}, {"id": 12, "title": "Railway 部署 Xray 四节点（定版）", "category": "节点与代理", "tags": ["Railway", "Xray", "多地区节点"], "summary": "personal-xray 四个地区服务的部署要点：用 teddysun 镜像避开官方镜像无 shell，启动命令硬编码端口，重部署后必须同步核对端口。", "pinned": false, "updated": "2026-11-26", "source": "整理自 2026-11-07 部署记录；不是对话原文。节点凭据只存订阅文件，不写入本条。", "toc": [{"title": "成果形态", "label": "成果形态", "level": 2, "n": 1}, {"title": "部署要点（照着走能复现）", "label": "部署要点（照着走能复现）", "level": 2, "n": 2}, {"title": "踩坑记录", "label": "踩坑记录", "level": 2, "n": 3}], "html": "<blockquote><p>状态：2026-11-07 已部署，四服务 ACTIVE，WS 握手成功。<br />\n定位：多地区中转节点。节点凭据只存订阅文件，不写进任何文档。<\/p><\/blockquote>\n<h2 id=\"sec-1\">成果形态<\/h2>\n<ul><li>项目：personal-xray，共四个服务，域名后缀均为 <code>.up.railway.app<\/code>：<\/li><li>美西：[节点域名已隐藏]<\/li><li>美东：[节点域名已隐藏]<\/li><li>欧西：[节点域名已隐藏]<\/li><li>新加坡：[节点域名已隐藏]<\/li><li>费用：试用额度剩 $5.00（2026-11-07 时点），到期或额度用完需升级；月成本约 $2.50/月。<\/li><\/ul>\n<h2 id=\"sec-2\">部署要点（照着走能复现）<\/h2>\n<ol><li>镜像不要用官方镜像（没有 shell，没法调试），改用 <code>teddysun/xray:latest<\/code>（内置 Xray 26.10.31）。<\/li><li>每个服务的启动命令按目标端口硬编码监听：四个服务分别是 8080 / 8079 / 9000 / 9000。<\/li><li>部署后逐个验收 WS 握手，通了才算数。<\/li><\/ol>\n<h2 id=\"sec-3\">踩坑记录<\/h2>\n<ul><li><strong>端口会变<\/strong>：重新部署后平台分配的端口可能变化，启动命令里硬编码的监听端口必须同步改，否则服务起来了也连不上。每次重部署后第一件事就是核对端口。<\/li><li><strong>官方镜像无 shell<\/strong>：排障时进不去容器，只能换 teddysun 镜像。这是选镜像时就要避开的坑，不是部署后才发现的问题。<\/li><\/ul>", "body": "\n# Railway 部署 Xray 四节点（定版）\n\n> 状态：2026-11-07 已部署，四服务 ACTIVE，WS 握手成功。\n> 定位：多地区中转节点。节点凭据只存订阅文件，不写进任何文档。\n\n## 成果形态\n\n- 项目：personal-xray，共四个服务，域名后缀均为 `.up.railway.app`：\n  - 美西：[节点域名已隐藏]\n  - 美东：[节点域名已隐藏]\n  - 欧西：[节点域名已隐藏]\n  - 新加坡：[节点域名已隐藏]\n- 费用：试用额度剩 $5.00（2026-11-07 时点），到期或额度用完需升级；月成本约 $2.50/月。\n\n## 部署要点（照着走能复现）\n\n1. 镜像不要用官方镜像（没有 shell，没法调试），改用 `teddysun/xray:latest`（内置 Xray 26.10.31）。\n2. 每个服务的启动命令按目标端口硬编码监听：四个服务分别是 8080 / 8079 / 9000 / 9000。\n3. 部署后逐个验收 WS 握手，通了才算数。\n\n## 踩坑记录\n\n- **端口会变**：重新部署后平台分配的端口可能变化，启动命令里硬编码的监听端口必须同步改，否则服务起来了也连不上。每次重部署后第一件事就是核对端口。\n- **官方镜像无 shell**：排障时进不去容器，只能换 teddysun 镜像。这是选镜像时就要避开的坑，不是部署后才发现的问题。\n", "file": "12-railway-xray.md", "cover_key": "railway-xray"}, {"id": 11, "title": "CT8.PL 免费主机部署 Xray 节点（定版）", "category": "节点与代理", "tags": ["CT8", "免费主机", "Xray", "VLESS", "保活"], "summary": "波兰免费共享主机上用面板定时任务保活 Xray 的部署形态：VLESS+WS+TLS 对外 443；含 2027-02-08 到期与提前续期动作。", "pinned": false, "updated": "2026-11-26", "source": "整理自 2026-11-10 建成实测记录；不是对话原文。", "toc": [{"title": "账号与期限", "label": "账号与期限", "level": 2, "n": 1}, {"title": "部署形态（已实测通）", "label": "部署形态（已实测通）", "level": 2, "n": 2}, {"title": "续期（别忘了）", "label": "续期（别忘了）", "level": 2, "n": 3}, {"title": "踩坑 / 注意", "label": "踩坑 / 注意", "level": 2, "n": 4}], "html": "<blockquote><p>状态：2026-11-10 已建成并实测通。<br />\n定位：波兰免费共享虚拟主机（FreeBSD、无 root、有 SSH）。机房 IP，只能当网站空间 / 节点，绝不能登 Claude 等敏感账号。<\/p><\/blockquote>\n<h2 id=\"sec-1\">账号与期限<\/h2>\n<ul><li>账号：[账号已隐藏]（注册邮箱 [邮箱已隐藏]）。<\/li><li>面板：https://panel.ct8.pl/<\/li><li>SSH / SFTP：s1.ct8.pl<\/li><li>套餐：FREE，有效期至 2027-02-08，网站域名 [子域名已隐藏]。<\/li><\/ul>\n<h2 id=\"sec-2\">部署形态（已实测通）<\/h2>\n<ul><li>协议：VLESS + WS + TLS，对外端口 443。<\/li><li>证书：Let&#x27;s Encrypt，有效期至 2027-02-08（与主机有效期对齐）。<\/li><li>保活：面板定时任务每 5 分钟跑一次 bootstrap.sh，进程掉了会自动拉起。<\/li><\/ul>\n<h2 id=\"sec-3\">续期（别忘了）<\/h2>\n<ul><li>免费主机到期失效。已定续期动作：2027-02-03 上午约 10 点登录面板点 Renew（有定时任务提醒）。<\/li><li>续期后检查两件事：网站能打开、节点能连通；证书若没自动续，一并处理。<\/li><\/ul>\n<h2 id=\"sec-4\">踩坑 / 注意<\/h2>\n<ul><li><strong>无 root<\/strong>：所有部署都要在普通用户权限内完成，选型时优先单文件、免安装的程序（Xray 就是这么选的）。<\/li><li><strong>保活靠面板定时任务<\/strong>：共享主机不让常驻进程，只能用每 5 分钟的 bootstrap.sh 拉活，这是这类免费主机的通用解法。<\/li><li><strong>机房 IP 的用途边界<\/strong>：只能建站和做节点。拿它登地区敏感账号等于自曝，不要图省事。<\/li><\/ul>", "body": "\n# CT8.PL 免费主机部署 Xray 节点（定版）\n\n> 状态：2026-11-10 已建成并实测通。\n> 定位：波兰免费共享虚拟主机（FreeBSD、无 root、有 SSH）。机房 IP，只能当网站空间 / 节点，绝不能登 Claude 等敏感账号。\n\n## 账号与期限\n\n- 账号：[账号已隐藏]（注册邮箱 [邮箱已隐藏]）。\n- 面板：https://panel.ct8.pl/\n- SSH / SFTP：s1.ct8.pl\n- 套餐：FREE，有效期至 2027-02-08，网站域名 [子域名已隐藏]。\n\n## 部署形态（已实测通）\n\n- 协议：VLESS + WS + TLS，对外端口 443。\n- 证书：Let's Encrypt，有效期至 2027-02-08（与主机有效期对齐）。\n- 保活：面板定时任务每 5 分钟跑一次 bootstrap.sh，进程掉了会自动拉起。\n\n## 续期（别忘了）\n\n- 免费主机到期失效。已定续期动作：2027-02-03 上午约 10 点登录面板点 Renew（有定时任务提醒）。\n- 续期后检查两件事：网站能打开、节点能连通；证书若没自动续，一并处理。\n\n## 踩坑 / 注意\n\n- **无 root**：所有部署都要在普通用户权限内完成，选型时优先单文件、免安装的程序（Xray 就是这么选的）。\n- **保活靠面板定时任务**：共享主机不让常驻进程，只能用每 5 分钟的 bootstrap.sh 拉活，这是这类免费主机的通用解法。\n- **机房 IP 的用途边界**：只能建站和做节点。拿它登地区敏感账号等于自曝，不要图省事。\n", "file": "11-ct8-xray.md", "cover_key": "ct8-xray"}, {"id": 10, "title": "Cloady 免费档部署 Xray 链式节点（定版）", "category": "节点与代理", "tags": ["Cloady", "Xray", "免费节点", "Cliproxy", "fail-closed"], "summary": "免费档部署 VLESS+WS 节点、出站只走 Cliproxy 的完整复现步骤与验收法；踩坑重点：免费额度被首个应用占满、改配置勿清空密码栏、超时不在服务器端。", "pinned": false, "updated": "2026-11-26", "source": "整理自 2026-11-24 部署上线的实测记录；不是对话原文。UUID 等凭据只存配置文件，不写入本条。", "toc": [{"title": "成果形态（现在跑着的版本）", "label": "成果形态（现在跑着的版本）", "level": 2, "n": 1}, {"title": "部署流程（照着走能复现）", "label": "部署流程（照着走能复现）", "level": 2, "n": 2}, {"title": "踩坑记录（这篇的重点）", "label": "踩坑记录（这篇的重点）", "level": 2, "n": 3}], "html": "<blockquote><p>状态：2026-11-24 部署完成，LIVE。<br />\n定位：免费小流量节点，出站经 Cliproxy 住宅代理。免费档月出站流量 10 GB（官方口径），别当大流量主力。<\/p><\/blockquote>\n<h2 id=\"sec-1\">成果形态（现在跑着的版本）<\/h2>\n<ul><li>平台：cloady.com，登录靠邮箱验证码；Workspace 为 [工作区 ID 已隐藏]，FREE 档，区域 usw1（美西）。<\/li><li>当前应用名：<code>dockerfile<\/code>，域名 [节点域名已隐藏]。<\/li><li>Xray 版本 26.11.9，监听 :3000。未绑卡、未付款。<\/li><li>出站结构：本地 → Cloady → Cliproxy SOCKS5 → 目标。直连出站已去掉，代理挂了就断（fail-closed），不会裸奔。<\/li><li>UUID 与 WS 路径沿用旧配置不变。<\/li><\/ul>\n<h2 id=\"sec-2\">部署流程（照着走能复现）<\/h2>\n<ol><li>在 Cloady 建应用，规格选免费档，区域 usw1。<\/li><li>上传带 Dockerfile 的 Xray 配置：监听 :3000，入站 VLESS + WS。<\/li><li>配置出站只保留一条：Cliproxy SOCKS5（粘性会话 [会话 ID 已隐藏]，t-120）。删掉直连出站，保证 fail-closed。<\/li><li>部署前逐项核对配置：<strong>特别是密码栏不能为空<\/strong>（见踩坑）。<\/li><li>部署完成后验收两件事：<br />\n   - 用第二个 Xray 实例经该出站取 example.com，应成功返回。<br />\n   - WS 握手应返回 101。<\/li><\/ol>\n<h2 id=\"sec-3\">踩坑记录（这篇的重点）<\/h2>\n<ul><li><strong>旧应用删了，域名就失效<\/strong>：旧应用 <code>xray<\/code>（域名 [节点域名已隐藏]）已于 2026-11-24 按决定删除，旧链接不要再用。<\/li><li><strong>上传类应用没有&quot;替换源码&quot;入口<\/strong>：想换代码只能新建应用；&quot;Deploy now&quot; 只是用旧文件重建，点了没变化不要奇怪。<\/li><li><strong>免费额度被第一个应用占满<\/strong>：第二个应用即使选最小规格也要 $4.25/月且必须绑卡。先删旧应用再建新的，才走得通免费路线。<\/li><li><strong>改配置把密码栏写空 → 部署报错<\/strong>：换 sid 改配置时曾把密码栏清空导致报错，重建才通。教训：改完配置先核对密码栏非空，再点部署。<\/li><li><strong>&quot;总是超时&quot;不在服务器端<\/strong>：用户报超时后做过服务器端诊断——无异常，手机的真实流量一直在走 Cliproxy 出站。结论：超时既不在 Cloady 也不在 Cliproxy 会话，要在手机端按具体目标复现，不要在服务器上瞎改。<\/li><li><strong>测速地址的 403 不代表代理坏了<\/strong>：直连测试里 SOCKS5 / HTTP 测速地址经此出口分别回 HTTP / 403，那是测速地址自身的表现，不等于代理不可用。验收要用真实目标（如 example.com）和 WS 握手，不要只看测速站。<\/li><\/ul>", "body": "\n# Cloady 免费档部署 Xray 链式节点（定版）\n\n> 状态：2026-11-24 部署完成，LIVE。\n> 定位：免费小流量节点，出站经 Cliproxy 住宅代理。免费档月出站流量 10 GB（官方口径），别当大流量主力。\n\n## 成果形态（现在跑着的版本）\n\n- 平台：cloady.com，登录靠邮箱验证码；Workspace 为 [工作区 ID 已隐藏]，FREE 档，区域 usw1（美西）。\n- 当前应用名：`dockerfile`，域名 [节点域名已隐藏]。\n- Xray 版本 26.11.9，监听 :3000。未绑卡、未付款。\n- 出站结构：本地 → Cloady → Cliproxy SOCKS5 → 目标。直连出站已去掉，代理挂了就断（fail-closed），不会裸奔。\n- UUID 与 WS 路径沿用旧配置不变。\n\n## 部署流程（照着走能复现）\n\n1. 在 Cloady 建应用，规格选免费档，区域 usw1。\n2. 上传带 Dockerfile 的 Xray 配置：监听 :3000，入站 VLESS + WS。\n3. 配置出站只保留一条：Cliproxy SOCKS5（粘性会话 [会话 ID 已隐藏]，t-120）。删掉直连出站，保证 fail-closed。\n4. 部署前逐项核对配置：**特别是密码栏不能为空**（见踩坑）。\n5. 部署完成后验收两件事：\n   - 用第二个 Xray 实例经该出站取 example.com，应成功返回。\n   - WS 握手应返回 101。\n\n## 踩坑记录（这篇的重点）\n\n- **旧应用删了，域名就失效**：旧应用 `xray`（域名 [节点域名已隐藏]）已于 2026-11-24 按决定删除，旧链接不要再用。\n- **上传类应用没有\"替换源码\"入口**：想换代码只能新建应用；\"Deploy now\" 只是用旧文件重建，点了没变化不要奇怪。\n- **免费额度被第一个应用占满**：第二个应用即使选最小规格也要 $4.25/月且必须绑卡。先删旧应用再建新的，才走得通免费路线。\n- **改配置把密码栏写空 → 部署报错**：换 sid 改配置时曾把密码栏清空导致报错，重建才通。教训：改完配置先核对密码栏非空，再点部署。\n- **\"总是超时\"不在服务器端**：用户报超时后做过服务器端诊断——无异常，手机的真实流量一直在走 Cliproxy 出站。结论：超时既不在 Cloady 也不在 Cliproxy 会话，要在手机端按具体目标复现，不要在服务器上瞎改。\n- **测速地址的 403 不代表代理坏了**：直连测试里 SOCKS5 / HTTP 测速地址经此出口分别回 HTTP / 403，那是测速地址自身的表现，不等于代理不可用。验收要用真实目标（如 example.com）和 WS 握手，不要只看测速站。\n", "file": "10-cloady-xray.md", "cover_key": "cloady-xray"}, {"id": 9, "title": "住宅出口与链式代理选型定版", "category": "节点与代理", "tags": ["链式代理", "住宅IP", "RackNerd", "Verizon", "Cliproxy"], "summary": "主力链定版：RackNerd 前置 + Proxy-Seller Verizon 静态住宅末跳；1024proxy 只作试用，Cliproxy 洛杉矶粘性线测试中；附买前核实清单与选型排序。", "pinned": false, "updated": "2026-11-26", "source": "整理自 2026-10-15/18 链式出口定版与 2026-11-23 Cliproxy 测试记录；不是对话原文。", "toc": [{"title": "定版结论：主力链式出口", "label": "定版结论：主力链式出口", "level": 2, "n": 1}, {"title": "备用与试用线", "label": "备用与试用线", "level": 2, "n": 2}, {"title": "选型规则（踩出来的）", "label": "选型规则（踩出来的）", "level": 2, "n": 3}, {"title": "踩坑记录", "label": "踩坑记录", "level": 2, "n": 4}], "html": "<blockquote><p>定版：2026-10-15/18 链式出口已定；Cliproxy 洛杉矶线 2026-11-23 测试中。<br />\n用途：给地区敏感账号准备干净出口，以及给节点做前置链。先看结论，再看细节。<\/p><\/blockquote>\n<h2 id=\"sec-1\">定版结论：主力链式出口<\/h2>\n<ul><li>结构：RackNerd VPS 作 vless 入口中转（前置链）→ Proxy-Seller Verizon Business 静态 IP 作末跳出口。<\/li><li>末跳属性：住宅属性、human 81.77% / IPPure 1%、原生 IP；GeoIP 大区美东，设备时区按 America/New_York 钉死。<\/li><li>待办：跑业务实测 + 完成 RackNerd 前置链式配置，之后才把敏感账号迁过来。<\/li><\/ul>\n<h2 id=\"sec-2\">备用与试用线<\/h2>\n<ul><li><strong>1024proxy<\/strong>：只留 $0.99 动态住宅试用，给谷歌重试当非美出口用，不作主力。<\/li><li><strong>Cliproxy 洛杉矶<\/strong>（测试中）：us.cliproxy.io:3010，SOCKS5，粘性会话约 120 分钟。自测出口 [出口 IP 已隐藏]，Charter/Spectrum AS20001 住宅 IP，时区 America/Los_Angeles。注意：非固定 IP，约 120 分钟后可能换 IP，用前必须重测；尚未决定是否用它替换 Verizon 作主力末跳。<\/li><\/ul>\n<h2 id=\"sec-3\">选型规则（踩出来的）<\/h2>\n<ul><li><strong>机场大多做不了链式前置<\/strong>：买前必须核实是否支持中转 / UDP / ToS；TikTok 等场景必须 UDP 通，不通直接排除。<\/li><li><strong>Proxy-Seller 不支持选地区<\/strong>：ISP 静态线只有美 / 英 / 德 / 法 / 日 5 国；要城市级定位只能找客服。<\/li><li><strong>住宅静态 &gt; 动态住宅 &gt; 机房 IP<\/strong>：敏感账号只认第一档；动态住宅只配做重试和非敏感业务；机房 IP 只能当节点中转，绝不直接登敏感账号（与《Claude 账号防封与付款完整流程》的定级一致）。<\/li><\/ul>\n<h2 id=\"sec-4\">踩坑记录<\/h2>\n<ul><li><strong>链式能不能搭，先问再买<\/strong>：前置链需要中转支持，很多机场套餐买完才发现不支持——核实顺序要在付款之前。<\/li><li><strong>粘性会话不是固定 IP<\/strong>：Cliproxy 的&quot;粘性&quot;只有约 120 分钟，拿它当固定出口用会在换 IP 时翻车；每次用前重测出口 IP 和归属。<\/li><\/ul>", "body": "\n# 住宅出口与链式代理选型定版\n\n> 定版：2026-10-15/18 链式出口已定；Cliproxy 洛杉矶线 2026-11-23 测试中。\n> 用途：给地区敏感账号准备干净出口，以及给节点做前置链。先看结论，再看细节。\n\n## 定版结论：主力链式出口\n\n- 结构：RackNerd VPS 作 vless 入口中转（前置链）→ Proxy-Seller Verizon Business 静态 IP 作末跳出口。\n- 末跳属性：住宅属性、human 81.77% / IPPure 1%、原生 IP；GeoIP 大区美东，设备时区按 America/New_York 钉死。\n- 待办：跑业务实测 + 完成 RackNerd 前置链式配置，之后才把敏感账号迁过来。\n\n## 备用与试用线\n\n- **1024proxy**：只留 $0.99 动态住宅试用，给谷歌重试当非美出口用，不作主力。\n- **Cliproxy 洛杉矶**（测试中）：us.cliproxy.io:3010，SOCKS5，粘性会话约 120 分钟。自测出口 [出口 IP 已隐藏]，Charter/Spectrum AS20001 住宅 IP，时区 America/Los_Angeles。注意：非固定 IP，约 120 分钟后可能换 IP，用前必须重测；尚未决定是否用它替换 Verizon 作主力末跳。\n\n## 选型规则（踩出来的）\n\n- **机场大多做不了链式前置**：买前必须核实是否支持中转 / UDP / ToS；TikTok 等场景必须 UDP 通，不通直接排除。\n- **Proxy-Seller 不支持选地区**：ISP 静态线只有美 / 英 / 德 / 法 / 日 5 国；要城市级定位只能找客服。\n- **住宅静态 > 动态住宅 > 机房 IP**：敏感账号只认第一档；动态住宅只配做重试和非敏感业务；机房 IP 只能当节点中转，绝不直接登敏感账号（与《Claude 账号防封与付款完整流程》的定级一致）。\n\n## 踩坑记录\n\n- **链式能不能搭，先问再买**：前置链需要中转支持，很多机场套餐买完才发现不支持——核实顺序要在付款之前。\n- **粘性会话不是固定 IP**：Cliproxy 的\"粘性\"只有约 120 分钟，拿它当固定出口用会在换 IP 时翻车；每次用前重测出口 IP 和归属。\n", "file": "09-residential-proxy.md", "cover_key": "residential-proxy"}, {"id": 8, "title": "Claude 账号防封与付款完整流程（定版）", "category": "账号与服务", "tags": ["Claude", "防封", "付款", "KYC", "住宅IP"], "summary": "从出口、账号、时区到付款与 KYC 的整套定级流程：保留旧号、住宅链式出口、iOS 礼品卡优先、月付 Pro 起步、KYC 弹窗先截图不交材料。", "pinned": true, "updated": "2026-11-26", "source": "整理自 2026-10-20 定级结论与 2026-10-23 时区 / KYC 细则，改写为可执行流程；不是对话原文。", "toc": [{"title": "背景结论（先认清，再动手）", "label": "背景结论（先认清，再动手）", "level": 2, "n": 1}, {"title": "步骤一：账号——保留旧号，不开新号", "label": "步骤一：账号——保留旧号，不开新号", "level": 2, "n": 2}, {"title": "步骤二：环境——本地 Win11 + 链式出口", "label": "步骤二：环境——本地 Win11 + 链式出口", "level": 2, "n": 3}, {"title": "步骤三：付款——顺序和铁律", "label": "步骤三：付款——顺序和铁律", "level": 2, "n": 4}, {"title": "步骤四：KYC 弹窗出现时怎么办", "label": "步骤四：KYC 弹窗出现时怎么办", "level": 2, "n": 5}, {"title": "踩坑记录", "label": "踩坑记录", "level": 2, "n": 6}], "html": "<blockquote><p>定版：2026-10-20 定级，2026-10-23 补时区与 KYC 执行细则。<br />\n一句话原则：先在最终出口上把环境养稳，再付费；全程低频、一致、不折腾。<\/p><\/blockquote>\n<h2 id=\"sec-1\">背景结论（先认清，再动手）<\/h2>\n<ul><li>大陆 / 香港 / 澳门都是 Claude 不支持的地区，使用本身就带封号风险，违规终止不退款；其他原因退款按比例。<\/li><li>最好的资产是干净的住宅出口：Verizon Business 静态住宅 IP，经 RackNerd 前置链式转发。机场共享节点和机房 IP 直连风险最高；VPS 直装已出局——唯一可接受的变体是 VPS 出站全部走 Verizon socks5 并带 kill-switch。<\/li><li>付费 Pro 极可能触发 Stripe + Anthropic 全量复审，大陆卡是最大的风险因子。<\/li><\/ul>\n<h2 id=\"sec-2\">步骤一：账号——保留旧号，不开新号<\/h2>\n<ul><li>此前已用一条美区 ISP IP 注册过一个账号（非 Verizon 静态 IP，那条线路与账号详情未知）。默认保留旧账号，不另开新号：多开账号本身就是封号触发器，存活的老注册是资产。<\/li><li>那条 ISP 线路若仍干净，就别迁移；若已脏，单向迁移到 Verizon 出口，轻度养号几天再付费。绝不在两个 IP 之间来回跳。<\/li><li>只有四种情况才弃号重开：老账号已被封 / 被标、注册在脏 IP 上、账号不完全在自己控制下、登录历史已污染。<\/li><\/ul>\n<h2 id=\"sec-3\">步骤二：环境——本地 Win11 + 链式出口<\/h2>\n<ul><li>本地 Win11，桌面端 / CLI 为主力，配 v2rayN TUN 模式。主力工具定为 Claude Code + Design。<\/li><li>时区跟随最终出口一次钉死，永不反复。兼职路线②的钉法：<\/li><li>系统时区留北京，Claude 进程单独用 <code>TZ=America/New_York<\/code> 从脚本启动；桌面版关掉自启，只从脚本启动。<\/li><li>Claude 专用 Chrome Profile 把 en-US 置顶。注意：Chrome 在 Windows 上不吃 TZ 变量，网页版时区仍报北京，所以网页版只作登录 / OAuth 与少量使用，主力放 CLI + 桌面版。<\/li><li>验收标准：脚本启动的 CLI 显示美东时间（EST）。<\/li><li>配套：Windows 区域设 United States、浏览器语言 en-US 优先、自动校时打开、关掉自动设置时区与定位，不用 JS 时区伪装。<\/li><\/ul>\n<h2 id=\"sec-4\">步骤三：付款——顺序和铁律<\/h2>\n<p>付款方式优先级（从优到次）：<\/p>\n<ol><li><strong>iOS + 礼品卡<\/strong>：已有美区 Apple ID；只在官方店购买、留好小票、分批兑换。灰卡有风险，不碰。<\/li><li><strong>Starryblu<\/strong>：SG BIN 万事达借记卡，大陆护照 + 手机号可开；作备用卡，只走官方渠道。<\/li><li><strong>Bybit<\/strong>：已有账户可用；不要为了这件事新开 Bybit 卡。<\/li><li>大陆卡（风险因子最大，尽量不用）。<\/li><li>US PayPal（网页端只收卡，排最后）。<\/li><\/ol>\n<p>价格参考（iOS 价）：Pro 年付 $214.99；Max 5x $124.99/月、20x $249.99/月（网页价 $100 / $200）。<\/p>\n<p>铁律：<\/p>\n<ul><li>先月付 Pro $20 验证稳定性和用量，频繁撞限额再升 Max 5x；未验证稳定前不上 $100–200 的档。<\/li><li>拒卡不要反复重试。<\/li><li>出问题先申诉，绝不 chargeback。<\/li><li>退款只走 Apple，且须单独取消订阅；退款退回美区 USD 余额，约 48 小时，退不回人民币。不要重复薅退款。<\/li><\/ul>\n<h2 id=\"sec-5\">步骤四：KYC 弹窗出现时怎么办<\/h2>\n<p>背景：Anthropic 自 2026-04 起经 Persona 做选择性验证，要实体证件原件 + 活体自拍，不接受复印件 / 扫描 / 数字 ID。典型触发点：升 Max、高频使用、被风控标记；VPN / 位置与声明地址不符是典型情形。Persona 接受中国护照（查人证一致，不查居住地），但验证通过后仍可因在不支持地区使用被封；且提交真实身份是单向门——被封后换邮箱重开的空间大减。<\/p>\n<p>执行细则：<\/p>\n<ol><li>维持 Pro、不跳 Max，低频起步，尽量不触发。<\/li><li>真弹出来时先截图，别当场交材料，回来商量后再决定。<\/li><li>注册名必须与证件拼音一致（这一步在注册时就要对齐）。<\/li><li>验证时用链式出口的浏览器、关定位；手机扫码要在同一出口的 WiFi 下、关蜂窝、拒绝定位授权。<\/li><li>始终保持一致：IP、时区、语言、账单国家、声明地址，五样对得上。<\/li><\/ol>\n<h2 id=\"sec-6\">踩坑记录<\/h2>\n<ul><li><strong>多开账号 = 自找封号<\/strong>：新号没有历史积累，还多一个触发器；老号活着就是资产。<\/li><li><strong>付款方式比金额更重要<\/strong>：大陆卡是全量复审里最大的风险因子，宁可用礼品卡绕开。<\/li><li><strong>时区反复横跳是大忌<\/strong>：钉死一次就不要再改；网页版时区报北京是 Chrome 的固有限制，不是配置错误，别为它反复折腾。<\/li><li><strong>KYC 是单向门<\/strong>：交了真实身份就回不去了，所以策略是&quot;不触发&quot;而不是&quot;准备好材料随时交&quot;。<\/li><\/ul>", "body": "\n# Claude 账号防封与付款完整流程（定版）\n\n> 定版：2026-10-20 定级，2026-10-23 补时区与 KYC 执行细则。\n> 一句话原则：先在最终出口上把环境养稳，再付费；全程低频、一致、不折腾。\n\n## 背景结论（先认清，再动手）\n\n- 大陆 / 香港 / 澳门都是 Claude 不支持的地区，使用本身就带封号风险，违规终止不退款；其他原因退款按比例。\n- 最好的资产是干净的住宅出口：Verizon Business 静态住宅 IP，经 RackNerd 前置链式转发。机场共享节点和机房 IP 直连风险最高；VPS 直装已出局——唯一可接受的变体是 VPS 出站全部走 Verizon socks5 并带 kill-switch。\n- 付费 Pro 极可能触发 Stripe + Anthropic 全量复审，大陆卡是最大的风险因子。\n\n## 步骤一：账号——保留旧号，不开新号\n\n- 此前已用一条美区 ISP IP 注册过一个账号（非 Verizon 静态 IP，那条线路与账号详情未知）。默认保留旧账号，不另开新号：多开账号本身就是封号触发器，存活的老注册是资产。\n- 那条 ISP 线路若仍干净，就别迁移；若已脏，单向迁移到 Verizon 出口，轻度养号几天再付费。绝不在两个 IP 之间来回跳。\n- 只有四种情况才弃号重开：老账号已被封 / 被标、注册在脏 IP 上、账号不完全在自己控制下、登录历史已污染。\n\n## 步骤二：环境——本地 Win11 + 链式出口\n\n- 本地 Win11，桌面端 / CLI 为主力，配 v2rayN TUN 模式。主力工具定为 Claude Code + Design。\n- 时区跟随最终出口一次钉死，永不反复。兼职路线②的钉法：\n  - 系统时区留北京，Claude 进程单独用 `TZ=America/New_York` 从脚本启动；桌面版关掉自启，只从脚本启动。\n  - Claude 专用 Chrome Profile 把 en-US 置顶。注意：Chrome 在 Windows 上不吃 TZ 变量，网页版时区仍报北京，所以网页版只作登录 / OAuth 与少量使用，主力放 CLI + 桌面版。\n  - 验收标准：脚本启动的 CLI 显示美东时间（EST）。\n  - 配套：Windows 区域设 United States、浏览器语言 en-US 优先、自动校时打开、关掉自动设置时区与定位，不用 JS 时区伪装。\n\n## 步骤三：付款——顺序和铁律\n\n付款方式优先级（从优到次）：\n\n1. **iOS + 礼品卡**：已有美区 Apple ID；只在官方店购买、留好小票、分批兑换。灰卡有风险，不碰。\n2. **Starryblu**：SG BIN 万事达借记卡，大陆护照 + 手机号可开；作备用卡，只走官方渠道。\n3. **Bybit**：已有账户可用；不要为了这件事新开 Bybit 卡。\n4. 大陆卡（风险因子最大，尽量不用）。\n5. US PayPal（网页端只收卡，排最后）。\n\n价格参考（iOS 价）：Pro 年付 $214.99；Max 5x $124.99/月、20x $249.99/月（网页价 $100 / $200）。\n\n铁律：\n\n- 先月付 Pro $20 验证稳定性和用量，频繁撞限额再升 Max 5x；未验证稳定前不上 $100–200 的档。\n- 拒卡不要反复重试。\n- 出问题先申诉，绝不 chargeback。\n- 退款只走 Apple，且须单独取消订阅；退款退回美区 USD 余额，约 48 小时，退不回人民币。不要重复薅退款。\n\n## 步骤四：KYC 弹窗出现时怎么办\n\n背景：Anthropic 自 2026-04 起经 Persona 做选择性验证，要实体证件原件 + 活体自拍，不接受复印件 / 扫描 / 数字 ID。典型触发点：升 Max、高频使用、被风控标记；VPN / 位置与声明地址不符是典型情形。Persona 接受中国护照（查人证一致，不查居住地），但验证通过后仍可因在不支持地区使用被封；且提交真实身份是单向门——被封后换邮箱重开的空间大减。\n\n执行细则：\n\n1. 维持 Pro、不跳 Max，低频起步，尽量不触发。\n2. 真弹出来时先截图，别当场交材料，回来商量后再决定。\n3. 注册名必须与证件拼音一致（这一步在注册时就要对齐）。\n4. 验证时用链式出口的浏览器、关定位；手机扫码要在同一出口的 WiFi 下、关蜂窝、拒绝定位授权。\n5. 始终保持一致：IP、时区、语言、账单国家、声明地址，五样对得上。\n\n## 踩坑记录\n\n- **多开账号 = 自找封号**：新号没有历史积累，还多一个触发器；老号活着就是资产。\n- **付款方式比金额更重要**：大陆卡是全量复审里最大的风险因子，宁可用礼品卡绕开。\n- **时区反复横跳是大忌**：钉死一次就不要再改；网页版时区报北京是 Chrome 的固有限制，不是配置错误，别为它反复折腾。\n- **KYC 是单向门**：交了真实身份就回不去了，所以策略是\"不触发\"而不是\"准备好材料随时交\"。\n", "file": "08-claude-account.md", "cover_key": "claude-account"}, {"id": 7, "title": "AX3600 代理链泄漏排查与 fail-closed 加固（定版）", "category": "网络与路由", "tags": ["AX3600", "OpenClash", "泄漏排查", "fail-closed", "DNS", "WebRTC"], "summary": "旁路由跑起来之后的安全定版：DNS 定版、STUN 端口 REJECT 堵 WebRTC 泄漏、删 lan→wan 转发实现核心崩溃时全网断流，含检测口径不一致的待确认项。", "pinned": true, "updated": "2026-11-26", "source": "整理自 2026-10-23 至 10-29 的实测记录（泄漏排查与防火墙加固），改写为定版流程；不是对话原文。", "toc": [{"title": "当前链路状态（排查的起点）", "label": "当前链路状态（排查的起点）", "level": 2, "n": 1}, {"title": "步骤一：DNS 定版（2026-10-29 定版，不要再改）", "label": "步骤一：DNS 定版（2026-10-29 定版，不要再改）", "level": 2, "n": 2}, {"title": "步骤二：堵 STUN / WebRTC 泄漏口（2026-10-27 定版）", "label": "步骤二：堵 STUN / WebRTC 泄漏口（2026-10-27 定版）", "level": 2, "n": 3}, {"title": "步骤三：fail-closed 结构加固（防\"故障\"，不防\"主动切直连\"）", "label": "步骤三：fail-closed 结构加固（防\"故障\"，不防\"主动切直连\"）", "level": 2, "n": 4}, {"title": "踩坑记录", "label": "踩坑记录", "level": 2, "n": 5}], "html": "<blockquote><p>定版状态：2026-10-29 DNS 定版、2026-10-23 fail-closed 结构已实施。<br />\n前置阅读：先完成《小米 AX3600 刷 OpenWrt 做旁路由完整教程》，本篇是在旁路由跑起来之后，把&quot;不泄漏&quot;和&quot;出故障时不出包&quot;这两件事做扎实。<br />\n红线：在 RackNerd 前置链建成、策略组切回住宅链、复测全绿之前，不在这条连接上登录 Claude。<\/p><\/blockquote>\n<h2 id=\"sec-1\">当前链路状态（排查的起点）<\/h2>\n<ul><li>AX3600 的 WAN 是 192.168.31.110/24，分流方式为 TCP Redirect + UDP TProxy。<\/li><li>DNS 走 Fake-IP，假地址段 198.18.0.0/16。<\/li><li>当前出口是机场机房节点，不是 Verizon 住宅链——所以这条链目前只适合一般用途，不能碰地区敏感账号。<\/li><\/ul>\n<h2 id=\"sec-2\">步骤一：DNS 定版（2026-10-29 定版，不要再改）<\/h2>\n<ol><li>只保留国外 DoH 作为解析上游，不混用国内解析。<\/li><li>Fake-IP 保持开启。<\/li><li>dnsmasq 的上游唯一指向 <code>127.0.0.1#7874<\/code>（本机 Clash 的 DNS 监听），不要再加第二个上游。<\/li><\/ol>\n<p>验收：改完后用 browserleaks 重测。2026-10-29 实测结果干净（出口、DNS 均显示美国）。<\/p>\n<h2 id=\"sec-3\">步骤二：堵 STUN / WebRTC 泄漏口（2026-10-27 定版）<\/h2>\n<p>现象：Claude 的检测工具报告 DNS / WebRTC 可能泄漏，排查后定位到 STUN 流量绕过了代理。<\/p>\n<p>处理：在分流规则里把目标端口 3478 和 5349（STUN 常用端口）改为 <strong>REJECT<\/strong>。<\/p>\n<ul><li>改完之后未再复发。<\/li><li>代价（已知、接受）：这台 Chrome Profile 开不了网页版 Meet / Zoom 这类 P2P 通话。开会时走 BE7200 主网，或换一个浏览器。<\/li><\/ul>\n<h2 id=\"sec-4\">步骤三：fail-closed 结构加固（防&quot;故障&quot;，不防&quot;主动切直连&quot;）<\/h2>\n<p>为什么要做：大陆 IP 碰一次 Anthropic 就可能封号。而 OpenClash 核心停止或崩溃时，劫持规则会被清理、路由器 NAT 还在，桌面版在托盘后台的连接就会以真实 IP 自己撞上 Anthropic。节点或订阅挂掉只是连接失败，那是安全态；核心死了才是危险态。<\/p>\n<p>做法（在 AX3600 防火墙里）：<\/p>\n<ol><li>删掉 lan → wan 的区域转发。<\/li><li>删掉 lan → wan6 的区域转发。<\/li><li>结果是 Zones 表里 lan ⇒ REJECT：核心一死，192.168.2.x 网段一个包都出不了 WAN。<\/li><\/ol>\n<p>已知副作用（都可接受、且完全可逆）：<\/p>\n<ul><li>ICMP ping 不再可用。<\/li><li>如果 2.x 网段访问主网段设备受影响，加两条放行规则：去 192.168.31.0/24、去 192.168.1.0/24。<\/li><\/ul>\n<p>操作纪律：<\/p>\n<ul><li>这套加固防的是核心故障，防不了人主动把模式切成直连。所以维护网络之前，先彻底退出 Claude 三端（桌面版、CLI、网页版）。<\/li><li>待办：保存应用后做一次冒烟测试，再停掉核心做一次断网验收，确认 2.x 网段确实出不了包。<\/li><\/ul>\n<h2 id=\"sec-5\">踩坑记录<\/h2>\n<ul><li><strong>检测口径不一致<\/strong>：2026-10-29 同一天，browserleaks 重测已经干净，但 Claude 的检测工具仍报 DNS / WebRTC 可能泄漏。此条未最终确认——以后复测时以两个工具交叉验证为准，不要只信一边。<\/li><li><strong>STUN 端口 REJECT 是一把双刃剑<\/strong>：堵住了泄漏，也堵掉了网页版视频会议的 P2P 通话。先想清楚哪台设备要开会，再决定规则加在哪个 Profile / 网段上。<\/li><li><strong>真正的风险不是节点挂掉，是核心死掉<\/strong>：节点故障 = 连不上（安全）；核心崩溃 + NAT 还在 = 真实 IP 裸奔（危险）。加固要针对后者。<\/li><\/ul>", "body": "\n# AX3600 代理链泄漏排查与 fail-closed 加固（定版）\n\n> 定版状态：2026-10-29 DNS 定版、2026-10-23 fail-closed 结构已实施。\n> 前置阅读：先完成《小米 AX3600 刷 OpenWrt 做旁路由完整教程》，本篇是在旁路由跑起来之后，把\"不泄漏\"和\"出故障时不出包\"这两件事做扎实。\n> 红线：在 RackNerd 前置链建成、策略组切回住宅链、复测全绿之前，不在这条连接上登录 Claude。\n\n## 当前链路状态（排查的起点）\n\n- AX3600 的 WAN 是 192.168.31.110/24，分流方式为 TCP Redirect + UDP TProxy。\n- DNS 走 Fake-IP，假地址段 198.18.0.0/16。\n- 当前出口是机场机房节点，不是 Verizon 住宅链——所以这条链目前只适合一般用途，不能碰地区敏感账号。\n\n## 步骤一：DNS 定版（2026-10-29 定版，不要再改）\n\n1. 只保留国外 DoH 作为解析上游，不混用国内解析。\n2. Fake-IP 保持开启。\n3. dnsmasq 的上游唯一指向 `127.0.0.1#7874`（本机 Clash 的 DNS 监听），不要再加第二个上游。\n\n验收：改完后用 browserleaks 重测。2026-10-29 实测结果干净（出口、DNS 均显示美国）。\n\n## 步骤二：堵 STUN / WebRTC 泄漏口（2026-10-27 定版）\n\n现象：Claude 的检测工具报告 DNS / WebRTC 可能泄漏，排查后定位到 STUN 流量绕过了代理。\n\n处理：在分流规则里把目标端口 3478 和 5349（STUN 常用端口）改为 **REJECT**。\n\n- 改完之后未再复发。\n- 代价（已知、接受）：这台 Chrome Profile 开不了网页版 Meet / Zoom 这类 P2P 通话。开会时走 BE7200 主网，或换一个浏览器。\n\n## 步骤三：fail-closed 结构加固（防\"故障\"，不防\"主动切直连\"）\n\n为什么要做：大陆 IP 碰一次 Anthropic 就可能封号。而 OpenClash 核心停止或崩溃时，劫持规则会被清理、路由器 NAT 还在，桌面版在托盘后台的连接就会以真实 IP 自己撞上 Anthropic。节点或订阅挂掉只是连接失败，那是安全态；核心死了才是危险态。\n\n做法（在 AX3600 防火墙里）：\n\n1. 删掉 lan → wan 的区域转发。\n2. 删掉 lan → wan6 的区域转发。\n3. 结果是 Zones 表里 lan ⇒ REJECT：核心一死，192.168.2.x 网段一个包都出不了 WAN。\n\n已知副作用（都可接受、且完全可逆）：\n\n- ICMP ping 不再可用。\n- 如果 2.x 网段访问主网段设备受影响，加两条放行规则：去 192.168.31.0/24、去 192.168.1.0/24。\n\n操作纪律：\n\n- 这套加固防的是核心故障，防不了人主动把模式切成直连。所以维护网络之前，先彻底退出 Claude 三端（桌面版、CLI、网页版）。\n- 待办：保存应用后做一次冒烟测试，再停掉核心做一次断网验收，确认 2.x 网段确实出不了包。\n\n## 踩坑记录\n\n- **检测口径不一致**：2026-10-29 同一天，browserleaks 重测已经干净，但 Claude 的检测工具仍报 DNS / WebRTC 可能泄漏。此条未最终确认——以后复测时以两个工具交叉验证为准，不要只信一边。\n- **STUN 端口 REJECT 是一把双刃剑**：堵住了泄漏，也堵掉了网页版视频会议的 P2P 通话。先想清楚哪台设备要开会，再决定规则加在哪个 Profile / 网段上。\n- **真正的风险不是节点挂掉，是核心死掉**：节点故障 = 连不上（安全）；核心崩溃 + NAT 还在 = 真实 IP 裸奔（危险）。加固要针对后者。\n", "file": "07-ax3600-leak.md", "cover_key": "ax3600-leak"}, {"id": 6, "title": "暖暖豚融合版角色设定（路线 ② 可执行版）", "category": "创作与内容", "tags": ["暖暖豚", "角色设定", "水豚", "IP"], "summary": "水豚 IP「暖暖豚」的融合版设定定稿：保留可爱版大眼睛、粉腮红、奶茶色，鼻子改回长方形大鼻头、脸拉长；含已定死的身份项与待查商标类别。", "pinned": false, "updated": "2026-11-26", "source": "来源：your_files/暖暖豚融合版角色设定.md。状态注记：此为路线 ② 的可执行版，原稿标注待确认路线后执行。", "toc": [{"title": "定死的身份（两版都已确认，不动）", "label": "定死的身份（两版都已确认，不动）", "level": 2, "n": 1}, {"title": "融合表：每处取哪一版，写死", "label": "融合表：每处取哪一版，写死", "level": 2, "n": 2}, {"title": "不能碰的线（之前已定过）", "label": "不能碰的线（之前已定过）", "level": 2, "n": 3}, {"title": "8 张静态表情（融合版动作，含之前两处待改）", "label": "8 张静态表情（融合版动作，含之前两处待改）", "level": 2, "n": 4}, {"title": "发给 Codex 的提示词（融合版，直接复制）", "label": "发给 Codex 的提示词（融合版，直接复制）", "level": 2, "n": 5}, {"title": "验收（设定图出来后按这 3 条看）", "label": "验收（设定图出来后按这 3 条看）", "level": 2, "n": 6}, {"title": "备注", "label": "备注", "level": 2, "n": 7}], "html": "<p>状态：2026-11-06 17:25（北京时间）备好，未经他确认。这份只落实侧聊里他已选过的方向，不替他改定位、不新开路线。<br />\n他最后一次反馈（2026-11-06 16:49）：第一版 8 张“形象有点丑，不够呆萌”，主攻学生群和年轻女性群。<br />\n侧聊里给他留的二选一仍在等他回：① 可爱优先（水豚特征弱一点也接受）；② 两版融合（保留可爱版的大眼睛、粉腮红、奶茶色，把鼻子改回长方形大鼻头、脸再拉长一点点）。<br />\n这份就是路线 ② 的可执行版：他只要回“按融合版做”，不用再复述一遍改法，直接拿去画设定图或发给 Codex。<\/p>\n<h2 id=\"sec-1\">定死的身份（两版都已确认，不动）<\/h2>\n<ul><li>物种：水豚（卡皮巴拉），不要画成仓鼠、熊、猫<\/li><li>暂定名：暖暖豚（正式上架前先去中国商标网查 9、16、28、35、41 类）<\/li><li>定位一句话：暖暖的，但天塌下来也不急<\/li><li>性格：温暖、淡定、情绪稳定、慢吞吞；核心卖点不是单纯可爱，是“累了还能稳住”的治愈感<\/li><li>主客群：赶毕设、找工作的学生 + 年轻女性<\/li><li>先做静态 8 张测试，动态以后再说，这次不做动态 GIF<\/li><\/ul>\n<h2 id=\"sec-2\">融合表：每处取哪一版，写死<\/h2>\n<table><thead><tr><th>部位<\/th><th>融合决定<\/th><th>来源<\/th><\/tr><\/thead><tbody><tr><td>脸型<\/td><td>长方形打底、边角揉圆：比可爱版拉长约 1/5，比第一版短一点，不再是圆球脸<\/td><td>第一版脸太圆像仓鼠/熊；可爱版更圆，水豚特征丢了<\/td><\/tr><tr><td>鼻子<\/td><td>改回水豚长方形大鼻头，但边角倒圆、颜色用暖棕不做粉色小鼻子<\/td><td>可爱版粉色小鼻子是“像仓鼠”最主要的原因<\/td><\/tr><tr><td>嘴<\/td><td>小小的 <code>w<\/code> 形，微微上扬的小微笑（第一版嘴太小太淡，暖的感觉弱）<\/td><td>第一版自查点<\/td><\/tr><tr><td>眼睛<\/td><td>大圆亮晶晶、带睫毛和高光，但上眼睑压下来一点点：大眼睛 + 半分淡定，不做全睁的惊讶眼，也不做半闭的困眼<\/td><td>第一版半闭眼像没睡醒；可爱版大眼睛是对的<\/td><\/tr><tr><td>眉毛<\/td><td>抬
