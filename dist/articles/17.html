高、平一点，不斜着（斜眉毛看着凶）<\/td><td>可爱版已改对，保留<\/td><\/tr><tr><td>腮红<\/td><td>大大的粉色腮红，保留；不用 <code>//<\/code> 两道线<\/td><td>可爱版已改对，保留<\/td><\/tr><tr><td>颜色<\/td><td>奶茶色身体 + 奶油肚子，描边用中粗深棕（介于第一版粗描边和可爱版细描边之间）；全套固定 2–3 个主色，不每张换色<\/td><td>第一版深橙棕太深太硬；可爱版奶茶色是对的<\/td><\/tr><tr><td>头身比<\/td><td>大头小身，头占整体 55%–60%，脸在 240×240 里一眼看清；肚子比第一版小，不占身体一半<\/td><td>两版共识<\/td><\/tr><tr><td>叶子<\/td><td>只留一片带咬痕的叶子，微微歪一点；开心竖起、累了耷拉（跟着情绪动）。不做可爱版的两片发芽——50×50 下两片会糊成一团<\/td><td>咬痕是记忆点；小图清晰优先<\/td><\/tr><tr><td>姿态<\/td><td>双手捧在胸前、头微微歪一点的“求抱抱”感保留到中性站姿里<\/td><td>可爱版最讨女生喜欢的一点<\/td><\/tr><\/tbody><\/table>\n<p>建议色号（只是起稿值，定稿以设定图为准，之后全套锁定不再改）：奶茶棕 #C89B6D、奶油肚 #F7EEDD、深棕描边 #6B4A2F、粉腮红 #F5A8B8、叶绿 #7FB069。<\/p>\n<h2 id=\"sec-3\">不能碰的线（之前已定过）<\/h2>\n<ul><li>不模仿水豚噜噜（头顶橘子的黄色水豚）、轻松熊、Chiikawa、Loopy、LINE Friends；提示词里不写“像 XX 风格”“XX 同款”<\/li><li>不加黄色光线、不用 <code>//<\/code> 腮红、不用网上抠图和他人字体；表情文字只用下面 8 句<\/li><li>剪影测试：涂黑只看轮廓能认出是它（长脸 + 小耳 + 咬痕叶子 + 大鼻头）<\/li><\/ul>\n<h2 id=\"sec-4\">8 张静态表情（融合版动作，含之前两处待改）<\/h2>\n<p>透明底 PNG，240×240，单张 ≤500KB；同一个角色、同一个脸型、同一套配色，只改动作和表情。<\/p>\n<ol><li>收到：举爪敬礼——手举到耳边（第一版手贴额头像思考，已改），表情认真<\/li><li>OK：比个心、眨一只眼，不用点头，和第 1 张区分开<\/li><li>哈哈哈：仰头大笑，嘴张大、眼睛弯成弧线<\/li><li>委屈：抱膝坐着、泪汪汪，唯一一张负面情绪，要画出反差<\/li><li>抱抱：张开双臂，表情温暖<\/li><li>谢谢：双手捧一朵小花，只做这一个动作，不再加鞠躬（两动作挤在 240×240 里会糊）<\/li><li>加油：举起小旗跳跃——双脚离地跳起来（第一版站着举旗没跳起来，已改），懒洋洋的水豚突然跳起来要有反差感<\/li><li>晚安：盖着小被子躺平睡觉，突出水豚躺平的招牌动作<\/li><\/ol>\n<h2 id=\"sec-5\">发给 Codex 的提示词（融合版，直接复制）<\/h2>\n<pre><code class=\"language-text\">请按以下要求，重新设计我的原创水豚 IP 表情包“暖暖豚”，先做静态版，不要做动态。\n\n定位：暖暖的，但天塌下来也不急。温暖、淡定、情绪稳定，适合赶毕设、找工作的学生和年轻女性；核心是“累了还能稳住”的治愈感，不是单纯可爱。\n\n形象（融合版，缺一不可）：\n- 物种是水豚，不要画成仓鼠、熊、猫\n- 脸：长方形打底、边角揉圆，比圆脸拉长约五分之一；小耳朵\n- 鼻子：水豚长方形大鼻头，边角倒圆，暖棕色，不要粉色小鼻子\n- 嘴：小小的 w 形，微微上扬的小微笑\n- 眼睛：大圆亮晶晶，带睫毛和高光，上眼睑压下来一点点——大眼睛加半分淡定，不要全睁的惊讶眼，也不要半闭的困眼；眉毛抬高放平，不要斜着\n- 腮红：大大的粉色腮红，不要 // 两道线\n- 颜色：奶茶色身体、奶油肚子、中粗深棕描边，全套固定 2-3 个主色，不要每张换色\n- 比例：大头小身，头占整体 55%-60%\n- 记忆点：头顶一片带咬痕的小叶子，微微歪着；开心时竖起，累了就耷拉下来\n- 风格：粗描边加平涂色，干净简洁，去掉小图里看不清的细节，不要加黄色光线\n\n不要模仿水豚噜噜（头顶橘子的黄色水豚）、轻松熊、Chiikawa、Loopy、LINE Friends；不要用网上抠图、免费素材、他人字体；表情文字只用下面 8 句。\n\n8 张（透明底 PNG，240x240，单张 ≤500KB；同一角色、同一脸型、同一配色，只改动作和表情）：\n1. 收到：举爪敬礼，手举到耳边，表情认真\n2. OK：比个心、眨一只眼，不要点头\n3. 哈哈哈：仰头大笑，嘴张大、眼睛弯成弧线\n4. 委屈：抱膝坐着、泪汪汪\n5. 抱抱：张开双臂，表情温暖\n6. 谢谢：双手捧一朵小花，只做这一个动作，不要鞠躬\n7. 加油：举起小旗跳跃，双脚离地\n8. 晚安：盖着小被子躺平睡觉\n\n第一步：先出角色设定图（正面、侧面、背面 + 颜色色号），确认不撞款、剪影能认出来；第二步：再按上面 8 张出静态表情图；不要现在做动态。\n<\/code><\/pre>\n<h2 id=\"sec-6\">验收（设定图出来后按这 3 条看）<\/h2>\n<ol><li>一眼能认出是水豚，不是仓鼠或熊（鼻头 + 长脸是关键）<\/li><li>涂黑只看剪影也能认出是暖暖豚（咬痕叶子 + 长脸 + 大鼻头）<\/li><li>缩小到 50×50 聊天图标，脸和动作依然清楚；8 张情绪各不相同，没有两张动作重复<\/li><\/ol>\n<h2 id=\"sec-7\">备注<\/h2>\n<ul><li>本文件是文字设定，不是成图：本轮没出新图，设定图和 8 张仍需主 agent 或 Codex 按上面执行。<\/li><li>他如果改选路线 ①（可爱优先），这份作废：直接按可爱版出 8 张，不用再改鼻子和脸型。<\/li><li>和小红书店的关系：IP 以后可作店铺头像/封面/插图，但 19.9 元模板商品仍未上架、自动发货仍未自测——别把这份设定当成那篇笔记已可带转化发布。<br />\n``` <\/li><\/ul>\n<p>文件：[本地文件路径已隐藏]<\/p>", "body": "\n# 暖暖豚融合版角色设定（待他定路线 2 后直接执行）\n\n状态：2026-11-06 17:25（北京时间）备好，未经他确认。这份只落实侧聊里他已选过的方向，不替他改定位、不新开路线。\n他最后一次反馈（2026-11-06 16:49）：第一版 8 张“形象有点丑，不够呆萌”，主攻学生群和年轻女性群。\n侧聊里给他留的二选一仍在等他回：① 可爱优先（水豚特征弱一点也接受）；② 两版融合（保留可爱版的大眼睛、粉腮红、奶茶色，把鼻子改回长方形大鼻头、脸再拉长一点点）。\n这份就是路线 ② 的可执行版：他只要回“按融合版做”，不用再复述一遍改法，直接拿去画设定图或发给 Codex。\n\n## 定死的身份（两版都已确认，不动）\n\n- 物种：水豚（卡皮巴拉），不要画成仓鼠、熊、猫\n- 暂定名：暖暖豚（正式上架前先去中国商标网查 9、16、28、35、41 类）\n- 定位一句话：暖暖的，但天塌下来也不急\n- 性格：温暖、淡定、情绪稳定、慢吞吞；核心卖点不是单纯可爱，是“累了还能稳住”的治愈感\n- 主客群：赶毕设、找工作的学生 + 年轻女性\n- 先做静态 8 张测试，动态以后再说，这次不做动态 GIF\n\n## 融合表：每处取哪一版，写死\n\n| 部位 | 融合决定 | 来源 |\n| --- | --- | --- |\n| 脸型 | 长方形打底、边角揉圆：比可爱版拉长约 1/5，比第一版短一点，不再是圆球脸 | 第一版脸太圆像仓鼠/熊；可爱版更圆，水豚特征丢了 |\n| 鼻子 | 改回水豚长方形大鼻头，但边角倒圆、颜色用暖棕不做粉色小鼻子 | 可爱版粉色小鼻子是“像仓鼠”最主要的原因 |\n| 嘴 | 小小的 `w` 形，微微上扬的小微笑（第一版嘴太小太淡，暖的感觉弱） | 第一版自查点 |\n| 眼睛 | 大圆亮晶晶、带睫毛和高光，但上眼睑压下来一点点：大眼睛 + 半分淡定，不做全睁的惊讶眼，也不做半闭的困眼 | 第一版半闭眼像没睡醒；可爱版大眼睛是对的 |\n| 眉毛 | 抬高、平一点，不斜着（斜眉毛看着凶） | 可爱版已改对，保留 |\n| 腮红 | 大大的粉色腮红，保留；不用 `//` 两道线 | 可爱版已改对，保留 |\n| 颜色 | 奶茶色身体 + 奶油肚子，描边用中粗深棕（介于第一版粗描边和可爱版细描边之间）；全套固定 2–3 个主色，不每张换色 | 第一版深橙棕太深太硬；可爱版奶茶色是对的 |\n| 头身比 | 大头小身，头占整体 55%–60%，脸在 240×240 里一眼看清；肚子比第一版小，不占身体一半 | 两版共识 |\n| 叶子 | 只留一片带咬痕的叶子，微微歪一点；开心竖起、累了耷拉（跟着情绪动）。不做可爱版的两片发芽——50×50 下两片会糊成一团 | 咬痕是记忆点；小图清晰优先 |\n| 姿态 | 双手捧在胸前、头微微歪一点的“求抱抱”感保留到中性站姿里 | 可爱版最讨女生喜欢的一点 |\n\n建议色号（只是起稿值，定稿以设定图为准，之后全套锁定不再改）：奶茶棕 #C89B6D、奶油肚 #F7EEDD、深棕描边 #6B4A2F、粉腮红 #F5A8B8、叶绿 #7FB069。\n\n## 不能碰的线（之前已定过）\n\n- 不模仿水豚噜噜（头顶橘子的黄色水豚）、轻松熊、Chiikawa、Loopy、LINE Friends；提示词里不写“像 XX 风格”“XX 同款”\n- 不加黄色光线、不用 `//` 腮红、不用网上抠图和他人字体；表情文字只用下面 8 句\n- 剪影测试：涂黑只看轮廓能认出是它（长脸 + 小耳 + 咬痕叶子 + 大鼻头）\n\n## 8 张静态表情（融合版动作，含之前两处待改）\n\n透明底 PNG，240×240，单张 ≤500KB；同一个角色、同一个脸型、同一套配色，只改动作和表情。\n\n1. 收到：举爪敬礼——手举到耳边（第一版手贴额头像思考，已改），表情认真\n2. OK：比个心、眨一只眼，不用点头，和第 1 张区分开\n3. 哈哈哈：仰头大笑，嘴张大、眼睛弯成弧线\n4. 委屈：抱膝坐着、泪汪汪，唯一一张负面情绪，要画出反差\n5. 抱抱：张开双臂，表情温暖\n6. 谢谢：双手捧一朵小花，只做这一个动作，不再加鞠躬（两动作挤在 240×240 里会糊）\n7. 加油：举起小旗跳跃——双脚离地跳起来（第一版站着举旗没跳起来，已改），懒洋洋的水豚突然跳起来要有反差感\n8. 晚安：盖着小被子躺平睡觉，突出水豚躺平的招牌动作\n\n## 发给 Codex 的提示词（融合版，直接复制）\n\n```text\n请按以下要求，重新设计我的原创水豚 IP 表情包“暖暖豚”，先做静态版，不要做动态。\n\n定位：暖暖的，但天塌下来也不急。温暖、淡定、情绪稳定，适合赶毕设、找工作的学生和年轻女性；核心是“累了还能稳住”的治愈感，不是单纯可爱。\n\n形象（融合版，缺一不可）：\n- 物种是水豚，不要画成仓鼠、熊、猫\n- 脸：长方形打底、边角揉圆，比圆脸拉长约五分之一；小耳朵\n- 鼻子：水豚长方形大鼻头，边角倒圆，暖棕色，不要粉色小鼻子\n- 嘴：小小的 w 形，微微上扬的小微笑\n- 眼睛：大圆亮晶晶，带睫毛和高光，上眼睑压下来一点点——大眼睛加半分淡定，不要全睁的惊讶眼，也不要半闭的困眼；眉毛抬高放平，不要斜着\n- 腮红：大大的粉色腮红，不要 // 两道线\n- 颜色：奶茶色身体、奶油肚子、中粗深棕描边，全套固定 2-3 个主色，不要每张换色\n- 比例：大头小身，头占整体 55%-60%\n- 记忆点：头顶一片带咬痕的小叶子，微微歪着；开心时竖起，累了就耷拉下来\n- 风格：粗描边加平涂色，干净简洁，去掉小图里看不清的细节，不要加黄色光线\n\n不要模仿水豚噜噜（头顶橘子的黄色水豚）、轻松熊、Chiikawa、Loopy、LINE Friends；不要用网上抠图、免费素材、他人字体；表情文字只用下面 8 句。\n\n8 张（透明底 PNG，240x240，单张 ≤500KB；同一角色、同一脸型、同一配色，只改动作和表情）：\n1. 收到：举爪敬礼，手举到耳边，表情认真\n2. OK：比个心、眨一只眼，不要点头\n3. 哈哈哈：仰头大笑，嘴张大、眼睛弯成弧线\n4. 委屈：抱膝坐着、泪汪汪\n5. 抱抱：张开双臂，表情温暖\n6. 谢谢：双手捧一朵小花，只做这一个动作，不要鞠躬\n7. 加油：举起小旗跳跃，双脚离地\n8. 晚安：盖着小被子躺平睡觉\n\n第一步：先出角色设定图（正面、侧面、背面 + 颜色色号），确认不撞款、剪影能认出来；第二步：再按上面 8 张出静态表情图；不要现在做动态。\n```\n\n## 验收（设定图出来后按这 3 条看）\n\n1. 一眼能认出是水豚，不是仓鼠或熊（鼻头 + 长脸是关键）\n2. 涂黑只看剪影也能认出是暖暖豚（咬痕叶子 + 长脸 + 大鼻头）\n3. 缩小到 50×50 聊天图标，脸和动作依然清楚；8 张情绪各不相同，没有两张动作重复\n\n## 备注\n\n- 本文件是文字设定，不是成图：本轮没出新图，设定图和 8 张仍需主 agent 或 Codex 按上面执行。\n- 他如果改选路线 ①（可爱优先），这份作废：直接按可爱版出 8 张，不用再改鼻子和脸型。\n- 和小红书店的关系：IP 以后可作店铺头像/封面/插图，但 19.9 元模板商品仍未上架、自动发货仍未自测——别把这份设定当成那篇笔记已可带转化发布。\n``` \n\n文件：[本地文件路径已隐藏]\n", "file": "06-nuannuan-capybara.md", "cover_key": "nuannuan-capybara"}, {"id": 5, "title": "开题图文稿第 6 页：三行卡片做图版", "category": "创作与内容", "tags": ["小红书", "做图", "卡片版"], "summary": "第 6 页的做图替代方案：把原表格拆成 3 张卡片，避免手机上表格字糊；规格 3:4 竖版 1080×1440。", "pinned": false, "updated": "2026-11-26", "source": "来源：your_files/xiaohongshu-kaiti-page6-cards.md，配合《小红书图文稿：毕设开题三段怎么写》使用，只替换第 6 页。", "toc": [{"title": "第 6 页标题（卡片上方共用）", "label": "第 6 页标题（卡片上方共用）", "level": 2, "n": 1}, {"title": "卡片 1", "label": "卡片 1", "level": 2, "n": 2}, {"title": "卡片 2", "label": "卡片 2", "level": 2, "n": 3}, {"title": "卡片 3", "label": "卡片 3", "level": 2, "n": 4}, {"title": "自查句（放在 3 张卡片下方）", "label": "自查句（放在 3 张卡片下方）", "level": 2, "n": 5}, {"title": "做图提醒", "label": "做图提醒", "level": 2, "n": 6}], "html": "<p>图片规格：3:4 竖版 1080×1440，每张卡片只放一行。<\/p>\n<h2 id=\"sec-1\">第 6 页标题（卡片上方共用）<\/h2>\n<p>画出这张表，脱节一眼就能看出来<\/p>\n<hr />\n<h2 id=\"sec-2\">卡片 1<\/h2>\n<p>问题：报名统计易错、签到排队<br />\n目标：实现报名、签到、统计功能<br />\n方法：需求访谈 + 原型开发<\/p>\n<h2 id=\"sec-3\">卡片 2<\/h2>\n<p>问题：事后统计靠人工、数据不准<br />\n目标：统计结果自动生成、可导出<br />\n方法：原型开发 + 功能测试<\/p>\n<h2 id=\"sec-4\">卡片 3<\/h2>\n<p>问题：不知道好不好用<br />\n目标：完成一轮用户测试并修改<br />\n方法：用户测试 + 修改记录<\/p>\n<hr />\n<h2 id=\"sec-5\">自查句（放在 3 张卡片下方）<\/h2>\n<p>同一行讲不通，就改那一行，不要全篇重写。<\/p>\n<h2 id=\"sec-6\">做图提醒<\/h2>\n<ul><li>每张卡片一行对应关系，不要把三行挤进一张图。<\/li><li>卡片内三行顺序固定：问题 → 目标 → 方法。<\/li><li>示例仍是“校园社团报名与签到小程序”的结构示范，换课题重填，不要直接抄。<\/li><\/ul>", "body": "\n# 毕设开题第 6 页：做图版（三行卡片，替代原表格）\n\n图片规格：3:4 竖版 1080×1440，每张卡片只放一行。\n\n## 第 6 页标题（卡片上方共用）\n\n画出这张表，脱节一眼就能看出来\n\n---\n\n## 卡片 1\n\n问题：报名统计易错、签到排队\n目标：实现报名、签到、统计功能\n方法：需求访谈 + 原型开发\n\n## 卡片 2\n\n问题：事后统计靠人工、数据不准\n目标：统计结果自动生成、可导出\n方法：原型开发 + 功能测试\n\n## 卡片 3\n\n问题：不知道好不好用\n目标：完成一轮用户测试并修改\n方法：用户测试 + 修改记录\n\n---\n\n## 自查句（放在 3 张卡片下方）\n\n同一行讲不通，就改那一行，不要全篇重写。\n\n## 做图提醒\n\n- 每张卡片一行对应关系，不要把三行挤进一张图。\n- 卡片内三行顺序固定：问题 → 目标 → 方法。\n- 示例仍是“校园社团报名与签到小程序”的结构示范，换课题重填，不要直接抄。\n", "file": "05-kaiti-cards.md", "cover_key": "kaiti-cards"}, {"id": 4, "title": "小红书图文稿：毕设开题“问题、目标、方法”三段怎么写", "category": "创作与内容", "tags": ["小红书", "毕设开题", "图文稿", "模板"], "summary": "可直接发布的图文稿：标题、发布时间、挂车商品、图片规格与正文全稿，讲清开题报告问题、目标、方法三段如何对齐。", "pinned": false, "updated": "2026-11-26", "source": "来源：your_files/xiaohongshu-kaiti-manuscript.md；内容相同的《毕设开题报告图文稿.md》不重复收录。话题库为 xlsx 表格文件，未纳入文本知识库。", "toc": [{"title": "可直接发布的小红书图文稿", "label": "可直接发布的小红书图文稿", "level": 2, "n": 1}, {"title": "封面", "label": "封面", "level": 2, "n": 2}, {"title": "第 1 页：先对号入座", "label": "第 1 页：先对号入座", "level": 2, "n": 3}, {"title": "第 2 页：三段其实是一件事", "label": "第 2 页：三段其实是一件事", "level": 2, "n": 4}, {"title": "第 3 页：问题段怎么写", "label": "第 3 页：问题段怎么写", "level": 2, "n": 5}, {"title": "第 4 页：目标段怎么写", "label": "第 4 页：目标段怎么写", "level": 2, "n": 6}, {"title": "第 5 页：方法段怎么写", "label": "第 5 页：方法段怎么写", "level": 2, "n": 7}, {"title": "第 6 页：对应表（最值得收藏的一页）", "label": "第 6 页：对应表（最值得收藏的一页）", "level": 2, "n": 8}, {"title": "第 7 页：收尾 + 自查清单", "label": "第 7 页：收尾 + 自查清单", "level": 2, "n": 9}, {"title": "正文案（发布时直接粘贴）", "label": "正文案（发布时直接粘贴）", "level": 2, "n": 10}, {"title": "话题标签", "label": "话题标签", "level": 2, "n": 11}, {"title": "评论区置顶（发布后自己置顶一条）", "label": "评论区置顶（发布后自己置顶一条）", "level": 2, "n": 12}, {"title": "发布前检查清单", "label": "发布前检查清单", "level": 2, "n": 13}], "html": "<h2 id=\"sec-1\">可直接发布的小红书图文稿<\/h2>\n<ul><li>标题（主推）：毕设开题总被打回？问题、目标、方法这样写才对得上<\/li><li>备选标题：开题报告别先写背景，先把这三段对齐<\/li><li>发布时间建议：晚上 20:00–22:00<\/li><li>挂车商品：毕设开题三段填空模板（19.9 元，引流款）<\/li><li>图片规格建议：3:4 竖版，1080×1440，内页底色统一，重点词加粗或标色，示例部分用浅色框区分<\/li><li>转化口径：正文和评论区不发网盘链接，引导进主页店铺看商品目录<\/li><\/ul>\n<hr />\n<h2 id=\"sec-2\">封面<\/h2>\n<p>大字：<br />\n毕设开题总被打回？<br />\n问题、目标、方法这样写才对得上<\/p>\n<p>小字：<br />\n附三段填空模板 + 对应表<\/p>\n<hr />\n<h2 id=\"sec-3\">第 1 页：先对号入座<\/h2>\n<p>标题：老师打回的，往往是这三句话<\/p>\n<p>正文：<br />\n- “问题太大，看不出你要解决什么”<br />\n- “目标看不懂，做到了什么算完成？”<br />\n- “方法跟目标没关系”<\/p>\n<p>结尾句：<br />\n不是你写得少，是三段没对上。<\/p>\n<hr />\n<h2 id=\"sec-4\">第 2 页：三段其实是一件事<\/h2>\n<p>标题：问题 → 目标 → 方法，一条线<\/p>\n<p>正文：<br />\n- 问题：要解决什么<br />\n- 目标：做到什么算完成<br />\n- 方法：用什么手段，怎么证明做到了<\/p>\n<p>结尾句：<br />\n三段不是各写一段，是同一件事的三种说法。<\/p>\n<hr />\n<h2 id=\"sec-5\">第 3 页：问题段怎么写<\/h2>\n<p>标题：问题段，先写成一句话<\/p>\n<p>句式：<br />\n目前……存在……问题，现有……方法未能解决……，因此本课题研究……。<\/p>\n<p>示例课题：校园社团活动报名与签到小程序<br />\n示例问题：<br />\n报名靠群接龙统计易错，现场签到排队、事后统计靠人工，导致组织者负担重、数据不准。<\/p>\n<p>提醒：<br />\n示例只是结构示范，换成自己的课题重填。<\/p>\n<hr />\n<h2 id=\"sec-6\">第 4 页：目标段怎么写<\/h2>\n<p>标题：目标段，拆成 3 个能验收的小目标<\/p>\n<p>不要写：<br />\n提高效率、促进发展（没法验收）<\/p>\n<p>示例总目标：<br />\n实现一个可用的校园社团报名与签到小程序。<\/p>\n<p>示例分目标：<br />\n1. 实现报名、签到、统计三个功能<br />\n2. 签到流程能在测试中完整跑通<br />\n3. 通过小范围用户测试收集反馈，做一轮修改<\/p>\n<hr />\n<h2 id=\"sec-7\">第 5 页：方法段怎么写<\/h2>\n<p>标题：方法段，每个方法都要对应一个目标<\/p>\n<p>对应关系：<br />\n- 文献调研 → 界定问题<br />\n- 需求访谈 → 确定功能<br />\n- 原型开发 → 实现系统<br />\n- 功能测试 + 用户测试 → 验证效果<\/p>\n<p>写法：<br />\n用什么方法、做什么事、产出什么，三个要素缺一不可。<br />\n不要只罗列方法名词。<\/p>\n<hr />\n<h2 id=\"sec-8\">第 6 页：对应表（最值得收藏的一页）<\/h2>\n<p>标题：画出这张表，脱节一眼就能看出来<\/p>\n<table><thead><tr><th>问题<\/th><th>目标<\/th><th>方法<\/th><\/tr><\/thead><tbody><tr><td>报名统计易错、签到排队<\/td><td>实现报名、签到、统计功能<\/td><td>需求访谈 + 原型开发<\/td><\/tr><tr><td>事后统计靠人工、数据不准<\/td><td>统计结果自动生成、可导出<\/td><td>原型开发 + 功能测试<\/td><\/tr><tr><td>不知道好不好用<\/td><td>完成一轮用户测试并修改<\/td><td>用户测试 + 修改记录<\/td><\/tr><\/tbody><\/table>\n<p>自查句：<br />\n同一行讲不通，就改那一行，不要全篇重写。<\/p>\n<hr />\n<h2 id=\"sec-9\">第 7 页：收尾 + 自查清单<\/h2>\n<p>标题：发给老师前，先过这 3 条<\/p>\n<p>自查清单：<br />\n1. 问题能不能一句话说清？<br />\n2. 目标能不能验收？<br />\n3. 每个目标有没有对应方法？<\/p>\n<p>转化句：<br />\n完整填空模板和对应表在主页店铺，商品名就是“毕设开题三段填空模板”，可以自己去看目录。<\/p>\n<p>提醒：<br />\n这是结构模板，不是代写。不同学校章节顺序不同，先按自己学校的模板套章节顺序，三段内容不变。<\/p>\n<hr />\n<h2 id=\"sec-10\">正文案（发布时直接粘贴）<\/h2>\n<p>开题被打回，很多时候不是写得少，是问题、目标、方法三段没对上。问题写得很大，目标写得很空，方法写了一堆名词，老师一看就知道后面做不下去。<\/p>\n<p>我用的检查办法很简单：先把问题写成一句话，再把目标拆成 3 个能验收的小目标，最后每个目标配一个方法，画成一张对应表，同一行讲不通就改。<\/p>\n<p>图里给了句式和一个示例课题的填法，文科、理工换课题也能套，先按自己学校的章节顺序套格式，三段内容不变。完整填空模板在主页店铺，需要的可以自己去看目录。<\/p>\n<h2 id=\"sec-11\">话题标签<\/h2>\n<h1>毕设开题 #开题报告 #开题报告怎么写 #毕业论文 #毕设 #大学生 #答辩<\/h1>\n<hr />\n<h2 id=\"sec-12\">评论区置顶（发布后自己置顶一条）<\/h2>\n<p>常见问题先答：<br />\n1. 学校格式不一样怎么办？先按学校模板的章节顺序套，三段内容不变，模板里有替换位置。<br />\n2. 没有实验数据怎么办？方法里写调研加原型加测试验证，不用编数据，测试结果如实写。<br />\n3. 老师说目标太大怎么办？把总目标拆成 3 个可验收的小目标，每个目标只做一件事。<br />\n4. 能不能直接抄示例？示例只是结构示范，换成自己的课题重填，抄过去答辩一问就露馅。<\/p>\n<h2 id=\"sec-13\">发布前检查清单<\/h2>\n<ul><li>[ ] 封面大字不超过两行，图片上没有模板全文<\/li><li>[ ] 示例部分已标明“结构示范”，没有承诺通过、包过<\/li><li>[ ] 店铺商品已上架，自动发货已自己下一单测通<\/li><li>[ ] 商品详情页已写清：包含内容、格式、适用人群、不适用情况、更新政策<\/li><li>[ ] 正文和评论区没有网盘链接<\/li><\/ul>", "body": "\n# 毕设开题报告：问题、目标、方法三段怎么写\n## 可直接发布的小红书图文稿\n\n- 标题（主推）：毕设开题总被打回？问题、目标、方法这样写才对得上\n- 备选标题：开题报告别先写背景，先把这三段对齐\n- 发布时间建议：晚上 20:00–22:00\n- 挂车商品：毕设开题三段填空模板（19.9 元，引流款）\n- 图片规格建议：3:4 竖版，1080×1440，内页底色统一，重点词加粗或标色，示例部分用浅色框区分\n- 转化口径：正文和评论区不发网盘链接，引导进主页店铺看商品目录\n\n---\n\n## 封面\n\n大字：\n毕设开题总被打回？\n问题、目标、方法这样写才对得上\n\n小字：\n附三段填空模板 + 对应表\n\n---\n\n## 第 1 页：先对号入座\n\n标题：老师打回的，往往是这三句话\n\n正文：\n- “问题太大，看不出你要解决什么”\n- “目标看不懂，做到了什么算完成？”\n- “方法跟目标没关系”\n\n结尾句：\n不是你写得少，是三段没对上。\n\n---\n\n## 第 2 页：三段其实是一件事\n\n标题：问题 → 目标 → 方法，一条线\n\n正文：\n- 问题：要解决什么\n- 目标：做到什么算完成\n- 方法：用什么手段，怎么证明做到了\n\n结尾句：\n三段不是各写一段，是同一件事的三种说法。\n\n---\n\n## 第 3 页：问题段怎么写\n\n标题：问题段，先写成一句话\n\n句式：\n目前……存在……问题，现有……方法未能解决……，因此本课题研究……。\n\n示例课题：校园社团活动报名与签到小程序\n示例问题：\n报名靠群接龙统计易错，现场签到排队、事后统计靠人工，导致组织者负担重、数据不准。\n\n提醒：\n示例只是结构示范，换成自己的课题重填。\n\n---\n\n## 第 4 页：目标段怎么写\n\n标题：目标段，拆成 3 个能验收的小目标\n\n不要写：\n提高效率、促进发展（没法验收）\n\n示例总目标：\n实现一个可用的校园社团报名与签到小程序。\n\n示例分目标：\n1. 实现报名、签到、统计三个功能\n2. 签到流程能在测试中完整跑通\n3. 通过小范围用户测试收集反馈，做一轮修改\n\n---\n\n## 第 5 页：方法段怎么写\n\n标题：方法段，每个方法都要对应一个目标\n\n对应关系：\n- 文献调研 → 界定问题\n- 需求访谈 → 确定功能\n- 原型开发 → 实现系统\n- 功能测试 + 用户测试 → 验证效果\n\n写法：\n用什么方法、做什么事、产出什么，三个要素缺一不可。\n不要只罗列方法名词。\n\n---\n\n## 第 6 页：对应表（最值得收藏的一页）\n\n标题：画出这张表，脱节一眼就能看出来\n\n| 问题 | 目标 | 方法 |\n| --- | --- | --- |\n| 报名统计易错、签到排队 | 实现报名、签到、统计功能 | 需求访谈 + 原型开发 |\n| 事后统计靠人工、数据不准 | 统计结果自动生成、可导出 | 原型开发 + 功能测试 |\n| 不知道好不好用 | 完成一轮用户测试并修改 | 用户测试 + 修改记录 |\n\n自查句：\n同一行讲不通，就改那一行，不要全篇重写。\n\n---\n\n## 第 7 页：收尾 + 自查清单\n\n标题：发给老师前，先过这 3 条\n\n自查清单：\n1. 问题能不能一句话说清？\n2. 目标能不能验收？\n3. 每个目标有没有对应方法？\n\n转化句：\n完整填空模板和对应表在主页店铺，商品名就是“毕设开题三段填空模板”，可以自己去看目录。\n\n提醒：\n这是结构模板，不是代写。不同学校章节顺序不同，先按自己学校的模板套章节顺序，三段内容不变。\n\n---\n\n## 正文案（发布时直接粘贴）\n\n开题被打回，很多时候不是写得少，是问题、目标、方法三段没对上。问题写得很大，目标写得很空，方法写了一堆名词，老师一看就知道后面做不下去。\n\n我用的检查办法很简单：先把问题写成一句话，再把目标拆成 3 个能验收的小目标，最后每个目标配一个方法，画成一张对应表，同一行讲不通就改。\n\n图里给了句式和一个示例课题的填法，文科、理工换课题也能套，先按自己学校的章节顺序套格式，三段内容不变。完整填空模板在主页店铺，需要的可以自己去看目录。\n\n## 话题标签\n\n#毕设开题 #开题报告 #开题报告怎么写 #毕业论文 #毕设 #大学生 #答辩\n\n---\n\n## 评论区置顶（发布后自己置顶一条）\n\n常见问题先答：\n1. 学校格式不一样怎么办？先按学校模板的章节顺序套，三段内容不变，模板里有替换位置。\n2. 没有实验数据怎么办？方法里写调研加原型加测试验证，不用编数据，测试结果如实写。\n3. 老师说目标太大怎么办？把总目标拆成 3 个可验收的小目标，每个目标只做一件事。\n4. 能不能直接抄示例？示例只是结构示范，换成自己的课题重填，抄过去答辩一问就露馅。\n\n## 发布前检查清单\n\n- [ ] 封面大字不超过两行，图片上没有模板全文\n- [ ] 示例部分已标明“结构示范”，没有承诺通过、包过\n- [ ] 店铺商品已上架，自动发货已自己下一单测通\n- [ ] 商品详情页已写清：包含内容、格式、适用人群、不适用情况、更新政策\n- [ ] 正文和评论区没有网盘链接\n", "file": "04-xiaohongshu-kaiti.md", "cover_key": "xiaohongshu-kaiti"}, {"id": 3, "title": "小米 AX3600 刷 OpenWrt 做旁路由完整教程（定版）", "category": "网络与路由", "tags": ["AX3600", "OpenWrt", "OpenClash", "AdGuardHome", "旁路由"], "summary": "BE7200 Pro 当主路由、AX3600 刷 OpenWrt 做旁路由的完整定版教程：降级开 SSH、刷机、OpenClash 分流与 AdGuardHome 去广告，全程可照着走通。", "pinned": true, "updated": "2026-11-26", "source": "来源：your_files/AX3600旁路由完整教程.md（294 行定版）。早期草稿《小米AX3600刷OpenWrt旁路由教程.md》内容已被定版覆盖，不单独收录。", "toc": [{"title": "0. 先看懂拓扑（动手前花 2 分钟）", "label": "0. 先看懂拓扑（动手前花 2 分钟）", "level": 2, "n": 1}, {"title": "1. 恢复出厂，确认固件版本", "label": "1. 恢复出厂，确认固件版本", "level": 2, "n": 2}, {"title": "2.（仅高版本需要）降级到 1.0.17", "label": "2.（仅高版本需要）降级到 1.0.17", "level": 2, "n": 3}, {"title": "3. 一键开启 SSH", "label": "3. 一键开启 SSH", "level": 2, "n": 4}, {"title": "4. 备份重要分区（5 分钟，变砖保险）", "label": "4. 备份重要分区（5 分钟，变砖保险）", "level": 2, "n": 5}, {"title": "5. 下载 OpenWrt 固件", "label": "5. 下载 OpenWrt 固件", "level": 2, "n": 6}, {"title": "6. 刷入 OpenWrt（分两步，约 10 分钟）", "label": "6. 刷入 OpenWrt（分两步，约 10 分钟）", "level": 2, "n": 7}, {"title": "6.1 把过渡镜像传进路由器并改短文件名", "label": "6.1 把过渡镜像传进路由器并改短文件名", "level": 3, "n": 8}, {"title": "6.2 查当前启动分区，刷入非当前分区", "label": "6.2 查当前启动分区，刷入非当前分区", "level": 3, "n": 9}, {"title": "6.3 进内存中的 OpenWrt，正式安装", "label": "6.3 进内存中的 OpenWrt，正式安装", "level": 3, "n": 10}, {"title": "7. 设为旁路由（基础网络配置）", "label": "7. 设为旁路由（基础网络配置）", "level": 2, "n": 11}, {"title": "8. 安装 AdGuardHome（去广告 DNS）", "label": "8. 安装 AdGuardHome（去广告 DNS）", "level": 2, "n": 12}, {"title": "9. 安装 OpenClash（代理分流）", "label": "9. 安装 OpenClash（代理分流）", "level": 2, "n": 13}, {"title": "9.1 下载安装包", "label": "9.1 下载安装包", "level": 3, "n": 14}, {"title": "9.2 安装依赖和主程序", "label": "9.2 安装依赖和主程序", "level": 3, "n": 15}, {"title": "9.3 下载 Clash 内核", "label": "9.3 下载 Clash 内核", "level": 3, "n": 16}, {"title": "9.4 导入订阅并启动", "label": "9.4 导入订阅并启动", "level": 3, "n": 17}, {"title": "9.5 把 AdGuardHome 的上游接到 Clash", "label": "9.5 把 AdGuardHome 的上游接到 Clash", "level": 3, "n": 18}, {"title": "9.6 让路由器自身也走这条 DNS", "label": "9.6 让路由器自身也走这条 DNS", "level": 3, "n": 19}, {"title": "10. 设备接入 & 验证", "label": "10. 设备接入 & 验证", "level": 2, "n": 20}, {"title": "11. 回滚与救砖", "label": "11. 回滚与救砖", "level": 2, "n": 21}, {"title": "12. 日常维护 & 常见问题", "label": "12. 日常维护 & 常见问题", "level": 2, "n": 22}], "html": "<blockquote><p>目标：BE7200 Pro 继续当主路由（拨号 + WiFi），闲置的 AX3600 刷 OpenWrt 后做<strong>旁路由<\/strong>，<br />\n承担代理分流（OpenClash）和去广告 DNS（AdGuardHome）。<br />\n想走软路由的设备把网关/DNS 指向它，不想走的设备完全不受影响。<\/p><\/blockquote>\n<h2 id=\"sec-1\">0. 先看懂拓扑（动手前花 2 分钟）<\/h2>\n<pre><code>光猫 ── BE7200 Pro（主路由，192.168.31.1，管拨号和 WiFi）\n          │\n          │ 网线（LAN 口对 LAN 口，AX3600 的 WAN 口空着不用）\n          │\n        AX3600（旁路由，192.168.31.2，WiFi 关闭）\n<\/code><\/pre>\n<ul><li>你的手机/电脑想走软路由时：手动把网关设为 192.168.31.2，DNS 设为 192.168.31.2。<\/li><li>数据流向：设备 → AX3600（Clash 分流 / AdGuardHome 过滤）→ BE7200 Pro → 光猫 → 外网。<\/li><li>全程用<strong>网线<\/strong>把电脑连 AX3600 操作，不要用 WiFi 刷机。<\/li><\/ul>\n<p><strong>需要准备<\/strong>：AX3600 及电源、一根网线、一台 Win11 电脑（自带 <code>ssh<\/code>/<code>scp<\/code> 命令）。<\/p>\n<hr />\n<h2 id=\"sec-2\">1. 恢复出厂，确认固件版本<\/h2>\n<ol><li>AX3600 通电，<strong>不接任何网线<\/strong>。长按机身 Reset 孔 5 秒以上，看到指示灯变橙色后松手，等待 2~3 分钟重启完成。<\/li><li>电脑用网线连 AX3600 的 <strong>LAN 口<\/strong>（4 个口随便一个，别插 WAN 口）。<\/li><li>浏览器打开 <code>http://192.168.31.1<\/code>，按初始化向导随便设个 WiFi 名和管理密码（管理密码记下来，后面降级登录要用）。<\/li><li>进后台看固件版本（一般在&quot;系统状态&quot;或&quot;路由设置→系统升级&quot;里）。<br />\n   - 如果版本是 <strong>1.0.17<\/strong>：直接跳到第 3 步。<br />\n   - 如果版本<strong>高于<\/strong> 1.0.17：必须先降级，看第 2 步。（开 SSH 用的漏洞在新版里已经被堵上了）<\/li><\/ol>\n<hr />\n<h2 id=\"sec-3\">2.（仅高版本需要）降级到 1.0.17<\/h2>\n<ol><li>在电脑上下载降级固件（小米官方 CDN 直链，已验证可访问，纯文本长按复制）：<br />\n   <code>https://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/rom/r3600/miwifi_r3600_firmware_5da25_1.0.17.bin<\/code><br />\n   - 文件名：<code>miwifi_r3600_firmware_5da25_1.0.17.bin<\/code><br />\n   - 大小：<strong>28,312,508 字节<\/strong>（约 27.0 MiB）。下完对一下大小，差一位都别用。<\/li><li>浏览器登录 <code>http://192.168.31.1<\/code>，登录后看地址栏，把 <code>stok=<\/code> 后面那一长串字符复制下来（后面也要用）。<\/li><li>在浏览器地址栏粘贴（把 <code>&lt;STOK&gt;<\/code> 换成你刚复制的那串）：<br />\n   <code>http://192.168.31.1/cgi-bin/luci/;stok=&lt;STOK&gt;/web/setting/upgrade<\/code><br />\n   这是&quot;手动升级&quot;页面。点&quot;选择文件&quot;，上传第 1 步下载的 bin，开始升级。<\/li><li>等待 3~5 分钟，指示灯变蓝常亮表示完成。浏览器重新打开 <code>http://192.168.31.1<\/code> 登录。<br />\n   （如果提示密码不对，用你第 1 步里设的管理密码；实在不行 Reset 重来一次。）<\/li><\/ol>\n<hr />\n<h2 id=\"sec-4\">3. 一键开启 SSH<\/h2>\n<ol><li>登录 <code>http://192.168.31.1<\/code>，从地址栏复制新的 <code>stok=<\/code> 后面的字符串。<\/li><li>把下面这串地址里的 <code>&lt;STOK&gt;<\/code> 替换掉，在<strong>浏览器地址栏<\/strong>粘贴后回车（纯文本，长按复制）：<br />\n   <code>http://192.168.31.1/cgi-bin/luci/;stok=&lt;STOK&gt;/api/xqsystem/upgrade_rom?url=%3Bnvram%20set%20ssh_en%3D1%3Bnvram%20commit%3Bsed%20-i%20%27s%2Fchannel%3D.*%2Fchannel%3D%22debug%22%2Fg%27%20%2Fetc%2Finit.d%2Fdropbear%3B%2Fetc%2Finit.d%2Fdropbear%20start%3Becho%20-e%20[密码已隐藏]%7Cpasswd%20root%3B<\/code><\/li><li>页面返回 <code>{&quot;code&quot;:0}<\/code> 即成功。这串命令一次做完四件事：打开 SSH 开关并保存、启动 SSH 服务、把 root 密码设为你自己设定的密码（[密码已隐藏]）。<\/li><li>在电脑上按 <code>Win+R<\/code> 输入 <code>cmd<\/code> 回车，输入：<br />\n   <code>ssh root@192.168.31.1<\/code><br />\n   提示输入密码时输入你设置的密码（输入时不显示，输完回车）。看到 <code>root@XiaoQiang:~#<\/code> 就表示进去了。<\/li><li><strong>如果 root 密码登不上<\/strong>：说明密码没设成功。备选方案是去网上搜&quot;小米路由器 SSH 密码计算器&quot;，输入机身标签上的 SN 算出密码再登。算出来也登不上就回到第 1 步重来（多半是固件版本不对）。<\/li><\/ol>\n<hr />\n<h2 id=\"sec-5\">4. 备份重要分区（5 分钟，变砖保险）<\/h2>\n<p>在刚才的 SSH 窗口里逐行执行：<\/p>\n<pre><code>cd /tmp\nnanddump -f mtd8-art.bin /dev/mtd8\nnanddump -f mtd9-bdata.bin /dev/mtd9\nnanddump -f mtd10-crash.bin /dev/mtd10\nls -lh mtd*.bin\n<\/code><\/pre>\n<ul><li>mtd8 是 ART（WiFi 射频校准数据，丢了 WiFi 就残了），mtd9 是 bdata（设备身份信息），mtd10 是 crash。<\/li><li>然后在<strong>电脑的 cmd<\/strong> 里（不是 SSH 里）执行，把备份拉回电脑妥善保存：<br />\n  <code>scp root@192.168.31.1:/tmp/mtd*.bin D:\\backup\\ax3600\\<\/code><br />\n  （先在 D 盘建好 <code>D:\\backup\\ax3600<\/code> 文件夹；密码还是你设置的那个；第一次会问 <code>yes/no<\/code>，输 <code>yes<\/code>。）<\/li><\/ul>\n<hr />\n<h2 id=\"sec-6\">5. 下载 OpenWrt 固件<\/h2>\n<p>打开 <code>https://firmware-selector.openwrt.org/<\/code>，搜索框输入 <code>ax3600<\/code>，版本选 <strong>25.12.6<\/strong>（当前稳定版；24.10 系列已于 2026-09-30 停止安全更新，不建议再用），下载下面两个文件：<\/p>\n<table><thead><tr><th>文件<\/th><th>大小<\/th><th>SHA256（下载后可校验）<\/th><\/tr><\/thead><tbody><tr><td><code>openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-initramfs-factory.ubi<\/code><\/td><td>14,942,208 字节（约 14.25 MiB）<\/td><td><code>994f415609a058ee44ab4fa92712c0cdb4e754aabb0abb0a70a0d0d9652ec357<\/code><\/td><\/tr><tr><td><code>openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-squashfs-sysupgrade.bin<\/code><\/td><td>13,568,307 字节（约 12.94 MiB）<\/td><td><code>b4d26d71e913a12e9f35a362cc360d8de9e513563b8bbe1e7c8dc43796726729<\/code><\/td><\/tr><\/tbody><\/table>\n<blockquote><p>注意：24.10 开始 AX3600 的 target 从 <code>ipq807x/generic<\/code> 改成了 <code>qualcommax/ipq807x<\/code>，<br />\n老教程里的旧版文件名对不上是正常的，认准 <code>qualcommax-ipq807x-xiaomi_ax3600<\/code> 就行。<\/p><\/blockquote>\n<hr />\n<h2 id=\"sec-7\">6. 刷入 OpenWrt（分两步，约 10 分钟）<\/h2>\n<h3 id=\"sec-8\">6.1 把过渡镜像传进路由器并改短文件名<\/h3>\n<p>在电脑 cmd 里：<\/p>\n<pre><code>scp D:\\openwrt\\openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-initramfs-factory.ubi root@192.168.31.1:/tmp/factory.ubi\n<\/code><\/pre>\n<p>（把 <code>D:\\openwrt\\<\/code> 换成你实际存放固件的文件夹。）<\/p>\n<h3 id=\"sec-9\">6.2 查当前启动分区，刷入非当前分区<\/h3>\n<p>SSH 登录路由器，执行：<\/p>\n<pre><code>fw_printenv flag_boot_rootfs\n<\/code><\/pre>\n<p>看返回结果，二选一执行（<strong>不要两组都执行<\/strong>）：<\/p>\n<ul><li>如果返回 <code>flag_boot_rootfs=1<\/code>，执行：<\/li><\/ul>\n<pre><code>ubiformat /dev/mtd12 -y -f /tmp/factory.ubi -s 2048 -O 2048\nfw_setenv flag_boot_rootfs 0\nfw_setenv flag_last_success 0\nreboot\n<\/code><\/pre>\n<ul><li>如果返回 <code>flag_boot_rootfs=0<\/code>，执行：<\/li><\/ul>\n<pre><code>ubiformat /dev/mtd13 -y -f /tmp/factory.ubi -s 2048 -O 2048\nfw_setenv flag_boot_rootfs 1\nfw_setenv flag_last_success 1\nreboot\n<\/code><\/pre>\n<p>原理：AX3600 有双系统分区，这一步只写<strong>当前没在用的那个分区<\/strong>，先让 OpenWrt 从内存里跑起来验证一遍。<br />\n这一步如果失败，原厂系统还完整躺在另一个分区里，有机会切回去。<br />\n注意：下一步 6.3 正式安装完成后，OpenWrt 会把两个分区合并成一个大分区使用，<br />\n原厂就不再保留在机器里了——届时恢复原厂走第 11 步的官方修复工具，别指望双分区兜底。<\/p>\n<h3 id=\"sec-10\">6.3 进内存中的 OpenWrt，正式安装<\/h3>\n<ol><li>等待 2~3 分钟（指示灯变蓝）。<strong>电脑网线仍然直连 AX3600<\/strong>，浏览器打开 <code>http://192.168.1.1<\/code><br />\n   （注意：这时 IP 变成了 192.168.1.1，不是 192.168.31.1）。<\/li><li>第一次进会让你设 root 密码，设一个自己记得住的。<\/li><li>在电脑 cmd 里把正式固件传进去并改短名：<br />\n   <code>scp D:\\openwrt\\openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-squashfs-sysupgrade.bin root@192.168.1.1:/tmp/sysupgrade.bin<\/code><\/li><li>SSH 登录（<code>ssh root@192.168.1.1<\/code>，用刚设的密码），执行：<br />\n   <code>sysupgrade -n /tmp/sysupgrade.bin<\/code><\/li><li>等待 3 分钟左右，OpenWrt 正式装好。至此刷机完成。<\/li><\/ol>\n<hr />\n<h2 id=\"sec-11\">7. 设为旁路由（基础网络配置）<\/h2>\n<ol><li>电脑<strong>仍然网线直连 AX3600<\/strong>，浏览器打开 <code>http://192.168.1.1<\/code> 登录。<\/li><li>网络 → 接口 → LAN → 修改 → 基本设置，改成：<br />\n   - IPv4 地址：<code>192.168.31.2<\/code><br />\n   - IPv4 子网掩码：<code>255.255.255.0<\/code><br />\n   - IPv4 网关：<code>192.168.31.1<\/code>（你的 BE7200 Pro）<br />\n   - 使用自定义的 DNS 服务器：<code>192.168.31.1<\/code>（先这样，第 9 步会改成 127.0.0.1）<\/li><li>同一页面下方&quot;DHCP 服务器&quot; → 基本设置 → <strong>勾选&quot;忽略此接口&quot;<\/strong>（DHCP 继续由 BE7200 Pro 负责）。<\/li><li>点&quot;保存&quot;，再点&quot;保存并应用&quot;。页面会转圈然后断开——<strong>这是正常的<\/strong>，因为 IP 已经变了。<\/li><li>现在接线：<strong>AX3600 的 LAN 口<\/strong> 用网线连到 <strong>BE7200 Pro 的 LAN 口<\/strong>（AX3600 的 WAN 口永远空着）。<br />\n   电脑的网线也改插到 BE7200 Pro 上（或连 BE7200 Pro 的 WiFi）。<\/li><li>浏览器打开 <code>http://192.168.31.2<\/code>，能登录就说明旁路由网络通了。<\/li><li>关 WiFi：网络 → 无线，把 2.4G 和 5G 的两个无线网络都点&quot;禁用&quot;（WiFi 交给 BE7200 Pro，AX3600 只当网关）。<\/li><li>换国内软件源（官方源在国内很慢），SSH 里执行：<\/li><\/ol>\n<pre><code>cat /etc/apk/repositories\nsed -i &#x27;s|downloads.openwrt.org|mirrors.ustc.edu.cn/openwrt|g&#x27; /etc/apk/repositories\ncat /etc/apk/repositories\napk update\n<\/code><\/pre>\n<p>第二次 <code>cat<\/code> 确认地址已经变成 <code>mirrors.ustc.edu.cn/openwrt<\/code> 开头，<code>apk update<\/code> 不报错即可。<\/p>\n<hr />\n<h2 id=\"sec-12\">8. 安装 AdGuardHome（去广告 DNS）<\/h2>\n<ol><li>SSH 里执行：<br />\n   <code>apk add adguardhome luci-app-adguardhome<\/code><br />\n   - 如果提示找不到这两个包，停下来告诉我，我给你手动安装官方二进制包的步骤（不需要重来）。<\/li><li>把 53 端口让给 AdGuardHome（OpenWrt 自带的 dnsmasq 默认占着 53）：<\/li><\/ol>\n<pre><code>uci set dhcp.@dnsmasq[0].port=&#x27;0&#x27;\nuci commit dhcp\n/etc/init.d/dnsmasq restart\n/etc/init.d/adguardhome restart\nss -lntp | grep &#x27;:53 &#x27;\n<\/code><\/pre>\n<p>最后一条命令应该能看到 <code>adguardhome<\/code> 在监听 53 端口。<br />\n3. 浏览器打开 <code>http://192.168.31.2:3000<\/code> 按向导走：<br />\n   - 网页管理界面端口：3000（默认）<br />\n   - DNS 服务器端口：53（默认）<br />\n   - 设置管理用户名和密码（自己记好）<br />\n   - 上游 DNS 服务器：<strong>先填 <code>223.5.5.5<\/code><\/strong>（装完 OpenClash 后再改成 Clash 的 7874 端口，先填个能用的）<br />\n4. 进 AdGuardHome 的&quot;设置 → DNS 设置&quot;：Bootstrap DNS 填 <code>223.5.5.5<\/code>，保存。<\/p>\n<hr />\n<h2 id=\"sec-13\">9. 安装 OpenClash（代理分流）<\/h2>\n<h3 id=\"sec-14\">9.1 下载安装包<\/h3>\n<p>OpenClash 的 GitHub Releases 页（仓库 <code>vernesong/OpenClash<\/code>），下载当前最新版 <strong>v0.48.002<\/strong> 的 apk 包：<br />\n<code>luci-app-openclash-0.48.002.apk<\/code>，大小 <strong>10,702,048 字节<\/strong>（约 10.21 MiB）。<br />\n（25.12 用 apk 包管理器，<code>.apk<\/code> 和 <code>.ipk<\/code> 别下混。）<\/p>\n<h3 id=\"sec-15\">9.2 安装依赖和主程序<\/h3>\n<p>把 apk 传到路由器 <code>/tmp<\/code>（用 scp 或 WinSCP 拖进去），SSH 里执行：<\/p>\n<pre><code>apk add dnsmasq-full\napk add bash curl ca-bundle kmod-tun kmod-nft-tproxy\napk add --allow-untrusted /tmp/luci-app-openclash-0.48.002.apk\n<\/code><\/pre>\n<p>说明：<br />\n- <code>dnsmasq-full<\/code> 是 OpenClash 安装检查要的完整版 dnsmasq，会替换掉精简版（我们已经把它的 DNS 关了、DHCP 也没开，替换很安全）。<br />\n- <code>--allow-untrusted<\/code> 是因为这个包不是官方源签名的，只对你确认过的文件用。<br />\n- 装完刷新 LuCI，左侧菜单出现&quot;服务 → OpenClash&quot;即成功。<\/p>\n<h3 id=\"sec-16\">9.3 下载 Clash 内核<\/h3>\n<p>服务 → OpenClash → 全局设置 → 版本更新 → 内核下载：<br />\n- 内核选 <strong>Meta（mihomo）<\/strong>，架构选 <strong>linux-arm64<\/strong>（AX3600 是 ARM64），点下载，等待完成。<br />\n- 如果路由器上下载 GitHub 很慢/失败：用电脑从 OpenClash 的 Releases 页下好对应内核文件，<br />\n  通过&quot;全局设置 → 版本更新 → 上传内核&quot;传上去也行。<\/p>\n<h3 id=\"sec-17\">9.4 导入订阅并启动<\/h3>\n<ol><li>全局设置 → 配置文件订阅 → 新增：粘贴你的机场订阅链接（或你自己的 vless 订阅），保存。<\/li><li>点&quot;更新订阅&quot;，等节点列表出来。<\/li><li>回到&quot;运行状态&quot;/&quot;配置文件管理&quot;，选中刚更新的配置文件。<\/li><li><strong>DNS 设置（关键，决定会不会断网）<\/strong>：<br />\n   - 本地 DNS 劫持：启用<br />\n   - Fake-IP：启用<br />\n   - NameServer：填 <code>223.5.5.5<\/code>（多个用英文逗号隔开；<strong>千万不要填 127.0.0.1<\/strong>，否则和 AdGuardHome 互相指形成死循环）<\/li><li>模式设置：运行模式保持&quot;规则&quot;即可，先别开 TUN。<\/li><li>点&quot;启动&quot;。状态页显示运行中即成功。<\/li><\/ol>\n<h3 id=\"sec-18\">9.5 把 AdGuardHome 的上游接到 Clash<\/h3>\n<p>回到 <code>http://192.168.31.2:3000<\/code> → 设置 → DNS 设置：<br />\n- 上游 DNS 服务器改成：<code>127.0.0.1:7874<\/code>（这就是 OpenClash 的 Fake-IP DNS 端口）<br />\n- 保存。<\/p>\n<p>最终 DNS 链路：<strong>设备 → AdGuardHome(:53，去广告) → OpenClash(:7874，按规则分流) → 真实 DNS<\/strong>。<br />\n代理节点的域名由 Clash 用你填的 223.5.5.5 直接解析，不经过 AdGuardHome，没有循环。<\/p>\n<h3 id=\"sec-19\">9.6 让路由器自身也走这条 DNS<\/h3>\n<p>网络 → 接口 → LAN → 修改 → 基本设置 → 自定义 DNS 服务器改成 <code>127.0.0.1<\/code>，保存并应用。<\/p>\n<hr />\n<h2 id=\"sec-20\">10. 设备接入 &amp; 验证<\/h2>\n<ol><li>在想走软路由的设备上手动设置（以电脑为例）：<br />\n   - IP：192.168.31.x（x 取 100~200 之间没被占用的）<br />\n   - 子网掩码：255.255.255.0<br />\n   - 网关：<strong>192.168.31.2<\/strong><br />\n   - DNS：<strong>192.168.31.2<\/strong><\/li><li>验证三件套：<br />\n   - 能正常打开网页 → 旁路由转发通了。<br />\n   - 打开 AdGuardHome 首页（<code>http://192.168.31.2:3000<\/code>），&quot;查询日志&quot;里有这台设备的记录，且拦截计数在涨 → 去广告生效。<br />\n   - 在 Clash 里切到&quot;全局&quot;模式后访问 <code>ip.sb<\/code>，显示的 IP 变成节点 IP → 代理生效；切回&quot;规则&quot;模式，国内网站直连速度正常。<\/li><li>不想走的设备：什么都不用改，网关/DNS 保持自动（走 BE7200 Pro），完全不受影响。<\/li><\/ol>\n<hr />\n<h2 id=\"sec-21\">11. 回滚与救砖<\/h2>\n<ul><li><strong>升级 OpenWrt<\/strong>：去固件选择器下新版 <code>squashfs-sysupgrade.bin<\/code>，LuCI 里系统 → 备份/升级 → 刷写即可（可保留配置）。<\/li><li><strong>过渡阶段起不来（6.2 之后、6.3 之前）<\/strong>：原厂还完整躺在另一个分区里，<br />\n  断电重启多试几次，bootloader 会按 <code>flag_last_success<\/code> 机制切回原厂分区。<\/li><li><strong>正式装完后回原厂<\/strong>：用小米官方 <strong>MIWIFIRepairTool<\/strong> 修复工具——电脑网线直连 AX3600 的 LAN 口，<br />\n  运行工具、选择原厂固件包，工具会通过 TFTP 把官方固件刷回去，恢复出厂状态（小米固件、米家管理都回来）。<br />\n  这是小米官方给的救砖通道，成功率很高，不需要动第 4 步的备份。<br />\n  工具官方直链（979,690 字节的 zip）：<code>https://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/tools/MIWIFIRepairTool.x86.zip<\/code><br />\n  注意：小米路由器会劫持 <code>miwifi.com<\/code> 域名到本地后台，在家里网络打开小米官网下载页会跳到路由器管理页，<br />\n  属正常现象；上面的 CDN 直链不受劫持影响，可直接下载（或用手机流量打开官网）。<\/li><li><strong>手动 TFTP 救砖<\/strong>：修复工具不行时，OpenWrt 官方 wiki 有 AX3600 的 debrick 步骤，原理相同、手动操作。<\/li><li>第 4 步备份的 <code>mtd8-art.bin<\/code> 等文件是最后保险，留着别删。<\/li><\/ul>\n<h2 id=\"sec-22\">12. 日常维护 &amp; 常见问题<\/h2>\n<ul><li><strong>订阅自动更新<\/strong>：OpenClash → 全局设置 → 计划任务，打开&quot;配置文件自动更新&quot;（每天凌晨一次）。<\/li><li><strong>过滤器更新<\/strong>：AdGuardHome → 过滤器 → 拦截列表，定期点&quot;检查更新&quot;。<\/li><li><strong>装完 Clash 上不了网<\/strong>：先去 OpenClash 里点&quot;停止运行&quot;，看是否恢复；<br />\n  九成是 DNS 环路——检查 NameServer 里有没有 127.0.0.1，有就删掉。<\/li><li><strong>AdGuardHome 的 :3000 打不开<\/strong>：SSH 里看 <code>logread | grep -i adguard<\/code> 找报错。<\/li><li><strong>53 端口被占<\/strong>：<code>ss -lntp | grep &#x27;:53 &#x27;<\/code> 看是谁在监听，应该只有 adguardhome。<\/li><li><strong>部分 UDP 应用（如游戏语音）异常<\/strong>：试试 OpenClash 里切换到 TUN 模式，或把这台设备网关改回 192.168.31.1 绕开。<\/li><\/ul>", "body": "\n# 小米 AX3600 刷 OpenWrt 做旁路由（OpenClash + AdGuardHome）完整教程\n\n> 目标：BE7200 Pro 继续当主路由（拨号 + WiFi），闲置的 AX3600 刷 OpenWrt 后做**旁路由**，\n> 承担代理分流（OpenClash）和去广告 DNS（AdGuardHome）。\n> 想走软路由的设备把网关/DNS 指向它，不想走的设备完全不受影响。\n\n## 0. 先看懂拓扑（动手前花 2 分钟）\n\n```\n光猫 ── BE7200 Pro（主路由，192.168.31.1，管拨号和 WiFi）\n          │\n          │ 网线（LAN 口对 LAN 口，AX3600 的 WAN 口空着不用）\n          │\n        AX3600（旁路由，192.168.31.2，WiFi 关闭）\n```\n\n- 你的手机/电脑想走软路由时：手动把网关设为 192.168.31.2，DNS 设为 192.168.31.2。\n- 数据流向：设备 → AX3600（Clash 分流 / AdGuardHome 过滤）→ BE7200 Pro → 光猫 → 外网。\n- 全程用**网线**把电脑连 AX3600 操作，不要用 WiFi 刷机。\n\n**需要准备**：AX3600 及电源、一根网线、一台 Win11 电脑（自带 `ssh`/`scp` 命令）。\n\n---\n\n## 1. 恢复出厂，确认固件版本\n\n1. AX3600 通电，**不接任何网线**。长按机身 Reset 孔 5 秒以上，看到指示灯变橙色后松手，等待 2~3 分钟重启完成。\n2. 电脑用网线连 AX3600 的 **LAN 口**（4 个口随便一个，别插 WAN 口）。\n3. 浏览器打开 `http://192.168.31.1`，按初始化向导随便设个 WiFi 名和管理密码（管理密码记下来，后面降级登录要用）。\n4. 进后台看固件版本（一般在\"系统状态\"或\"路由设置→系统升级\"里）。\n   - 如果版本是 **1.0.17**：直接跳到第 3 步。\n   - 如果版本**高于** 1.0.17：必须先降级，看第 2 步。（开 SSH 用的漏洞在新版里已经被堵上了）\n\n---\n\n## 2.（仅高版本需要）降级到 1.0.17\n\n1. 在电脑上下载降级固件（小米官方 CDN 直链，已验证可访问，纯文本长按复制）：\n   `https://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/rom/r3600/miwifi_r3600_firmware_5da25_1.0.17.bin`\n   - 文件名：`miwifi_r3600_firmware_5da25_1.0.17.bin`\n   - 大小：**28,312,508 字节**（约 27.0 MiB）。下完对一下大小，差一位都别用。\n2. 浏览器登录 `http://192.168.31.1`，登录后看地址栏，把 `stok=` 后面那一长串字符复制下来（后面也要用）。\n3. 在浏览器地址栏粘贴（把 `<STOK>` 换成你刚复制的那串）：\n   `http://192.168.31.1/cgi-bin/luci/;stok=<STOK>/web/setting/upgrade`\n   这是\"手动升级\"页面。点\"选择文件\"，上传第 1 步下载的 bin，开始升级。\n4. 等待 3~5 分钟，指示灯变蓝常亮表示完成。浏览器重新打开 `http://192.168.31.1` 登录。\n   （如果提示密码不对，用你第 1 步里设的管理密码；实在不行 Reset 重来一次。）\n\n---\n\n## 3. 一键开启 SSH\n\n1. 登录 `http://192.168.31.1`，从地址栏复制新的 `stok=` 后面的字符串。\n2. 把下面这串地址里的 `<STOK>` 替换掉，在**浏览器地址栏**粘贴后回车（纯文本，长按复制）：\n   `http://192.168.31.1/cgi-bin/luci/;stok=<STOK>/api/xqsystem/upgrade_rom?url=%3Bnvram%20set%20ssh_en%3D1%3Bnvram%20commit%3Bsed%20-i%20%27s%2Fchannel%3D.*%2Fchannel%3D%22debug%22%2Fg%27%20%2Fetc%2Finit.d%2Fdropbear%3B%2Fetc%2Finit.d%2Fdropbear%20start%3Becho%20-e%20[密码已隐藏]%7Cpasswd%20root%3B`\n3. 页面返回 `{\"code\":0}` 即成功。这串命令一次做完四件事：打开 SSH 开关并保存、启动 SSH 服务、把 root 密码设为你自己设定的密码（[密码已隐藏]）。\n4. 在电脑上按 `Win+R` 输入 `cmd` 回车，输入：\n   `ssh root@192.168.31.1`\n   提示输入密码时输入你设置的密码（输入时不显示，输完回车）。看到 `root@XiaoQiang:~#` 就表示进去了。\n5. **如果 root 密码登不上**：说明密码没设成功。备选方案是去网上搜\"小米路由器 SSH 密码计算器\"，输入机身标签上的 SN 算出密码再登。算出来也登不上就回到第 1 步重来（多半是固件版本不对）。\n\n---\n\n## 4. 备份重要分区（5 分钟，变砖保险）\n\n在刚才的 SSH 窗口里逐行执行：\n\n```\ncd /tmp\nnanddump -f mtd8-art.bin /dev/mtd8\nnanddump -f mtd9-bdata.bin /dev/mtd9\nnanddump -f mtd10-crash.bin /dev/mtd10\nls -lh mtd*.bin\n```\n\n- mtd8 是 ART（WiFi 射频校准数据，丢了 WiFi 就残了），mtd9 是 bdata（设备身份信息），mtd10 是 crash。\n- 然后在**电脑的 cmd** 里（不是 SSH 里）执行，把备份拉回电脑妥善保存：\n  `scp root@192.168.31.1:/tmp/mtd*.bin D:\\backup\\ax3600\\`\n  （先在 D 盘建好 `D:\\backup\\ax3600` 文件夹；密码还是你设置的那个；第一次会问 `yes/no`，输 `yes`。）\n\n---\n\n## 5. 下载 OpenWrt 固件\n\n打开 `https://firmware-selector.openwrt.org/`，搜索框输入 `ax3600`，版本选 **25.12.6**（当前稳定版；24.10 系列已于 2026-09-30 停止安全更新，不建议再用），下载下面两个文件：\n\n| 文件 | 大小 | SHA256（下载后可校验） |\n|---|---|---|\n| `openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-initramfs-factory.ubi` | 14,942,208 字节（约 14.25 MiB） | `994f415609a058ee44ab4fa92712c0cdb4e754aabb0abb0a70a0d0d9652ec357` |\n| `openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-squashfs-sysupgrade.bin` | 13,568,307 字节（约 12.94 MiB） | `b4d26d71e913a12e9f35a362cc360d8de9e513563b8bbe1e7c8dc43796726729` |\n\n> 注意：24.10 开始 AX3600 的 target 从 `ipq807x/generic` 改成了 `qualcommax/ipq807x`，\n> 老教程里的旧版文件名对不上是正常的，认准 `qualcommax-ipq807x-xiaomi_ax3600` 就行。\n\n---\n\n## 6. 刷入 OpenWrt（分两步，约 10 分钟）\n\n### 6.1 把过渡镜像传进路由器并改短文件名\n\n在电脑 cmd 里：\n\n```\nscp D:\\openwrt\\openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-initramfs-factory.ubi root@192.168.31.1:/tmp/factory.ubi\n```\n\n（把 `D:\\openwrt\\` 换成你实际存放固件的文件夹。）\n\n### 6.2 查当前启动分区，刷入非当前分区\n\nSSH 登录路由器，执行：\n\n```\nfw_printenv flag_boot_rootfs\n```\n\n看返回结果，二选一执行（**不要两组都执行**）：\n\n- 如果返回 `flag_boot_rootfs=1`，执行：\n```\nubiformat /dev/mtd12 -y -f /tmp/factory.ubi -s 2048 -O 2048\nfw_setenv flag_boot_rootfs 0\nfw_setenv flag_last_success 0\nreboot\n```\n- 如果返回 `flag_boot_rootfs=0`，执行：\n```\nubiformat /dev/mtd13 -y -f /tmp/factory.ubi -s 2048 -O 2048\nfw_setenv flag_boot_rootfs 1\nfw_setenv flag_last_success 1\nreboot\n```\n\n原理：AX3600 有双系统分区，这一步只写**当前没在用的那个分区**，先让 OpenWrt 从内存里跑起来验证一遍。\n这一步如果失败，原厂系统还完整躺在另一个分区里，有机会切回去。\n注意：下一步 6.3 正式安装完成后，OpenWrt 会把两个分区合并成一个大分区使用，\n原厂就不再保留在机器里了——届时恢复原厂走第 11 步的官方修复工具，别指望双分区兜底。\n\n### 6.3 进内存中的 OpenWrt，正式安装\n\n1. 等待 2~3 分钟（指示灯变蓝）。**电脑网线仍然直连 AX3600**，浏览器打开 `http://192.168.1.1`\n   （注意：这时 IP 变成了 192.168.1.1，不是 192.168.31.1）。\n2. 第一次进会让你设 root 密码，设一个自己记得住的。\n3. 在电脑 cmd 里把正式固件传进去并改短名：\n   `scp D:\\openwrt\\openwrt-25.12.6-qualcommax-ipq807x-xiaomi_ax3600-squashfs-sysupgrade.bin root@192.168.1.1:/tmp/sysupgrade.bin`\n4. SSH 登录（`ssh root@192.168.1.1`，用刚设的密码），执行：\n   `sysupgrade -n /tmp/sysupgrade.bin`\n5. 等待 3 分钟左右，OpenWrt 正式装好。至此刷机完成。\n\n---\n\n## 7. 设为旁路由（基础网络配置）\n\n1. 电脑**仍然网线直连 AX3600**，浏览器打开 `http://192.168.1.1` 登录。\n2. 网络 → 接口 → LAN → 修改 → 基本设置，改成：\n   - IPv4 地址：`192.168.31.2`\n   - IPv4 子网掩码：`255.255.255.0`\n   - IPv4 网关：`192.168.31.1`（你的 BE7200 Pro）\n   - 使用自定义的 DNS 服务器：`192.168.31.1`（先这样，第 9 步会改成 127.0.0.1）\n3. 同一页面下方\"DHCP 服务器\" → 基本设置 → **勾选\"忽略此接口\"**（DHCP 继续由 BE7200 Pro 负责）。\n4. 点\"保存\"，再点\"保存并应用\"。页面会转圈然后断开——**这是正常的**，因为 IP 已经变了。\n5. 现在接线：**AX3600 的 LAN 口** 用网线连到 **BE7200 Pro 的 LAN 口**（AX3600 的 WAN 口永远空着）。\n   电脑的网线也改插到 BE7200 Pro 上（或连 BE7200 Pro 的 WiFi）。\n6. 浏览器打开 `http://192.168.31.2`，能登录就说明旁路由网络通了。\n7. 关 WiFi：网络 → 无线，把 2.4G 和 5G 的两个无线网络都点\"禁用\"（WiFi 交给 BE7200 Pro，AX3600 只当网关）。\n8. 换国内软件源（官方源在国内很慢），SSH 里执行：\n```\ncat /etc/apk/repositories\nsed -i 's|downloads.openwrt.org|mirrors.ustc.edu.cn/openwrt|g' /etc/apk/repositories\ncat /etc/apk/repositories\napk update\n```\n   第二次 `cat` 确认地址已经变成 `mirrors.ustc.edu.cn/openwrt` 开头，`apk update` 不报错即可。\n\n---\n\n## 8. 安装 AdGuardHome（去广告 DNS）\n\n1. SSH 里执行：\n   `apk add adguardhome luci-app-adguardhome`\n   - 如果提示找不到这两个包，停下来告诉我，我给你手动安装官方二进制包的步骤（不需要重来）。\n2. 把 53 端口让给 AdGuardHome（OpenWrt 自带的 dnsmasq 默认占着 53）：\n```\nuci set dhcp.@dnsmasq[0].port='0'\nuci commit dhcp\n/etc/init.d/dnsmasq restart\n/etc/init.d/adguardhome restart\nss -lntp | grep ':53 '\n```\n   最后一条命令应该能看到 `adguardhome` 在监听 53 端口。\n3. 浏览器打开 `http://192.168.31.2:3000` 按向导走：\n   - 网页管理界面端口：3000（默认）\n   - DNS 服务器端口：53（默认）\n   - 设置管理用户名和密码（自己记好）\n   - 上游 DNS 服务器：**先填 `223.5.5.5`**（装完 OpenClash 后再改成 Clash 的 7874 端口，先填个能用的）\n4. 进 AdGuardHome 的\"设置 → DNS 设置\"：Bootstrap DNS 填 `223.5.5.5`，保存。\n\n---\n\n## 9. 安装 OpenClash（代理分流）\n\n### 9.1 下载安装包\n\nOpenClash 的 GitHub Releases 页（仓库 `vernesong/OpenClash`），下载当前最新版 **v0.48.002** 的 apk 包：\n`luci-app-openclash-0.48.002.apk`，大小 **10,702,048 字节**（约 10.21 MiB）。\n（25.12 用 apk 包管理器，`.apk` 和 `.ipk` 别下混。）\n\n### 9.2 安装依赖和主程序\n\n把 apk 传到路由器 `/tmp`（用 scp 或 WinSCP 拖进去），SSH 里执行：\n\n```\napk add dnsmasq-full\napk add bash curl ca-bundle kmod-tun kmod-nft-tproxy\napk add --allow-untrusted /tmp/luci-app-openclash-0.48.002.apk\n```\n\n说明：\n- `dnsmasq-full` 是 OpenClash 安装检查要的完整版 dnsmasq，会替换掉精简版（我们已经把它的 DNS 关了、DHCP 也没开，替换很安全）。\n- `--allow-untrusted` 是因为这个包不是官方源签名的，只对你确认过的文件用。\n- 装完刷新 LuCI，左侧菜单出现\"服务 → OpenClash\"即成功。\n\n### 9.3 下载 Clash 内核\n\n服务 → OpenClash → 全局设置 → 版本更新 → 内核下载：\n- 内核选 **Meta（mihomo）**，架构选 **linux-arm64**（AX3600 是 ARM64），点下载，等待完成。\n- 如果路由器上下载 GitHub 很慢/失败：用电脑从 OpenClash 的 Releases 页下好对应内核文件，\n  通过\"全局设置 → 版本更新 → 上传内核\"传上去也行。\n\n### 9.4 导入订阅并启动\n\n1. 全局设置 → 配置文件订阅 → 新增：粘贴你的机场订阅链接（或你自己的 vless 订阅），保存。\n2. 点\"更新订阅\"，等节点列表出来。\n3. 回到\"运行状态\"/\"配置文件管理\"，选中刚更新的配置文件。\n4. **DNS 设置（关键，决定会不会断网）**：\n   - 本地 DNS 劫持：启用\n   - Fake-IP：启用\n   - NameServer：填 `223.5.5.5`（多个用英文逗号隔开；**千万不要填 127.0.0.1**，否则和 AdGuardHome 互相指形成死循环）\n5. 模式设置：运行模式保持\"规则\"即可，先别开 TUN。\n6. 点\"启动\"。状态页显示运行中即成功。\n\n### 9.5 把 AdGuardHome 的上游接到 Clash\n\n回到 `http://192.168.31.2:3000` → 设置 → DNS 设置：\n- 上游 DNS 服务器改成：`127.0.0.1:7874`（这就是 OpenClash 的 Fake-IP DNS 端口）\n- 保存。\n\n最终 DNS 链路：**设备 → AdGuardHome(:53，去广告) → OpenClash(:7874，按规则分流) → 真实 DNS**。\n代理节点的域名由 Clash 用你填的 223.5.5.5 直接解析，不经过 AdGuardHome，没有循环。\n\n### 9.6 让路由器自身也走这条 DNS\n\n网络 → 接口 → LAN → 修改 → 基本设置 → 自定义 DNS 服务器改成 `127.0.0.1`，保存并应用。\n\n---\n\n## 10. 设备接入 & 验证\n\n1. 在想走软路由的设备上手动设置（以电脑为例）：\n   - IP：192.168.31.x（x 取 100~200 之间没被占用的）\n   - 子网掩码：255.255.255.0\n   - 网关：**192.168.31.2**\n   - DNS：**192.168.31.2**\n2. 验证三件套：\n   - 能正常打开网页 → 旁路由转发通了。\n   - 打开 AdGuardHome 首页（`http://192.168.31.2:3000`），\"查询日志\"里有这台设备的记录，且拦截计数在涨 → 去广告生效。\n   - 在 Clash 里切到\"全局\"模式后访问 `ip.sb`，显示的 IP 变成节点 IP → 代理生效；切回\"规则\"模式，国内网站直连速度正常。\n3. 不想走的设备：什么都不用改，网关/DNS 保持自动（走 BE7200 Pro），完全不受影响。\n\n---\n\n## 11. 回滚与救砖\n\n- **升级 OpenWrt**：去固件选择器下新版 `squashfs-sysupgrade.bin`，LuCI 里系统 → 备份/升级 → 刷写即可（可保留配置）。\n- **过渡阶段起不来（6.2 之后、6.3 之前）**：原厂还完整躺在另一个分区里，\n  断电重启多试几次，bootloader 会按 `flag_last_success` 机制切回原厂分区。\n- **正式装完后回原厂**：用小米官方 **MIWIFIRepairTool** 修复工具——电脑网线直连 AX3600 的 LAN 口，\n  运行工具、选择原厂固件包，工具会通过 TFTP 把官方固件刷回去，恢复出厂状态（小米固件、米家管理都回来）。\n  这是小米官方给的救砖通道，成功率很高，不需要动第 4 步的备份。\n  工具官方直链（979,690 字节的 zip）：`https://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/tools/MIWIFIRepairTool.x86.zip`\n  注意：小米路由器会劫持 `miwifi.com` 域名到本地后台，在家里网络打开小米官网下载页会跳到路由器管理页，\n  属正常现象；上面的 CDN 直链不受劫持影响，可直接下载（或用手机流量打开官网）。\n- **手动 TFTP 救砖**：修复工具不行时，OpenWrt 官方 wiki 有 AX3600 的 debrick 步骤，原理相同、手动操作。\n- 第 4 步备份的 `mtd8-art.bin` 等文件是最后保险，留着别删。\n\n## 12. 日常维护 & 常见问题\n\n- **订阅自动更新**：OpenClash → 全局设置 → 计划任务，打开\"配置文件自动更新\"（每天凌晨一次）。\n- **过滤器更新**：AdGuardHome → 过滤器 → 拦截列表，定期点\"检查更新\"。\n- **装完 Clash 上不了网**：先去 OpenClash 里点\"停止运行\"，看是否恢复；\n  九成是 DNS 环路——检查 NameServer 里有没有 127.0.0.1，有就删掉。\n- **AdGuardHome 的 :3000 打不开**：SSH 里看 `logread | grep -i adguard` 找报错。\n- **53 端口被占**：`ss -lntp | grep ':53 '` 看是谁在监听，应该只有 adguardhome。\n- **部分 UDP 应用（如游戏语音）异常**：试试 OpenClash 里切换到 TUN 模式，或把这台设备网关改回 192.168.31.1 绕开。\n", "file": "03-ax3600-openwrt.md", "cover_key": "ax3600-openwrt"}, {"id": 2, "title": "Harness 到底在干嘛：一句话讲清", "category": "AI 与 Agent", "tags": ["Harness", "Agent", "概念图"], "summary": "一句话：大模型只动嘴，Harness 负责动手、传话、兜底。以“修登录闪退”为例走一遍完整流程。", "pinned": false, "updated": "2026-11-26", "source": "来源：your_files/harness-diagram.md（配套有同名 HTML / PDF / PNG 图）。", "toc": [{"title": "流程（以“修登录闪退”为例）", "label": "流程（以“修登录闪退”为例）", "level": 2, "n": 1}, {"title": "Harness 顺手还管这些（防失控）", "label": "Harness 顺手还管这些（防失控）", "level": 2, "n": 2}, {"title": "分清四个词", "label": "分清四个词", "level": 2, "n": 3}, {"title": "关键纠正", "label": "关键纠正", "level": 2, "n": 4}], "html": "<p>一句话：大模型只动嘴，Harness 负责动手 + 传话 + 兜底<\/p>\n<div class=\"img-note\">🖼 配图：Harness 流程图：大模型只动嘴，Harness 负责动手、传话、兜底（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h2 id=\"sec-1\">流程（以“修登录闪退”为例）<\/h2>\n<pre><code>① 你：说一句话 “修登录闪退”\n        ↓\n② HARNESS · 准备材料\n   把你的话 + 相关文件 + 能用的工具清单，打包好喂给大模型\n   它不思考，只负责“拼材料、递话”\n        ↓\n③ 大模型 · 只动脑、只动嘴\n   决定下一步：“先读登录代码”\n   它自己不会读文件、改代码、跑测试\n        ↓\n④ HARNESS · 动手干活\n   读文件、改一行代码、跑测试\n   再把真实结果贴回去：文件内容 / 测试报错\n        ↓\n   ↺ 循环 ③ → ④，直到大模型说“修好了”\n        ↓\n⑤ 收尾：Harness 停下来，向你汇报改了什么\n<\/code><\/pre>\n<h2 id=\"sec-2\">Harness 顺手还管这些（防失控）<\/h2>\n<ul><li>工具清单：能调哪些工具<\/li><li>上下文：一次喂多少文件<\/li><li>权限：哪些文件能改 / 不能改<\/li><li>上限：试几次就停，不死循环<\/li><li>留记录：每步都记下来给你检查<\/li><li>目标：盯着你的任务不跑偏<\/li><\/ul>\n<h2 id=\"sec-3\">分清四个词<\/h2>\n<ul><li>大模型 = 大脑，只会说话<\/li><li>Harness = 身体 + 管家，动手 + 传话<\/li><li>Agent = 大脑 + 身体 + 一个目标<\/li><li>Codex = 打包好的 Agent：GPT + 自家 Harness + 命令行外壳<\/li><\/ul>\n<h2 id=\"sec-4\">关键纠正<\/h2>\n<p>拆解不是 Codex 在外面先拆，是大模型自己拆；<br />\n循环也不只是“再问一次”，关键是中间 Harness 真的动手改了、跑了。<\/p>", "body": "\n# Harness 到底在干嘛？\n\n一句话：大模型只动嘴，Harness 负责动手 + 传话 + 兜底\n\n![Harness 流程图：大模型只动嘴，Harness 负责动手、传话、兜底](kbimg:harness-diagram.png)\n\n## 流程（以“修登录闪退”为例）\n\n```\n① 你：说一句话 “修登录闪退”\n        ↓\n② HARNESS · 准备材料\n   把你的话 + 相关文件 + 能用的工具清单，打包好喂给大模型\n   它不思考，只负责“拼材料、递话”\n        ↓\n③ 大模型 · 只动脑、只动嘴\n   决定下一步：“先读登录代码”\n   它自己不会读文件、改代码、跑测试\n        ↓\n④ HARNESS · 动手干活\n   读文件、改一行代码、跑测试\n   再把真实结果贴回去：文件内容 / 测试报错\n        ↓\n   ↺ 循环 ③ → ④，直到大模型说“修好了”\n        ↓\n⑤ 收尾：Harness 停下来，向你汇报改了什么\n```\n\n## Harness 顺手还管这些（防失控）\n\n- 工具清单：能调哪些工具\n- 上下文：一次喂多少文件\n- 权限：哪些文件能改 / 不能改\n- 上限：试几次就停，不死循环\n- 留记录：每步都记下来给你检查\n- 目标：盯着你的任务不跑偏\n\n## 分清四个词\n\n- 大模型 = 大脑，只会说话\n- Harness = 身体 + 管家，动手 + 传话\n- Agent = 大脑 + 身体 + 一个目标\n- Codex = 打包好的 Agent：GPT + 自家 Harness + 命令行外壳\n\n## 关键纠正\n\n拆解不是 Codex 在外面先拆，是大模型自己拆；\n循环也不只是“再问一次”，关键是中间 Harness 真的动手改了、跑了。\n", "file": "02-harness-explainer.md", "cover_key": "harness-explainer"}, {"id": 1, "title": "Grok 机器人为什么烧钱：Harness 学习笔记", "category": "AI 与 Agent", "tags": ["Harness", "Agent", "Grok", "多机器人", "成本"], "summary": "读 Iron Giant 长文后自己重写的学习笔记：四层分工、Harness 六个零件、Jev 决策层的成本账、Swarm 规则、三个例子与上线前检查清单。", "pinned": true, "updated": "2026-11-26", "source": "来源：X 长文《Your Grok Bot Is Burning Money - Harness Fixes It》（Iron Giant @irongiantXBT），原文 https://x.com/irongiantXBT/status/2122662343306059780 。笔记正文来自 your_files/Grok-Harness-离线版/Grok-Bot-Harness-学习笔记.md；同目录的概要版 Grok-Bot-Harness.md 与 Grok-Bot-Harness-摘要.md 已并入本条，不单独收录。9 张配图已内嵌于正文，随知识库一同保存，离线可看。", "toc": [{"title": "问题出在哪：一个机器人干所有事", "label": "问题出在哪", "level": 2, "n": 1}, {"title": "四层分工：各干各的", "label": "四层分工", "level": 2, "n": 2}, {"title": "Harness 到底是什么", "label": "Harness 是什么", "level": 2, "n": 3}, {"title": "最烧钱的地方：决策层", "label": "最烧钱的决策层", "level": 2, "n": 4}, {"title": "Swarm 怎么组才不乱", "label": "Swarm 组队规则", "level": 2, "n": 5}, {"title": "全栈对照：谁干什么、跑在哪、花多少钱", "label": "全栈对照表", "level": 2, "n": 6}, {"title": "三个例子：这套东西落到具体活上是什么样", "label": "三个落地例子", "level": 2, "n": 7}, {"title": "例子 1 · 邮箱分流 —— 最适合先做的 Swarm", "label": "例子 1 · 邮箱分流 —— 最适合先做的 Swarm", "level": 3, "n": 8}, {"title": "例子 2 · 内容生产线", "label": "例子 2 · 内容生产线", "level": 3, "n": 9}, {"title": "例子 3 · 代码小组", "label": "例子 3 · 代码小组", "level": 3, "n": 10}, {"title": "上第二个机器人之前，先过一遍清单", "label": "上线前检查清单", "level": 2, "n": 11}, {"title": "三道检查，具体是哪三道", "label": "三道检查，具体是哪三道", "level": 3, "n": 12}, {"title": "我的理解：落地顺序", "label": "我的理解：落地顺序", "level": 2, "n": 13}], "html": "<h2 id=\"sec-1\">问题出在哪：一个机器人干所有事<\/h2>\n<p>很多人的用法是：只开一个 Grok 机器人，让它写东西、选路线、做判断、批申请、还直接跑命令。这样有三个毛病：<\/p>\n<ol><li><strong>慢<\/strong>：每一步都要等大模型用自然语言想一遍。<\/li><li><strong>贵<\/strong>：很多步骤根本不是在写作，而是在做一个小决定，却也要按大模型的价格付费，还带着巨大的上下文。<\/li><li><strong>乱<\/strong>：没有边界，半夜三点也可能自己干出奇怪的事。<\/li><\/ol>\n<p>作者举了一个例子：2026 年 7 月，Cursor 把一份 835 页的新编程语言规范交给一群 Agent，16 天后拿回了一个能用的编译器，中间没有人碰过代码。这说明问题不在模型本身，而在外面的组织方式。<\/p>\n<p>这就引出我们之前聊过的那句话：<strong>Agent = 模型 + Harness<\/strong>。模型一样，Harness 不同，出来的 Agent 就完全不同。<\/p>\n<h2 id=\"sec-2\">四层分工：各干各的<\/h2>\n<p>作者的方案是把工作拆成四层：<\/p>\n<ul><li>LAYER 01 · WRITES<br />\n  <strong>Grok 负责写<\/strong>：写代码、写草稿、做规划，这是它最擅长的事。<\/li><li>LAYER 02 · DECIDES<br />\n  <strong>Jev 负责决定<\/strong>：选哪个、打几分、行不行，只做判断，不写长文。<\/li><li>LAYER 03 · ENFORCES<br />\n  <strong>Harness 负责管规矩<\/strong>：定流程、卡边界、留记录。<\/li><li>LAYER 04 · SCALES<br />\n  <strong>Swarm 负责扩展<\/strong>：人手不够时加人，而不是让一个人加班。<\/li><\/ul>\n<div class=\"img-note\">🖼 配图：图 1 · 四层 Agent 结构：请求从上进，交付从下出（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<p>这个分法的好处是：贵的模型只留在真正需要它动脑的地方，小决定不再按大模型的价格结算。<\/p>\n<h2 id=\"sec-3\">Harness 到底是什么<\/h2>\n<p>Harness 不是模型，而是模型外面那一圈东西：让它循环跑起来的流程、它能碰的工具、它不能破的规则、它留下的文件。作者认为一个能用的 Harness 要有六个零件：<\/p>\n<ol><li><strong>一个只管分派的主管<\/strong>：负责接需求、拆任务、盯进度，自己不动手执行。<\/li><li><strong>每个机器人一份职责说明<\/strong>：写清楚它负责什么结果、能信哪些来源、用什么标准判断好坏、最后交什么文件、绝对不能碰什么。<\/li><li><strong>一个共享工作区<\/strong>：用文件而不是聊天记录来传活，这样换人、换机器人，上下文也不会丢。能长期留的文件放工作区，临时的放临时目录。<\/li><li><strong>三道检查<\/strong>：来源、证据、行动，第 8 节会细说。<\/li><li><strong>每次任务结束留一份交接单<\/strong>：做了什么、改了哪些文件、有什么证据证明、还剩什么、谁负责。<\/li><li><strong>一本你自己掌控的行动账本<\/strong>：所有落地的操作都记下来，方便回头查。<\/li><\/ol>\n<div class=\"img-note\">🖼 配图：图 2 · PART 1 配图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<p>主管的工作方式大概是这样：收到需求先分类，再选对口的专业机器人，把任务写成文件交给它，等它交回交接单，再把成果汇总成三行摘要给你。只有涉及钱、发布、删除、签名这类不可逆的事，才直接找你。<\/p>\n<h2 id=\"sec-4\">最烧钱的地方：决策层<\/h2>\n<p>这是全文最关键的发现：Agent 循环里的大多数步骤，其实不是在写东西，而是在做决定。<\/p>\n<p>比如：该读哪几个文件？该用便宜模型还是贵模型？这条命令安不安全？做完了吗？这段工具输出要留还是扔？以前这些决定都交给同一个贵模型，用自然语言回答，带着全量上下文，价格自然高。<\/p>\n<p>Jev 是 Typesafe AI 的一个专用决策模型，思路完全不同：你把当前状态和几个结构化问题发过去，它直接返回结构化答案，不写散文。问题基本就三种：<\/p>\n<ul><li><strong>选一个<\/strong>：分给哪个组、走哪条路线、用哪个档位。<\/li><li><strong>打个分<\/strong>：按质量、风险、紧急程度给 1 到 5 分。<\/li><li><strong>是或否<\/strong>：返回 0 到 1 的概率，比如「能安全发送吗」，0.12 就表示大概率不行。<\/li><\/ul>\n<p>价格和速度，原文给的数字是：输入每百万 token <strong>0.042 美元<\/strong>，输出免费，端到端延迟 <strong>70 到 500 毫秒<\/strong>。<\/p>\n<pre><code class=\"language-bill\">算一笔账：一次路由决定\n输入 2,000 token、输出 150 token\nGrok 4.7|$0.0049|输入 $2 / 百万 · 输出 $6 / 百万\n58×\nJev|$0.000084|输入 $0.042 / 百万 · 输出免费\n每天 1 万次这样的决定：约 $49 对 $0.84\n<\/code><\/pre>\n<div class=\"img-note\">🖼 配图：图 3 · PART 2 配图（上）（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<div class=\"img-note\">🖼 配图：图 4 · PART 2 配图（下）（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<p>作者建议先把五类决定挪过去：<strong>选文件、选模型、判断能不能跑、判断做没做完、判断工具输出留不留<\/strong>。做法是给 Grok 机器人加一条新习惯：凡是遇到选、评分、是或否，先问 Jev，按结构化答案行动；只有 Jev 没把握、或者决定不可逆时，才升级回 Grok 4.7。<\/p>\n<p>这和我们之前说的 Harness 思路是一致的：大模型动嘴做判断，Harness 负责把判断变成一次便宜、结构化的调用，再把结果传回去。<\/p>\n<h2 id=\"sec-5\">Swarm 怎么组才不乱<\/h2>\n<p>Swarm 不是机器人越多越好，拓扑其实很简单：一个主管，几个专业小组，共用一条总线和一个工作区。SpaceX AI 的人也是这么描述他们自己的系统的。作者给了五条组队规则：<\/p>\n<ol><li><strong>按瓶颈招人，不按应用招人<\/strong>：不要搞「邮箱机器人」「浏览器机器人」，要看哪里卡住了，再补一个专门解决那个瓶颈的机器人。<\/li><li><strong>先从主管加一个专家开始<\/strong>：只有活真的排队等了，才加下一个。<\/li><li><strong>小组之间用文件加一个线程沟通<\/strong>：不要拉长聊天，任务和结果都落在工作区里。<\/li><li><strong>写代码交给隔离环境的云端 Agent<\/strong>：Grok 机器人只负责把关结果，不直接在本地乱改。<\/li><li><strong>最后由一个中立的合并机器人统一落地<\/strong>：它不写功能，只检查交接单在不在、测试过没过、有没有不可逆操作混进来，通过了才合入，缺东西就打回去，并把每次落地记到行动账本里。<\/li><\/ol>\n<div class=\"img-note\">🖼 配图：图 5 · PART 3 配图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<p>一个账号最多可以有 50 个机器人加群聊，作者的意思是：你根本用不了那么多，先少后多。<\/p>\n<h2 id=\"sec-6\">全栈对照：谁干什么、跑在哪、花多少钱<\/h2>\n<table><thead><tr><th>层<\/th><th>干什么<\/th><th>跑在什么上<\/th><th>花你什么<\/th><\/tr><\/thead><tbody><tr><td>Grok<\/td><td>写代码、写草稿、做规划<\/td><td>Grok 4.7<\/td><td>输入 $2 / 百万，输出 $6 / 百万<\/td><\/tr><tr><td>Jev<\/td><td>路由、打分、说是或否<\/td><td>Jev 1.13.0<\/td><td>输入 $0.042 / 百万，输出免费<\/td><\/tr><tr><td>Harness<\/td><td>职责说明、检查、交接、记账<\/td><td>工作区 + 技能<\/td><td>你一次性的搭建时间<\/td><\/tr><tr><td>Swarm<\/td><td>并行的专家小组 + 合并<\/td><td>Grok 机器人 + 云端代码 Agent<\/td><td>机器人越多 token 越多，所以要慢慢加<\/td><\/tr><\/tbody><\/table>\n<blockquote><p>贵的模型还在环里，只是不再为每一个小决定付费了。<\/p><\/blockquote>\n<div class=\"img-note\">🖼 配图：图 6 · PART 4 配图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h2 id=\"sec-7\">三个例子：这套东西落到具体活上是什么样<\/h2>\n<h3 id=\"sec-8\">例子 1 · 邮箱分流 —— 最适合先做的 Swarm<\/h3>\n<ol><li>收件机器人每小时读一次新邮件。<\/li><li>每封邮件问 Jev 三个问题：分给哪个组、紧急程度 1 到 5 分、要不要先找人再动手。<\/li><li>只有紧急程度不高、且「需要人」的概率很低时，才由回复机器人起草回复。<\/li><li>其余的都连同草稿一起放进待审批区。<\/li><li>主管每天 9 点和 17 点各给你发一次汇总。<\/li><\/ol>\n<p>这个例子好在：判断全是结构化的，风险可控，而且省下的全是重复劳动。<\/p>\n<div class=\"img-note\">🖼 配图：图 7 · PART 5 配图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h3 id=\"sec-9\">例子 2 · 内容生产线<\/h3>\n<ul><li>研究机器人只负责把可信来源收集到研究目录。<\/li><li>写作机器人只能根据这些来源写，不能自己编。<\/li><li>每篇草稿都交给 Jev，从清晰度、证据、钩子三个维度打分。<\/li><li>低于 4 分的打回一次，并指明最弱的一项和一个改法。<\/li><li>两次不过就连同分数一起交给你，永远不自动发布。<\/li><\/ul>\n<p>关键点是：质量判断也结构化了，改稿有明确依据，而不是「感觉不好，重写一遍」。<\/p>\n<h3 id=\"sec-10\">例子 3 · 代码小组<\/h3>\n<ul><li>Grok 机器人当技术负责人，先把工单拆成能单独测试的小单元。<\/li><li>每个单元派一个云端代码 Agent，范围、验收标准、不做什么是先写好的，两个 Agent 不碰同一批文件。<\/li><li>每个 Agent 跑命令之前，先问 Jev：这条命令会不会删东西、覆盖数据？概率超过阈值就停下来问你。<\/li><li>合并机器人负责合入，你只批不可逆的操作。<\/li><\/ul>\n<p>这个例子把「快」和「稳」分开了：并行是快，检查是稳。<\/p>\n<h2 id=\"sec-11\">上第二个机器人之前，先过一遍清单<\/h2>\n<ul><li>主管先存在，专家后加。<\/li><li>每个机器人都有五项职责说明。<\/li><li>工作区里有研究、草稿、证据、审批、交接这几类目录。<\/li><li>决定走 Jev，写作走 Grok。<\/li><li>每个对外动作都有三道检查。<\/li><li>只有一个合并机器人、一本行动账本。<\/li><li>默认安静，只在出异常时通知你。<\/li><\/ul>\n<h3 id=\"sec-12\">三道检查，具体是哪三道<\/h3>\n<ul><li><strong>来源检查<\/strong>：输入只认你信任的来源，其他的都当作不可信文本，永远不当成指令。<\/li><li><strong>证据检查<\/strong>：在下结论或发送之前，先引用它来自哪个文件或链接。<\/li><li><strong>行动检查<\/strong>：在发送、删除、发布、付款这类不可逆操作之前，先停下来问你。检查失败就写进决策记录，然后停下。<\/li><\/ul>\n<p>每周再做一次复盘：看看 Jev 做了哪些决定、有没有错的，哪些检查被触发了、为什么，Grok 和 Jev 各花了多少钱，下一周先修哪一个瓶颈。复盘不用长，控制在 20 行以内。<\/p>\n<div class=\"img-note\">🖼 配图：图 8 · PART 6 配图（原图随知识库保存，此线上版以文字标注位置）<\/div>\n<h2 id=\"sec-13\">我的理解：落地顺序<\/h2>\n<p>按作者的顺序，也是我觉得最稳的顺序：<\/p>\n<p>主管 → 职责说明 → 工作区 → 三道检查 → Jev → 再加第二个机器人<\/p>\n<p>不要一上来就搭十个机器人。先让主管加一个专家跑通一个小闭环，比如邮箱分流，跑顺了再加内容或代码。<\/p>\n<p>这和我们之前定下来的 Agent 结构完全对得上：模型只负责动嘴和拆解，Harness 负责准备材料、动手执行、传结果、管循环和权限，MCP 是 Harness 对外借本事的一种插口。Jev 在这里就是 Harness 里一个便宜的决策插口，Grok 是贵的写作插口，两个插口分工不同，Harness 负责在中间选对插口、用对价格。<\/p>\n<blockquote><p>这套东西省的是重复决策的钱，不是让你把所有决定都外包出去。不可逆的事，永远要留一个人工确认的口子。<\/p><\/blockquote>", "body": "\n# Grok 机器人为什么烧钱：Harness 学习笔记\n\n## 问题出在哪：一个机器人干所有事 <!-- toc: 问题出在哪 -->\n\n<!-- lead -->\n很多人的用法是：只开一个 Grok 机器人，让它写东西、选路线、做判断、批申请、还直接跑命令。这样有三个毛病：\n\n1. **慢**：每一步都要等大模型用自然语言想一遍。\n2. **贵**：很多步骤根本不是在写作，而是在做一个小决定，却也要按大模型的价格付费，还带着巨大的上下文。\n3. **乱**：没有边界，半夜三点也可能自己干出奇怪的事。\n\n作者举了一个例子：2026 年 7 月，Cursor 把一份 835 页的新编程语言规范交给一群 Agent，16 天后拿回了一个能用的编译器，中间没有人碰过代码。这说明问题不在模型本身，而在外面的组织方式。\n\n这就引出我们之前聊过的那句话：**Agent = 模型 + Harness**。模型一样，Harness 不同，出来的 Agent 就完全不同。\n\n## 四层分工：各干各的 <!-- toc: 四层分工 -->\n\n作者的方案是把工作拆成四层：\n\n- LAYER 01 · WRITES\n  **Grok 负责写**：写代码、写草稿、做规划，这是它最擅长的事。\n- LAYER 02 · DECIDES\n  **Jev 负责决定**：选哪个、打几分、行不行，只做判断，不写长文。\n- LAYER 03 · ENFORCES\n  **Harness 负责管规矩**：定流程、卡边界、留记录。\n- LAYER 04 · SCALES\n  **Swarm 负责扩展**：人手不够时加人，而不是让一个人加班。\n\n![图 1 · 四层 Agent 结构：请求从上进，交付从下出](kbimg:02-layers.jpg)\n\n这个分法的好处是：贵的模型只留在真正需要它动脑的地方，小决定不再按大模型的价格结算。\n\n## Harness 到底是什么 <!-- toc: Harness 是什么 -->\n\nHarness 不是模型，而是模型外面那一圈东西：让它循环跑起来的流程、它能碰的工具、它不能破的规则、它留下的文件。作者认为一个能用的 Harness 要有六个零件：\n\n1. **一个只管分派的主管**：负责接需求、拆任务、盯进度，自己不动手执行。\n2. **每个机器人一份职责说明**：写清楚它负责什么结果、能信哪些来源、用什么标准判断好坏、最后交什么文件、绝对不能碰什么。\n3. **一个共享工作区**：用文件而不是聊天记录来传活，这样换人、换机器人，上下文也不会丢。能长期留的文件放工作区，临时的放临时目录。\n4. **三道检查**：来源、证据、行动，第 8 节会细说。\n5. **每次任务结束留一份交接单**：做了什么、改了哪些文件、有什么证据证明、还剩什么、谁负责。\n6. **一本你自己掌控的行动账本**：所有落地的操作都记下来，方便回头查。\n\n![图 2 · PART 1 配图](kbimg:03-part1.jpg)\n\n主管的工作方式大概是这样：收到需求先分类，再选对口的专业机器人，把任务写成文件交给它，等它交回交接单，再把成果汇总成三行摘要给你。只有涉及钱、发布、删除、签名这类不可逆的事，才直接找你。\n\n## 最烧钱的地方：决策层 <!-- toc: 最烧钱的决策层 -->\n\n<!-- lead -->\n这是全文最关键的发现：Agent 循环里的大多数步骤，其实不是在写东西，而是在做决定。\n\n比如：该读哪几个文件？该用便宜模型还是贵模型？这条命令安不安全？做完了吗？这段工具输出要留还是扔？以前这些决定都交给同一个贵模型，用自然语言回答，带着全量上下文，价格自然高。\n\nJev 是 Typesafe AI 的一个专用决策模型，思路完全不同：你把当前状态和几个结构化问题发过去，它直接返回结构化答案，不写散文。问题基本就三种：\n\n- **选一个**：分给哪个组、走哪条路线、用哪个档位。\n- **打个分**：按质量、风险、紧急程度给 1 到 5 分。\n- **是或否**：返回 0 到 1 的概率，比如「能安全发送吗」，0.12 就表示大概率不行。\n\n价格和速度，原文给的数字是：输入每百万 token **0.042 美元**，输出免费，端到端延迟 **70 到 500 毫秒**。\n\n```bill\n算一笔账：一次路由决定\n输入 2,000 token、输出 150 token\nGrok 4.7|$0.0049|输入 $2 / 百万 · 输出 $6 / 百万\n58×\nJev|$0.000084|输入 $0.042 / 百万 · 输出免费\n每天 1 万次这样的决定：约 $49 对 $0.84\n```\n\n![图 3 · PART 2 配图（上）](kbimg:04-part2a.jpg)\n\n![图 4 · PART 2 配图（下）](kbimg:05-part2b.jpg)\n\n作者建议先把五类决定挪过去：**选文件、选模型、判断能不能跑、判断做没做完、判断工具输出留不留**。做法是给 Grok 机器人加一条新习惯：凡是遇到选、评分、是或否，先问 Jev，按结构化答案行动；只有 Jev 没把握、或者决定不可逆时，才升级回 Grok 4.7。\n\n这和我们之前说的 Harness 思路是一致的：大模型动嘴做判断，Harness 负责把判断变成一次便宜、结构化的调用，再把结果传回去。\n\n## Swarm 怎么组才不乱 <!-- toc: Swarm 组队规则 -->\n\nSwarm 不是机器人越多越好，拓扑其实很简单：一个主管，几个专业小组，共用一条总线和一个工作区。SpaceX AI 的人也是这么描述他们自己的系统的。作者给了五条组队规则：\n\n1. **按瓶颈招人，不按应用招人**：不要搞「邮箱机器人」「浏览器机器人」，要看哪里卡住了，再补一个专门解决那个瓶颈的机器人。\n2. **先从主管加一个专家开始**：只有活真的排队等了，才加下一个。\n3. **小组之间用文件加一个线程沟通**：不要拉长聊天，任务和结果都落在工作区里。\n4. **写代码交给隔离环境的云端 Agent**：Grok 机器人只负责把关结果，不直接在本地乱改。\n5. **最后由一个中立的合并机器人统一落地**：它不写功能，只检查交接单在不在、测试过没过、有没有不可逆操作混进来，通过了才合入，缺东西就打回去，并把每次落地记到行动账本里。\n\n![图 5 · PART 3 配图](kbimg:06-part3.jpg)\n\n一个账号最多可以有 50 个机器人加群聊，作者的意思是：你根本用不了那么多，先少后多。\n\n## 全栈对照：谁干什么、跑在哪、花多少钱 <!-- toc: 全栈对照表 -->\n\n| 层 | 干什么 | 跑在什么上 | 花你什么 |\n|---|---|---|---|\n| Grok | 写代码、写草稿、做规划 | Grok 4.7 | 输入 $2 / 百万，输出 $6 / 百万 |\n| Jev | 路由、打分、说是或否 | Jev 1.13.0 | 输入 $0.042 / 百万，输出免费 |\n| Harness | 职责说明、检查、交接、记账 | 工作区 + 技能 | 你一次性的搭建时间 |\n| Swarm | 并行的专家小组 + 合并 | Grok 机器人 + 云端代码 Agent | 机器人越多 token 越多，所以要慢慢加 |\n\n> 贵的模型还在环里，只是不再为每一个小决定付费了。\n\n![图 6 · PART 4 配图](kbimg:07-part4.jpg)\n\n## 三个例子：这套东西落到具体活上是什么样 <!-- toc: 三个落地例子 -->\n\n### 例子 1 · 邮箱分流 —— 最适合先做的 Swarm\n\n1. 收件机器人每小时读一次新邮件。\n2. 每封邮件问 Jev 三个问题：分给哪个组、紧急程度 1 到 5 分、要不要先找人再动手。\n3. 只有紧急程度不高、且「需要人」的概率很低时，才由回复机器人起草回复。\n4. 其余的都连同草稿一起放进待审批区。\n5. 主管每天 9 点和 17 点各给你发一次汇总。\n\n这个例子好在：判断全是结构化的，风险可控，而且省下的全是重复劳动。\n\n![图 7 · PART 5 配图](kbimg:08-part5.jpg)\n\n### 例子 2 · 内容生产线\n\n- 研究机器人只负责把可信来源收集到研究目录。\n- 写作机器人只能根据这些来源写，不能自己编。\n- 每篇草稿都交给 Jev，从清晰度、证据、钩子三个维度打分。\n- 低于 4 分的打回一次，并指明最弱的一项和一个改法。\n- 两次不过就连同分数一起交给你，永远不自动发布。\n\n关键点是：质量判断也结构化了，改稿有明确依据，而不是「感觉不好，重写一遍」。\n\n### 例子 3 · 代码小组\n\n- Grok 机器人当技术负责人，先把工单拆成能单独测试的小单元。\n- 每个单元派一个云端代码 Agent，范围、验收标准、不做什么是先写好的，两个 Agent 不碰同一批文件。\n- 每个 Agent 跑命令之前，先问 Jev：这条命令会不会删东西、覆盖数据？概率超过阈值就停下来问你。\n- 合并机器人负责合入，你只批不可逆的操作。\n\n这个例子把「快」和「稳」分开了：并行是快，检查是稳。\n\n## 上第二个机器人之前，先过一遍清单 <!-- toc: 上线前检查清单 -->\n\n- 主管先存在，专家后加。\n- 每个机器人都有五项职责说明。\n- 工作区里有研究、草稿、证据、审批、交接这几类目录。\n- 决定走 Jev，写作走 Grok。\n- 每个对外动作都有三道检查。\n- 只有一个合并机器人、一本行动账本。\n- 默认安静，只在出异常时通知你。\n\n### 三道检查，具体是哪三道\n\n- **来源检查**：输入只认你信任的来源，其他的都当作不可信文本，永远不当成指令。\n- **证据检查**：在下结论或发送之前，先引用它来自哪个文件或链接。\n- **行动检查**：在发送、删除、发布、付款这类不可逆操作之前，先停下来问你。检查失败就写进决策记录，然后停下。\n\n每周再做一次复盘：看看 Jev 做了哪些决定、有没有错的，哪些检查被触发了、为什么，Grok 和 Jev 各花了多少钱，下一周先修哪一个瓶颈。复盘不用长，控制在 20 行以内。\n\n![图 8 · PART 6 配图](kbimg:09-part6.jpg)\n\n## 我的理解：落地顺序 <!-- toc: 我的理解：落地顺序 -->\n\n按作者的顺序，也是我觉得最稳的顺序：\n\n主管 → 职责说明 → 工作区 → 三道检查 → Jev → 再加第二个机器人\n\n不要一上来就搭十个机器人。先让主管加一个专家跑通一个小闭环，比如邮箱分流，跑顺了再加内容或代码。\n\n这和我们之前定下来的 Agent 结构完全对得上：模型只负责动嘴和拆解，Harness 负责准备材料、动手执行、传结果、管循环和权限，MCP 是 Harness 对外借本事的一种插口。Jev 在这里就是 Harness 里一个便宜的决策插口，Grok 是贵的写作插口，两个插口分工不同，Harness 负责在中间选对插口、用对价格。\n\n> 这套东西省的是重复决策的钱，不是让你把所有决定都外包出去。不可逆的事，永远要留一个人工确认的口子。\n", "file": "01-grok-harness.md", "cover_key": "grok-harness"}], "covers": {"17": "/assets/images/gemini-neon-cover.jpg", "16": "/assets/images/offline-docs.webp", "15": "/assets/images/codex-windows.jpg", "14": "/assets/images/lather-lore.jpg", "13": "/assets/images/redpocket-esim.jpg", "12": "/assets/images/railway-xray.jpg", "11": "/assets/images/ct8-xray.jpg", "10": "/assets/images/cloady-xray.jpg", "9": "/assets/images/residential-proxy.jpg", "8": "/assets/images/claude-account.jpg", "7": "/assets/images/ax3600-leak.jpg", "6": "/assets/images/nuannuan-capybara.jpg", "5": "/assets/images/kaiti-cards.jpg", "4": "/assets/images/xiaohongshu-kaiti.jpg", "3": "/assets/images/ax3600-openwrt.jpg", "2": "/assets/images/harness-explainer.jpg", "1": "/assets/images/grok-harness.jpg"}, "bodyimgs": {"17": ["/assets/images/gemini-neon-architecture.jpg", "/assets/images/gemini-neon-s01.jpg", "/assets/images/gemini-neon-s02.png", "/assets/images/gemini-neon-s03.jpg", "/assets/images/gemini-neon-s04.jpg", "/assets/images/gemini-neon-s05.jpg", "/assets/images/gemini-neon-s06.jpg", "/assets/images/gemini-neon-s07.jpg", "/assets/images/gemini-neon-s08.jpg", "/assets/images/gemini-neon-s09.png"], "2": ["/assets/images/harness-diagram.png"], "1": ["/assets/images/02-layers.jpg", "/assets/images/03-part1.jpg", "/assets/images/04-part2a.jpg", "/assets/images/05-part2b.jpg", "/assets/images/06-part3.jpg", "/assets/images/07-part4.jpg", "/assets/images/08-part5.jpg", "/assets/images/09-part6.jpg"]}, "captions": {"1": "原文封面 —— 每天 1 万次决策，成本从 $49/天 掉到 $0.84/天，分界点就是「HARNESS ON」", "2": "模型只动嘴，动手、传话、兜底的那一圈机器就是 Harness", "3": "主路由加旁路由：两台机器分工，全屋流量各走各的路", "4": "开题三段写对齐，图文稿才立得住", "5": "表格拆成三张竖版卡片，手机上字才不糊", "6": "暖暖豚：大眼睛、粉腮红、长方形大鼻头、奶茶色", "7": "链路要先过盾墙这一关：堵住泄漏，核心崩了就全网断流", "8": "账号、出口、付款方式对齐，才敢长期用", "9": "一跳一跳接力，最后落在真实住宅出口", "10": "云上的集装箱只留一条出站：经网关走，不直连", "11": "免费主机靠定时任务保活，到期前记得续", "12": "一条线分四岔，四个地区各落一个节点", "13": "一张 eSIM 跨洋漫游，验证码和通话都得实测", "14": "手工皂摆上桌，网站就是店面", "15": "终端里装好、登录跑通，CLI 才算落地", "16": "把散落的资料整理成能走通的流程，收进知识库随时调用", "17": "一个总协调加一群专职队员：Neon 当队长，不是当聊天窗口"}, "categories": ["AI 与 Agent", "创作与内容", "网站与项目", "账号与服务", "节点与代理", "网络与路由"]}</script>

<script>/* Atlas client runtime — port of the Space Atlas v10 build.
 *
 * The generated pages are the v10 single-page app: the same CSS, the
 * same markup, the same render logic as the Space. Articles are baked
 * into each page as JSON (#atlas-data); covers and body images are
 * local files under /assets/images/ (no base64, no Google Fonts).
 *
 * Pages:
 *   index.html           home SPA (hash routing #/ and #/a/<id>)
 *   articles/<id>.html   static detail page (renders that article)
 *   articles/view.html   viewer for browser-added articles (?id=)
 *
 * Add / Edit / Delete live in localStorage under "atlas_overrides"
 * and are applied on top of the built-in articles. Nothing leaves
 * the browser on its own. atlasExportChanges() (console-only) downloads
 * the changed Markdown files, which then go into articles/, are
 * rebuilt and pushed to GitHub.
 */
(function () {
  "use strict";

  /* ---------- data (baked in by scripts/build.py) ---------- */
  var DATA = null;
  try {
    var el = document.getElementById("atlas-data");
    DATA = el ? JSON.parse(el.textContent) : { articles: [], covers: {}, bodyimgs: {}, captions: {} };
  } catch (e) { DATA = { articles: [], covers: {}, bodyimgs: {}, captions: {} }; }
  var ARTICLES = DATA.articles || [];
  var COVERS = DATA.covers || {};       // id -> "/assets/images/<cover file>"
  var BODYIMGS = DATA.bodyimgs || {};   // id -> ["/assets/images/<file>", ...]
  var CAPTIONS = DATA.captions || {};   // id -> cover caption
  var CATORDER = [];
  ARTICLES.forEach(function (a) { if (CATORDER.indexOf(a.category) < 0) CATORDER.push(a.category); });

  var app = document.getElementById('app');
  var progressEl = document.getElementById('progress');
  var toTop = document.getElementById('toTop');
  var scrollCtx = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function byId(id) { for (var i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].id === id) return ARTICLES[i]; return null; }
  function fmtDate(iso) { var d = new Date(String(iso).slice(0, 10) + 'T00:00:00'); if (isNaN(d.getTime())) return ''; return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }); }
  function stripHtml(html) { var d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
  function siteFooter() {
    return '<footer class="site-foot"><div class="site-foot-in">'
      + '<p class="site-foot-copy">© 2026 Atlas · Paul Mack</p>'
      + '<nav class="site-foot-links" aria-label="其他站点">'
      + '<a href="https://github.com/furlenmick/atlas" target="_blank" rel="noopener noreferrer">GitHub</a>'
      + '<span class="site-foot-sep" aria-hidden="true">·</span>'
      + '<a href="https://yanchs.com" target="_blank" rel="noopener noreferrer">Lather &amp; Lore</a>'
      + '</nav>'
      + '</div></footer>';
  }
  function pageScroller(from) {
    var el = from || document.querySelector('[data-hatch-space-root]') || document.body;
    while (el && el !== document.documentElement) {
      if (el.scrollHeight > el.clientHeight + 1) {
        var oy = getComputedStyle(el).overflowY;
        if (oy === 'auto' || oy === 'scroll' || oy === 'overlay') return el;
      }
      el = el.parentElement;
    }
    return document.documentElement;
  }

  /* ------------------------------- Home ------------------------------- */
  var homeState = { q: '', cat: null, page: 1 };
  var PAGE_SIZE = 20;
  var homeTimer = null;

  function articleMatches(a, q) {
    var hay = (a.title + ' ' + a.summary + ' ' + a.category + ' ' + a.tags.join(' ') + ' ' + (a._text || '')).toLowerCase();
    return hay.indexOf(q) >= 0;
  }
  function renderHome() {
    scrollCtx = null;
    // Homepage has no scroll progress bar (detail pages keep theirs).
    stopProgressLoop();
    if (progressEl) progressEl.style.display = 'none';
    var html = '<div class="home-top"><div class="home-hero" id="homeHero"><h1>Atlas</h1><p class="tagline">我的个人知识库 — 流程、工具和踩过的坑，都沉淀在这里。</p><div class="rule" aria-hidden="true"></div></div></div>'
      + '<header class="home-head"><div class="home-head-in"><div class="search-row">'
      + '<div class="search-wrap"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>'
      + '<label class="sr" for="kb-search" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">搜索知识库</label>'
      + '<input id="kb-search" type="search" placeholder="搜关键词：流程、工具、踩过的坑…" autocomplete="off" value="' + esc(homeState.q) + '" /></div>'
      + '<div class="home-actions"><button type="button" class="btn btn-primary" id="addBtn">＋ 新增文章</button>'
      + '<span id="atlasPending" class="pending-note" hidden></span></div>'
      + '</div></div></header>'
      + '<main class="home-main" id="homeMain"></main>'
      + siteFooter();
    app.innerHTML = html;
    var inp = document.getElementById('kb-search');
    inp.addEventListener('input', function () {
      var v = inp.value;
      clearTimeout(homeTimer);

  function pickCategory(name) {

  /* ------------------------------- Article body transforms ----------------
     The stored bodies are plain rendered markdown; the original knowledge
     base renders the same markdown through component rules (numbered point
     cards, layer card grids, check lists, gate cards, trio cells, step
     pills, the bill card, example cards). These transforms re-apply those
     exact rules to the stored HTML so the page matches the original. */
  var TAG_LINE = /^[A-Z0-9][A-Z0-9 ·-]*$/;
  function leadInfo(li) {
    // Returns {tag, leadEl, leadText} when the item opens with a bold lead
    // followed by a colon, honouring an ALL-CAPS eyebrow line above it.
    var nodes = Array.prototype.slice.call(li.childNodes);
    var i = 0;
    while (i < nodes.length && nodes[i].nodeType === 3 && nodes[i].textContent.trim() === '') i++;
    var tag = '';
    if (i < nodes.length && nodes[i].nodeType === 3 && TAG_LINE.test(nodes[i].textContent.trim())) {
      var j = i + 1;
      if (j < nodes.length && nodes[j].nodeName === 'BR') {
        var k = j + 1;
        while (k < nodes.length && nodes[k].nodeType === 3 && nodes[k].textContent.trim() === '') k++;
        if (k < nodes.length && nodes[k].nodeName === 'STRONG') { tag = nodes[i].textContent.trim(); i = k; }
      }
    }
    if (i < nodes.length && nodes[i].nodeName === 'STRONG') {
      var strong = nodes[i];
      var after = nodes[i + 1];
      if (after && after.nodeType === 3 && /^\s*[：:]/.test(after.textContent)) {
        return { tag: tag, leadEl: strong, leadText: strong.textContent.trim() };
      }
    }
    return null;
  }
  function restructureLead(li, info) {
    var strong = info.leadEl;
    var rest = document.createElement('span'); rest.className = 'kb-rest';
    var node = strong.nextSibling;
    var first = true;
    while (node) {
      var next = node.nextSibling;
      if (first && node.nodeType === 3) { node.textContent = node.textContent.replace(/^\s*[：:]\s*/, ''); }
      first = false;
      rest.appendChild(node);
      node = next;
    }
    // Drop the eyebrow line nodes (text + <br>) that preceded the lead.
    while (li.firstChild && li.firstChild !== strong) li.removeChild(li.firstChild);
    li.removeChild(strong);
    var lead = document.createElement('strong'); lead.className = 'kb-lead'; lead.textContent = info.leadText;
    if (info.tag) { var tg = document.createElement('span'); tg.className = 'kb-tag'; tg.textContent = info.tag; li.appendChild(tg); }
    li.appendChild(lead);
    li.appendChild(rest);
  }
  function classifyList(list, inExample) {
    var items = Array.prototype.slice.call(list.children).filter(function (el) { return el.nodeName === 'LI'; });
    if (!items.length) return;
    var ordered = list.nodeName === 'OL';
    var flat = items.every(function (li) { return !li.querySelector('ul,ol'); });
    var infos = items.map(leadInfo);
    var allLead = flat && infos.every(function (x) { return !!x; });
    var allGates = allLead && infos.every(function (x) { return /检查$/.test(x.leadText); });
    var allShortLeads = allLead && infos.every(function (x) { return x.leadText.length <= 4; });
    var allShortPlain = flat && items.length >= 3 && items.every(function (li) {
      return !li.querySelector('strong,b,a,code') && (li.textContent || '').trim().length <= 42;
    });
    var variant = null;
    if (inExample) variant = ordered ? 'flow' : null;
    else if (ordered && allLead) variant = 'points';
    else if (ordered) variant = 'flow';
    else if (!ordered && allGates) variant = 'gates';
    else if (!ordered && items.length === 3 && allShortLeads) variant = 'trio';
    else if (!ordered && allLead && items.length <= 6) variant = 'cards';
    else if (!ordered && allShortPlain) variant = 'checks';
    if (!variant) return;
    list.classList.add('kb-' + variant);
    if (variant === 'cards') list.setAttribute('data-count', String(Math.min(items.length, 4)));
    if (variant === 'points' || variant === 'cards' || variant === 'trio' || variant === 'gates') {
      items.forEach(function (li, i) { restructureLead(li, infos[i]); });
    }
    if (variant === 'checks') {
      items.forEach(function (li) {
        var box = document.createElement('span'); box.className = 'kb-box'; box.setAttribute('aria-hidden', 'true');
        box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
        li.insertBefore(box, li.firstChild);
      });
    }
  }
  function transformBody(root, article) {
    // Section number badges come from the CSS counter in the original.
    Array.prototype.forEach.call(root.querySelectorAll('h2 .sec-num'), function (s) { s.remove(); });
    // Tables: phone layout labels from the header row.
    Array.prototype.forEach.call(root.querySelectorAll('table'), function (t) {
      var heads = Array.prototype.map.call(t.querySelectorAll('thead th'), function (th) { return th.textContent.trim(); });
      Array.prototype.forEach.call(t.querySelectorAll('tbody tr'), function (tr) {
        Array.prototype.forEach.call(tr.children, function (td, ci) {
          if (ci > 0 && heads[ci]) td.setAttribute('data-k', heads[ci]);
        });
      });
    });
    // ```bill fence → the cost-comparison card.
    Array.prototype.forEach.call(root.querySelectorAll('pre'), function (pre) {
      var code = pre.querySelector('code.language-bill');
      if (!code) return;
      var rows = code.textContent.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      if (rows.length < 5) return;
      var lp = rows[2].split('|').map(function (s) { return s.trim(); });
      var rp = rows[4].split('|').map(function (s) { return s.trim(); });
      if (lp.length < 3 || rp.length < 3) return;
      function side(cells, cheap) {
        return '<div class="kb-bill-side' + (cheap ? ' kb-cheap' : '') + '"><div class="kb-bill-who">' + esc(cells[0]) + '</div><div class="kb-bill-amt">' + esc(cells[1]) + '</div><div class="kb-bill-per">' + esc(cells[2]) + '</div></div>';
      }
      var day = rows[5] ? '<p class="kb-bill-day">' + esc(rows[5]).replace(/\$[\d.]+/g, function (m) { return '<b>' + m + '</b>'; }) + '</p>' : '';
      var div = document.createElement('div'); div.className = 'kb-bill';
      div.innerHTML = '<h4>' + esc(rows[0]) + '</h4><p class="kb-bill-sub">' + esc(rows[1]) + '</p><div class="kb-bill-vs">' + side(lp, false) + '<div class="kb-bill-mid">' + esc(rows[3]) + '</div>' + side(rp, true) + '</div>' + day;
      pre.replaceWith(div);
    });
    // Image placeholders → the original's real figures. A （上）/（下）
    // pair renders side by side, like the original's shot row.
    var imgs = BODYIMGS[article.id] || [];
    var notes = Array.prototype.slice.call(root.querySelectorAll('.img-note'));
    var made = notes.map(function (note, i) {
      var cap = (note.textContent || '').replace(/^🖼\s*配图：/, '').replace(/（原图随知识库保存，此线上版以文字标注位置）\s*$/, '').trim();
      if (!imgs[i]) {
        var miss = document.createElement('span'); miss.className = 'kb-img-missing'; miss.textContent = '图片未收录：' + cap;
        return { node: miss, cap: cap };
      }
      var fig = document.createElement('figure');
      var im = document.createElement('img'); im.src = imgs[i]; im.alt = cap; im.loading = 'lazy';
      fig.appendChild(im);
      if (cap) { var fc = document.createElement('figcaption'); fc.textContent = cap; fig.appendChild(fc); }
      return { node: fig, cap: cap };
    });
    for (var i = 0; i < notes.length; i++) {
      if (/（上）$/.test(made[i].cap) && i + 1 < notes.length && /（下）$/.test(made[i + 1].cap)) {
        var row = document.createElement('div'); row.className = 'kb-shot-row';
        row.appendChild(made[i].node); row.appendChild(made[i + 1].node);
        notes[i].replaceWith(row);
        notes[i + 1].remove();
        i++;
      } else {
        notes[i].replaceWith(made[i].node);
      }
    }
    // Example cards: an h3 opening with 例子 N wraps the blocks that
    // follow it, until the next heading or a figure.
    var kids = Array.prototype.slice.call(root.childNodes);
    var group = null;
    function flush() { group = null; }
    kids.forEach(function (node) {
      if (node.nodeType !== 1) { if (group) group.appendChild(node); return; }
      var name = node.nodeName;
      if (name === 'H3' && /^例子\s*\d/.test(node.textContent.trim())) {
        var box = document.createElement('div'); box.className = 'kb-example';
        root.insertBefore(box, node);
        box.appendChild(node);
        group = box;
        return;
      }
      if (name === 'H1' || name === 'H2' || name === 'H3' || name === 'FIGURE' || node.classList.contains('kb-shot-row')) { flush(); return; }
      if (group) group.appendChild(node);
    });
    // Component lists.
    Array.prototype.slice.call(root.querySelectorAll('ol,ul')).forEach(function (list) {
      if (list.parentElement && list.parentElement.closest('li')) return;
      classifyList(list, !!list.closest('.kb-example'));
    });
    // "A → B → C" paragraphs → step pills, final step highlighted.
    Array.prototype.slice.call(root.childNodes).forEach(function (node) {
      if (node.nodeType !== 1 || node.nodeName !== 'P') return;
      if (node.querySelector('*')) return;
      var segs = (node.textContent || '').split('→').map(function (s) { return s.trim().replace(/。$/, ''); });
      if (segs.length >= 3 && segs.length <= 7 && segs.every(function (s) { return s.length > 0 && s.length <= 10; })) {
        var div = document.createElement('div'); div.className = 'kb-steps';
        segs.forEach(function (s, si) {
          if (si > 0) { var ar = document.createElement('span'); ar.className = 'kb-arr'; ar.setAttribute('aria-hidden', 'true'); ar.textContent = '→'; div.appendChild(ar); }
          var sp = document.createElement('span'); sp.className = 'kb-step' + (si === segs.length - 1 ? ' kb-hot' : ''); sp.textContent = s; div.appendChild(sp);
        });
        node.replaceWith(div);
      }
    });
  }

  /* ------------------------------- Article ------------------------------- */

    var chars = stripHtml(a.html).replace(/\s/g, '').length;

      + '<span class="crumb">' + esc(a.category) + ' · ' + esc(a.title) + '</span>'

      + '<div class="art-meta"><span>更新于 ' + fmtDate(a.updated) + '</span><span>全文约 ' + chars.toLocaleString() + ' 字 · 阅读约 ' + minutes + ' 分钟</span></div>'

  function resetScroll() {

  function setActive(n) {

  var OVERRIDE_KEY = 'atlas_overrides';

      tags: stored.tags || [], pinned: !!stored.pinned,

      updated: String(stored.updated_at || '').slice(0, 10) || (base ? base.updated : ''),
      toc: r.toc, html: r.html, body: stored.body || '',

  /* Small Markdown -> {html, toc} renderer for added/edited articles.
     Mirrors scripts/build.py md_to_html, emitting this page's section
     markup: h2/h3 become sec-N anchors feeding the TOC, images become
     .img-note placeholders the body transform swaps for real figures,
     and ```bill fences stay language-bill blocks for the bill card. */
  function inlineMd(s) {
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

  }
  function mdRender(body) {
    var lines = String(body || '').split('\n'), out = [], toc = [], i = 0, secN = 0;
    function isTableSep(l) { return /^\s*\|[\s:|-]+\|\s*$/.test(l); }
    while (i < lines.length) {
      var line = lines[i];
      var fm = line.match(/^```(\w*)$/);

        while (i < lines.length && !/^```\w*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code' + (lang ? ' class="language-' + esc(lang) + '"' : '') + '>' + esc(buf.join('\n')) + '\n</code></pre>');
        continue;
      }
      if (line.trim().indexOf('|') === 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var header = line.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); });
        i += 2; var rows = [];
        while (i < lines.length && lines[i].trim().indexOf('|') === 0) {
          rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); })); i++;
        }
        var th = '<table><thead><tr>' + header.map(function (c) { return '<th>' + inlineMd(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
        rows.forEach(function (r) { th += '<tr>' + r.map(function (c) { return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>'; });
        out.push(th + '</tbody></table>');
        continue;
      }
      var hm = line.match(/^(#{1,4})\s+(.*)$/);
      if (hm) {
        var level = hm[1].length, raw = hm[2];
        var tm = raw.match(/<!--\s*toc:\s*(.*?)\s*-->/);

      if (line.trim().indexOf('<!--') === 0) { i++; continue; }

        while (i < lines.length && lines[i].indexOf('>') === 0) { bq.push(lines[i].replace(/^>\s?/, '')); i++; }

        continue;
      }
      if (line.trim() === '---' || line.trim() === '***' || line.trim() === '___') { out.push('<hr />'); i++; continue; }
      var im = line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/);

      if (/^\s*\d+[\.\)]\s+/.test(line)) {

        while (i < lines.length && /^\s*\d+[\.\)]\s+/.test(lines[i])) { oitems.push(lines[i].replace(/^\s*\d+[\.\)]\s+/, '')); i++; }
        out.push('<ol>' + oitems.map(function (x) { return '<li>' + inlineMd(x) + '</li>'; }).join('') + '</ol>');
        continue;
      }
      if (!line.trim()) { i++; continue; }
      var para = [line]; i++;
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*[-*]\s|\s*\d+[\.\)]\s+>|>|\|)/.test(lines[i]) && lines[i].trim().indexOf('<!--') !== 0) { para.push(lines[i]); i++; }
      out.push('<p>' + para.map(inlineMd).join(' ') + '</p>');
    }

  /* ------------------------------- Router -------------------------------

      app.innerHTML = '<main class="art-main"><header class="art-hero"><h1 class="art-title">文章不存在</h1>'
        + '<p class="art-summary">这篇文章可能已被删除，或链接不正确。</p></header>'
        + '<p><a href="../index.html">← 返回 Atlas</a></p></main>' + siteFooter();
    } else {
      renderArticle(vid);
      onScroll(null);
    }
  } else {
    window.addEventListener('hashchange', function () { if (navGuard) return; route(); });
    route();
  }

  /* Test hook (no-op in browsers): lets node --check-style tests require
     the pure functions without a DOM. */
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { mdRender: mdRender, toMarkdown: toMarkdown };
  }
})();
</script>
</body>
</html>
